// ---------- full screen: an Office dialog; the pane stays open and does the Excel work ----------
const CH = 12000;
function sendChunks(fn, obj){ const s = JSON.stringify(obj); const id = Math.random().toString(36).slice(2); const n = Math.max(1, Math.ceil(s.length / CH)); for (let i = 0; i < n; i++) fn(JSON.stringify({ c: id, i, n, d: s.slice(i * CH, (i + 1) * CH) })); }
function makeRx(handler){ const buf = {}; return str => { let m; try { m = JSON.parse(str); } catch { return; } if (!m || !m.c) return; const b = buf[m.c] || (buf[m.c] = []); b[m.i] = m.d; if (b.filter(x => x != null).length === m.n){ delete buf[m.c]; try { handler(JSON.parse(b.join(''))); } catch (e){ console.error(e); } } }; }
function packLoad(d, store){
  const tables = {};
  for (const [k, tb] of Object.entries(d.tables)){
    let last = tb.values.length - 1; while (last >= 0 && !tb.snap(last).some(v => v !== null && v !== '')) last--;
    tables[k] = { name: tb.name, sheet: tb.sheet, headers: tb.headers, values: tb.values.slice(0, last + 1), fm: tb.formulas.slice(0, last + 1).map(r => r.map(x => isF(x) ? '1' : '0').join('')), fcol: tb.formulaCol };
  }
  return { tables, ref: d.ref, besse: d.besse, besseSheet: d.besseSheet, dailyHdr: d.dailyHdr || null, profiles: d.profiles || [], rems: d.rems || [], vlog: d.vlog || [], docs: Object.fromEntries(DOC_KEYS.map(k => [k, store.getDoc(k)])) };
}
function hydrate(d){
  const tables = {};
  for (const [k, x] of Object.entries(d.tables)){ const tb = new Tbl(k, x.name, x.sheet, x.headers, x.values, x.fm.map(s => [...s].map(c => c === '1' ? '=' : ''))); tb.formulaCol = x.fcol; tables[k] = tb; }
  return { tables, ref: d.ref, besse: d.besse, besseSheet: d.besseSheet, dailyHdr: d.dailyHdr || null, profiles: d.profiles || [], rems: d.rems || [], vlog: d.vlog || [] };
}
function RemoteStore(){
  const pend = new Map(); let docs = {}; let onChanged = null;
  const rx = makeRx(m => { if (m.rid && pend.has(m.rid)){ const p = pend.get(m.rid); pend.delete(m.rid); m.ok ? p.res(m.res) : p.rej(new Error(m.err)); } else if (m.ev === 'changed' && onChanged) onChanged(); else if (m.ev === 'alerts'){ S.alertsOn = !!m.on; if (S.loaded) render(); } });
  Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, a => rx(a.message));
  const up = obj => sendChunks(s => Office.context.ui.messageParent(s), obj);
  const call = (op, args) => new Promise((res, rej) => { const rid = Math.random().toString(36).slice(2); pend.set(rid, { res, rej }); up({ rid, op, args }); setTimeout(() => { if (pend.has(rid)){ pend.delete(rid); rej(new Error('Excel didn’t answer. Keep the ESK Tracker panel open behind this window, then try again.')); } }, 45000); });
  return {
    live: true, remote: true,
    async load(){ const d = await call('load'); docs = d.docs || {}; return hydrate(d); },
    update: (k, r, snap, ch) => call('update', [k, r, snap, ch]),
    add: (k, ch) => call('add', [k, ch]),
    addMany: (k, list) => call('addMany', [k, list]),
    upsertBenefits: rows => call('upsertBenefits', [rows]),
    upsertRems: rows => call('upsertRems', [rows]),
    appendVisitLog: rows => call('appendVisitLog', [rows]),
    setCells: (sh, cells) => call('setCells', [sh, cells]),
    clearCells: (k, cells) => call('clearCells', [k, cells]),
    replaceAppts: rows => call('replaceAppts', [rows]),
    updateMany: (k, items) => call('updateMany', [k, items]),
    setDropdown: (...a) => call('setDropdown', a),
    saveProfile: p => call('saveProfile', [p]),
    getDoc: k => docs[k] ?? null,
    async setDoc(k, v){ docs[k] = v; await call('setDoc', [k, v]); },
    async freshDoc(k){ const v = await call('freshDoc', [k]); docs[k] = v; return v; },
    watch(cb){ onChanged = cb; },
    relayAlert(a){ up({ ev: 'alert', a }); },
    close(){ up({ ev: 'close' }); },
  };
}
let DLG = null;
// Full screen floats over the Excel page (an in-page Office dialog). Only ESK Bays can also pop out (pop: the same dialog as its own
// browser window, so a provider can keep it beside other work); the ESK Tracker itself has no separate-window option.
// Asked again while one is open (it may be hidden behind other windows): close it and open a fresh one.
function openFull(pop){
  pop = !!pop && S.provView;
  if (DLG){ try { DLG.close(); } catch {} DLG = null; S.full = false; }
  const url = location.href.replace(/[?#].*$/, '') + '?mode=dialog' + (S.provView ? '&view=bays' : '');
  Office.context.ui.displayDialogAsync(url, pop ? { height: 80, width: 50, displayInIframe: false } : { height: 96, width: 96, displayInIframe: true }, res => {
    if (res.status !== Office.AsyncResultStatus.Succeeded){ toast('bad', (pop ? 'Couldn’t pop out ESK Bays. Allow pop-ups for this site (icon at the right end of the address bar), then try again. ' : 'Couldn’t open full screen: ') + esc(res.error?.message || '')); return; }
    DLG = res.value; S.full = true; S.fullPop = pop; render();
    const reply = obj => { try { sendChunks(s => DLG && DLG.messageChild(s), obj); } catch (e){ console.error(e); } };
    const rx = makeRx(async m => {
      if (m.ev === 'close'){ try { DLG.close(); } catch {} DLG = null; S.full = false; reload(true); return; }
      if (m.ev === 'alert'){ if (alertsWinOk()) sendAlert(m.a || {}); else playSound(m.a?.sound); return; }   // an alert from the full-screen view, for the alerts window
      if (m.op === 'upsertBenefits'){ S._writing = true; try { reply({ rid: m.rid, ok: true, res: await S.store.upsertBenefits(...(m.args || [])) }); } catch (e){ reply({ rid: m.rid, ok: false, err: e.message || String(e) }); } finally { S._writing = false; S._selfWriteAt = Date.now(); } return; }   // Sohar benefits import from the full-screen view
      const { rid, op, args } = m;
      const read = op === 'load' || op === 'freshDoc';
      try { if (!['load','freshDoc','update','add','addMany','setCells','setDoc','clearCells','replaceAppts','saveProfile','updateMany','setDropdown','upsertRems','appendVisitLog'].includes(op)) throw new Error('Unknown request'); let res; if (op === 'load'){ const d = await S.store.load(); res = packLoad(d, S.store); } else if (read) res = await S.store.freshDoc(...(args || [])); else { S._writing = true; res = await S.store[op](...(args || [])); } reply({ rid, ok: true, res: res ?? null }); }
      catch (e){ reply({ rid, ok: false, err: e.message || String(e) }); }
      finally { if (!read){ S._writing = false; S._selfWriteAt = Date.now(); } }   // the dialog reloads after its own writes; don't relay them back
    });
    DLG.addEventHandler(Office.EventType.DialogMessageReceived, a => rx(a.message));
    DLG.addEventHandler(Office.EventType.DialogEventReceived, () => { DLG = null; S.full = false; S.notifyDialogAlerts = null; reload(true); });
    S.notifyDialog = () => reply({ ev: 'changed' });
    S.notifyDialogAlerts = on => reply({ ev: 'alerts', on }); S.notifyDialogAlerts(alertsWinOk());
  });
}

// dose confirmation with a Zofran PRN waiting for the PCT), a Provider B visit in Bay 4 ("In use" in ESK Bays), one booked in Bay 3.

  const vit = (bp, hr, o2, t) => ({ bp, hr, o2, at: t, by: CFG.me });
  const a = by('900101'), b = by('900104'), c = by('900110'), d = by('900113');

  if (a){ const adm = at(70), k = a.suggest;

      prnOrd: [{ id: 'demo1', med: 'Nifedipine', dose: '10 mg PO', reason: 'BP', by: 'Provider A', at: adm + 42, ts: Date.now(), ack: { by: CFG.me, time: hhmm(adm + 45), ts: Date.now() } }],
      rescue: [{ med: 'Nifedipine', dose: '10 mg PO', time: hhmm(adm + 45), reason: 'BP', ord: 'demo1' }],
      ...(k ? { pc: { at: adm, sn: String(k.serial || '').slice(-4), lot: String(k.lot || ''), kit: k.id, by: 'Provider A', ts: Date.now() } } : {}) };
    if (k){ const obj = { administeredmg: 84, dateadministered: { date: T }, treatingtechnician: CFG.me, supervisingphysician: 'Provider A' };
      if (!k.mrn) obj.mrn = mrnVal(a.a.mrn); if (!k.comments) obj.comments = nm(a.a.mrn);
      const { out } = changesFor('kits', obj); await S.store.update('kits', k.r, S.tables.kits.snap(k.r), out); } }
  if (b) S.visit[b.a.key] = { start: at(12), bay: '2', vit: { init: vit('148/94', '90', '97', at(12)) },
    prnOrd: [{ id: 'demo2', med: 'Zofran', dose: '4 mg ODT', reason: 'nausea', by: 'Provider A', at: at(4), ts: Date.now(), ack: null }] };
  if (c) S.visit[c.a.key] = { start: at(25), adm: at(20), bay: '4', mv: { prov: 'Provider B', time: c.a.time }, vit: { init: vit('120/78', '70', '99', at(25)) } };
  if (d) S.visit[d.a.key] = { bay: '3' };
  await saveVisit(); S._pvSeen = null; await reload(true); closeModal(); render();
}
// Browser full screen for the demo (outside Excel there is no Office dialog). Esc or the same button leaves it.
const fsOn = () => !!document.fullscreenElement;
function fsToggle(){ const p = fsOn() ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.(); p?.catch?.(() => toast('warn', 'This browser didn’t allow full screen here.')); }
document.addEventListener('fullscreenchange', () => { if (S.loaded) render(); });
let startDemo;
(function boot(){
  const demo = /[?&]demo\b/.test(location.search);
  S.provView = /[?&]view=bays\b/.test(location.search);   // the "ESK Bays" provider add-in
  S.mode = /[?&]mode=dialog\b/.test(location.search) ? 'dialog' : demo ? 'demo' : 'pane';
  const start = store => { S.store = store; useMsName(); return reload(true).then(() => store.watch?.(onWorkbookChange)); };
  // From the "not in Excel" page: start the demo in place (no page load), so the same click can also go full screen.
  startDemo = prov => { fsOn() || document.documentElement.requestFullscreen?.().catch(() => {});
    if (typeof history.replaceState === 'function') history.replaceState(null, '', '?demo=1' + (prov ? '&view=bays' : ''));   // office.js blanks it; the URL is only for reloads
    CFG_KEY = 'eskCfgDemo'; CFG = loadCfg(); applyTheme();
    S.provView = !!prov; S.mode = 'demo'; S.askedName = true; S.view = 'today'; $('#app').innerHTML = ''; start(DemoStore()).then(seedDemo); };
  if (S.mode === 'dialog'){ if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; } Office.onReady(() => start(RemoteStore())); return; }
  if (demo){ S.askedName = true; start(DemoStore()).then(seedDemo); if (location.hash === '#consent') setTimeout(() => openConsent(S.P[0]?.mrn), 1500); const hv = { '#dash':'today', '#schedule':'schedule', '#access':'access', '#settings':'settings' }[location.hash]; if (hv) setTimeout(() => { closeModal(); S.view = hv; render(); }, 1500); return; }   // demo screenshots: #consent opens the consent pop-up; #dash, #schedule, #access and #settings open that page (#dash also skips the first-run Settings page)
  if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; }
  let settled = false;
  Office.onReady(info => { settled = true; if (info.host === Office.HostType.Excel){ try { S.canFull = Office.context.requirements.isSetSupported('DialogApi', '1.2'); } catch { S.canFull = false; } start(OfficeStore()).then(() => { if (S.canFull && CFG.autoFull && S.loaded && !S.provView) openFull(); }); } else $('#app').innerHTML = notInExcelHTML(); });   // full screen opens after the first read, so the pane and the dialog don't both read the workbook while it opens
  setTimeout(() => { if (!settled) $('#app').innerHTML = notInExcelHTML(); }, 4000);
})();
