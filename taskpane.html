<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESK Tracker</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
/* ===== foundation: fonts ===== */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}

/* ===== foundation: tokens (old variable names kept) ===== */
:root{
  color-scheme:light;
  --bg:#F3F4F1;--surface:#FFFFFF;--surface2:#E9EBE6;--surface3:#F7F8F5;
  --ink:#1B211F;--muted:#616B66;--faint:#A3ABA6;--line:#E2E5DF;
  --accent:#1E6B59;--accent-ink:#FFFFFF;--accent-soft:#DDEDE6;
  --ok:#1E6B59;--ok-soft:#DDEDE6;--warn:#8F5400;--warn-soft:#FAE9CF;
  --bad:#B3261E;--bad-ink:#FFFFFF;--bad-soft:#F9DCD9;--info:#3D5E78;--info-soft:#E3EAF0;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,20,.05),0 12px 32px -14px rgba(16,24,20,.14);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  --scrim:rgba(16,24,20,.30);--wash:rgba(243,244,241,.6);
  --s1:#2a78d6;--s2:#eb6834;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#131716;--surface:#1B2220;--surface2:#252D2A;--surface3:#182019;--ink:#ECEFED;--muted:#9BA59F;--faint:#5C6763;--line:#2C3532;
  --accent:#6DC4A6;--accent-ink:#0E2A22;--accent-soft:#1D3A31;--ok:#6DC4A6;--ok-soft:#1D3A31;--warn:#E9B150;--warn-soft:#3A2D13;
  --bad:#F19189;--bad-ink:#3A0F0C;--bad-soft:#43211E;--info:#9DBAD3;--info-soft:#1F2B35;
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 12px 32px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.45);--wash:rgba(19,23,22,.6);
  --s1:#3987e5;--s2:#d95926;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131716;--surface:#1B2220;--surface2:#252D2A;--surface3:#182019;--ink:#ECEFED;--muted:#9BA59F;--faint:#5C6763;--line:#2C3532;
  --accent:#6DC4A6;--accent-ink:#0E2A22;--accent-soft:#1D3A31;--ok:#6DC4A6;--ok-soft:#1D3A31;--warn:#E9B150;--warn-soft:#3A2D13;
  --bad:#F19189;--bad-ink:#3A0F0C;--bad-soft:#43211E;--info:#9DBAD3;--info-soft:#1F2B35;
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 12px 32px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.45);--wash:rgba(19,23,22,.6);
  --s1:#3987e5;--s2:#d95926;}

/* ===== foundation: base ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.015em}
h2{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
h3{margin:14px 0 8px;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
h3:first-child{margin-top:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .faint{color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mono{font-family:var(--mono);font-size:13px}
.big{font-size:20px;font-weight:600;color:var(--accent)}
.warnText{color:var(--warn);font-weight:500} .okText{color:var(--ok)}
.printonly{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.spin{animation:sp 1.6s linear infinite!important}}

/* ===== foundation: shell (.app / .rail / .page) ===== */
.app{min-height:100vh}
@media (min-width:900px){.app{display:grid;grid-template-columns:224px minmax(0,1fr);align-items:start}}
.rail{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;height:100vh;overflow-y:auto;padding:20px 14px 16px;background:var(--surface3)}
.rail .brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:none;min-width:0;padding:4px 10px 18px;font-weight:600;letter-spacing:0}
.rail .brand .mlogo{height:40px;max-width:100%;margin-bottom:10px;border-radius:6px}
.rail .brand .bsep,.rail .brand .dot{display:none}
.rail .brand b,.rail .brand strong,.rail .brand>span{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.rail .brand small,.rail .brand .bt>span{display:block;font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rail .brand .bt{min-width:0;max-width:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.rail .nav{flex:1 0 auto}
.nav button,.rail .sec>button,.rail .sec>.btn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:500;text-align:left;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease}
.nav button:hover,.rail .sec>button:hover,.rail .sec>.btn:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"],.rail .sec>button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav>:not(.lo)+.lo{margin-top:auto}
.rail .n,.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:var(--bad-ink);font-size:12px;font-weight:600;line-height:1;display:inline-grid;place-items:center}
.rail .n.quiet,.nav .badge.neutral{background:var(--surface2);color:var(--muted)}
.rail .sec{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:14px}
.rail .nav+.sec{margin-top:0}
.conn{display:flex;gap:8px;align-items:center;padding:10px 12px 0;font-size:12px;color:var(--muted)}
.conn i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.conn.demo i,.conn.warn i{background:var(--warn)} .conn.bad i,.conn.off i{background:var(--bad)}
.page{min-width:0}
.topnote{padding:8px 28px;font-size:13px;color:var(--warn);background:var(--warn-soft)}
.page>.msg{margin:12px 28px 0}
.pbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:22px 28px 14px}
.pbar>div:first-child{flex:1 1 320px;min-width:0}
.pbar h1 span{color:var(--muted);font-weight:400;font-size:17px;margin-left:.25em}
.pbar .sub{margin-top:3px;color:var(--muted)}
.pbar .sub strong{color:var(--bad);font-weight:500}
.pbar .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto;min-width:0}
input.search,input.fld.search{width:300px;flex:0 1 300px;min-width:180px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.search::placeholder{color:var(--muted)}
main{padding:4px 28px 32px;max-width:1500px;margin:0 auto}
.page main{max-width:none;margin:0}
main>.alert{margin:0 0 16px}
.app.full main{padding-top:28px}
@media (max-width:899px){main>.alert{margin-bottom:12px}.app.full .rail{padding-bottom:8px}.app.full main{padding-top:12px}}
@media (max-width:899px){
  .rail{height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px 0;background:var(--surface3);box-shadow:0 1px 0 var(--line)}
  .rail .brand{order:0;flex:1 0 auto;max-width:100%;flex-direction:row;align-items:center;gap:8px;padding:0;min-width:0}
  .rail .brand .mlogo{height:26px;margin:0;flex:none}
  .rail .brand .bt{display:flex;align-items:baseline;gap:8px;min-width:0}
  .rail .brand b,.rail .brand strong,.rail .brand>span{font-size:15px}
  .rail .brand small,.rail .brand .bt>span{flex:0 1 auto;min-width:0}
  .rail .sec{order:1;flex:0 1 auto;min-width:0;flex-direction:row;align-items:center;gap:4px;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
  .rail .sec>button,.rail .sec>.btn{width:auto;flex:none;min-height:36px;padding:0 10px;font-size:14px}
  .rail .conn{order:9;padding:0 4px;gap:0}
  .rail .conn .ct{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .rail .nav{order:2;flex:1 0 100%;flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 0 8px;margin:0 -12px;padding-left:12px;padding-right:12px}
  .rail .nav::-webkit-scrollbar,.rail .sec::-webkit-scrollbar{display:none}
  .rail .nav button{width:auto;flex:none;min-height:38px;padding:0 12px;font-size:14px}
  .nav>:not(.lo)+.lo{margin-top:0}
  .rail .n,.nav .badge{margin-left:2px}
  .topnote{padding:8px 12px}
  .page>.msg{margin:10px 12px 0}
  .pbar{flex-direction:column;align-items:stretch;padding:14px 12px 10px;gap:10px}
  .pbar>div:first-child{flex:none}
  .pbar .tools{justify-content:flex-start}
  .pbar h1{font-size:21px}
  .pbar .tools{width:100%}
  input.search,input.fld.search{width:100%;flex:1 1 100%}
  main{padding:4px 12px 24px}
}
@media (max-width:420px){.rail .brand .mlogo{display:none}.rail .brand small,.rail .brand .bt>span{display:none}}

/* old top header (kept until the shell switches to .app) */
header.top{position:sticky;top:0;z-index:5;background:var(--surface3);box-shadow:0 1px 0 var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.brand{font-weight:600;letter-spacing:.1px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600}
.brand .mlogo{height:34px;width:auto;flex:none;border-radius:6px}
.brand .bsep{width:1px;height:22px;background:var(--line);flex:none}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .brand .mlogo{background:#fff;padding:2px 5px}}
:root[data-theme="dark"] .brand .mlogo{background:#fff;padding:2px 5px}
.brand > span:not(.bsep){white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:460px){header.top .brand .mlogo{height:26px}header.top .brand .bsep{display:none}header.top .brand small{display:none}}
@media(max-width:600px){.hdrc .hl{display:none}.btn.hdrc{min-width:36px;padding:0 10px}}
@media(max-width:420px){header.top .brand .mlogo,header.top .brand .bsep{display:none}}
.iconbtn{border:0;background:var(--surface2);border-radius:12px;min-width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
nav.tabs{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;padding:0 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:500;min-height:40px}
nav.tabs button:hover{background:var(--surface2);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:7px 12px;text-align:center;font-weight:500}

/* ===== foundation: layout helpers ===== */
.cols{display:block}
@media(min-width:1000px){.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}.cols.swap{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}.cols>div>.card:first-child{margin-top:0}}
.cols2{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.cols2>*{min-width:0}
.cols2>.card{margin:0}
@media (min-width:1180px){
  .cols2.q{grid-template-columns:300px minmax(0,1fr)}
  .cols2.t{grid-template-columns:360px minmax(0,1fr)}
  .cols2.m{grid-template-columns:340px minmax(0,1fr)}
  .cols2.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cols2.detail{grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr)}
}
@media (max-width:899px){.cols2{gap:12px}}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:420px){.form2{grid-template-columns:1fr}}

/* ===== foundation: cards and flat sections ===== */
.card{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin:0 0 16px}
.card h2{margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px}
.card h2 .sp{flex:1}
.card .card{background:var(--surface3);box-shadow:none;border-radius:12px;padding:14px 16px}
@media (max-width:899px){.card{padding:14px;border-radius:14px;margin-bottom:12px}}
.list{display:flex;flex-direction:column;gap:0}
.item{border:0;border-radius:0;padding:12px 0;background:transparent}
.item+.item,.list>.item+.item{border-top:1px solid var(--line)}
.item[class*="st-"]{padding-left:14px;box-shadow:inset 3px 0 0 var(--line)}
.item.st-done{box-shadow:inset 3px 0 0 var(--ok)} .item.st-pulled{box-shadow:inset 3px 0 0 var(--info)} .item.st-todo{box-shadow:inset 3px 0 0 var(--warn)} .item.st-bad{box-shadow:inset 3px 0 0 var(--bad)} .item.st-off,.item.st-onhand{box-shadow:inset 3px 0 0 var(--line)} .item.st-check{box-shadow:inset 3px 0 0 var(--warn)}
.item.target{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.item.flash{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.item .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .time{font-weight:600;min-width:64px}
.item .name{font-weight:600}
.item .meta{color:var(--muted);font-size:13px}
.item .line{margin-top:6px;font-size:14px}
.item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.asec{border:0;border-radius:12px;padding:12px 14px;margin-top:12px}
.asec.red{background:var(--bad-soft)} .asec.blue{background:var(--info-soft)} .asec.amber{background:var(--warn-soft)} .asec.gray{background:var(--surface3)}
.asec.madrs{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)} .asec.madrs h3{display:flex;align-items:center;gap:8px}
.asec h3{margin:0 0 6px;color:inherit;font-size:15px;font-weight:600}
.asec .srow{margin-top:0}
.asec.admin>summary{cursor:pointer;font-weight:600}
.asec .ah{margin:10px 0 2px;font-size:13px;font-weight:600}
.dayblock{background:var(--surface3);border:0;border-radius:12px;padding:12px 14px;margin:12px 0}
.dayblock.today{background:var(--accent-soft)} .dayblock.due{background:var(--surface3);box-shadow:inset 3px 0 0 var(--warn)}
.dayblock .bh{display:flex;align-items:baseline;gap:8px;cursor:default;list-style:none}
details.dayblock>summary.bh{cursor:pointer;min-height:32px;align-items:center} details.dayblock>summary::-webkit-details-marker{display:none}
details.dayblock>summary.bh::after{content:"▸";margin-left:auto;color:var(--muted)} details.dayblock[open]>summary.bh::after{content:"▾"}
.dayblock .bh span{color:var(--muted);font-size:13px}
.srow{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0;margin-top:0}
.srow .name{font-weight:600} .srow .meta{color:var(--muted);font-size:13px;margin-left:6px} .srow .line{margin-top:4px}
.srow .head{display:flex;align-items:baseline;gap:4px 6px;flex-wrap:wrap} .srow .head .meta{flex:1 1 auto}
.snz{display:inline-flex;align-items:baseline;gap:8px;margin-left:auto;font-size:13px;white-space:nowrap} .snz .linkbtn{padding:0;font-size:13px;min-height:0} .snzfoot{margin-top:8px} .todos li .snz{margin-left:6px}
.osec{border:0;border-left:4px solid;border-radius:10px;padding:10px 14px;margin-top:10px}
.next{display:flex;gap:10px;align-items:center;background:var(--surface3);border-radius:12px;padding:12px 14px;font-weight:500}
.next .n{font-size:18px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);font-weight:600}
.dayhead b{font-size:15px;font-weight:600} .dayhead span{color:var(--muted);font-size:13px;font-weight:400}
.empty{padding:24px 18px;text-align:center;color:var(--muted)}

/* ===== foundation: buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--surface2);color:var(--ink);font-weight:500;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background .2s ease,opacity .2s ease}
.btn:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent),var(--ink) 14%)}
.btn.primary.late,.btn.bad{background:var(--bad);color:var(--bad-ink)}
.btn.primary.late:hover,.btn.bad:hover{background:color-mix(in srgb,var(--bad),var(--ink) 14%)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 12px}
.btn.ghost:hover{background:var(--surface2)}
.btn.ghost.mute{color:var(--muted)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.btn.inline{min-height:0;padding:0;background:none;color:inherit;border-radius:4px;text-decoration:underline dotted;text-underline-offset:3px}
.btn.inline:hover{background:none;color:var(--accent)}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface2)} .btn.primary:disabled:hover{background:var(--accent)} .btn.ghost:disabled:hover{background:transparent}
@media (max-width:899px){.btn{min-height:40px;padding:0 14px}.btn.sm{min-height:34px;padding:0 10px}.btn.lg{min-height:48px;padding:0 20px}.btn.ghost{padding:0 10px}.btn.inline{min-height:0;padding:0}}
.linkbtn{display:inline-flex;align-items:center;min-height:32px;background:none;border:0;color:var(--accent);font-weight:500;cursor:pointer;padding:4px 2px;font-size:14px;border-radius:6px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.x{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:6px;opacity:.7} .x:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}

/* ===== foundation: tags, chips, badges ===== */
.chip,.pill,.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border:0;border-radius:8px;font-size:12px;font-weight:500;line-height:1.5;background:var(--surface2);color:var(--muted);white-space:nowrap;vertical-align:baseline}
.chip.ok,.pill.ok,.tag.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn,.pill.warn,.tag.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad,.pill.bad,.tag.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info,.pill.info,.tag.info{background:var(--info-soft);color:var(--info)}
.chip.acc,.pill.acc,.tag.acc{background:var(--accent-soft);color:var(--accent)}
.pill.start{background:#ece4fb;color:#5b3aa8}
:root[data-theme="dark"] .pill.start{background:#2f2645;color:#c7b3f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.start{background:#2f2645;color:#c7b3f5}}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:var(--bad-ink);font-size:12px;font-weight:600;line-height:1;margin-left:4px}
.badge.neutral{background:var(--surface2);color:var(--muted)}
nav.tabs button[aria-current="page"] .badge{background:var(--bad);color:var(--bad-ink)}
.apptcount{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.safe{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.5px;padding:2px 8px;border-radius:6px;border:1.5px solid}
.safe.besse{color:#8a3a17;background:#f7e4d9;border-color:#d9a58a} .safe.genoa{color:#0d5d57;background:#dcf1ee;border-color:#8cc9c1} .safe.other{color:#5b4a8a;background:#ebe6f7;border-color:#b7aadb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .safe.besse{color:#f3b597;background:#3a2419;border-color:#7a4a33}:root:not([data-theme="light"]) .safe.genoa{color:#8fdad0;background:#16302d;border-color:#2f6c65}}
:root[data-theme="dark"] .safe.besse{color:#f3b597;background:#3a2419;border-color:#7a4a33} :root[data-theme="dark"] .safe.genoa{color:#8fdad0;background:#16302d;border-color:#2f6c65}
.flag{display:inline-flex;align-items:center;gap:2px;border-radius:8px;padding:2px 4px 2px 9px;font-weight:500;font-size:12px}
.flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.bad{background:var(--bad-soft);color:var(--bad)}
.note{display:inline-flex;align-items:center;gap:6px;background:var(--info-soft);color:var(--ink);border-radius:8px;padding:3px 4px 3px 9px;font-size:13px}
.note .nby{color:var(--muted);font-size:12px}
.addnote{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:3px 9px;font-size:13px;cursor:pointer;min-height:28px} .addnote:hover{border-color:var(--accent);color:var(--accent)}
.mpill{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600;letter-spacing:.4px;background:var(--bad);color:var(--bad-ink)}
.mpill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fx{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}

/* ===== foundation: fields ===== */
input.fld,select.fld,textarea.fld{width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:12px;background:var(--bg);color:var(--ink)}
textarea.fld{line-height:1.45}
input.fld::placeholder,textarea.fld::placeholder{color:var(--muted)}
input.fld:focus,select.fld:focus,textarea.fld:focus{outline:2px solid var(--accent);outline-offset:0}
.card input.fld:not(.search),.card select.fld,.card textarea.fld,.sheet input.fld,.sheet select.fld,.sheet textarea.fld{background:var(--bg)}
.ro{background:var(--surface2)!important;color:var(--muted)}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:400}
label.lbl:first-child{margin-top:0}
.noteIn{max-width:320px;min-height:36px;padding:6px 10px}
input.ov{width:100%;max-width:76px;font-size:20px;font-weight:600;text-align:right;border:0;border-radius:10px;padding:6px 8px;background:var(--bg)}
.scan{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border:0;border-radius:12px;padding:10px}
.scan input{flex:1;min-width:0;min-height:44px;border:0;border-radius:10px;padding:10px 12px;background:var(--surface);font-family:var(--mono);font-size:14px}
.scan input:focus{outline:2px solid var(--accent);outline-offset:0}
.check{display:flex;align-items:center;gap:14px;min-height:50px;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.check .l{flex:1;min-width:0} .check .l small{display:block;color:var(--muted);font-size:13px}
.check+.check{border-top:1px solid var(--line)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}

/* ===== foundation: segmented controls ===== */
.seg{display:inline-flex;gap:6px;flex-wrap:wrap;border:0;background:transparent}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--surface2);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.seg button:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--surface2);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.subnav button:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.subnav button[aria-pressed="true"] .badge{background:var(--bad);color:var(--bad-ink)}

/* ===== foundation: tables ===== */
.tw{overflow-x:auto;border:0;border-radius:0}
table.t{border-collapse:collapse;width:100%;font-size:14px;background:transparent}
table.t th,table.t td{padding:11px 10px;border:0;text-align:left;white-space:nowrap}
table.t th{padding:8px 10px 10px;background:transparent;font-size:13px;font-weight:500;color:var(--muted)}
table.t th:first-child,table.t td:first-child{padding-left:12px;border-radius:10px 0 0 10px}
table.t th:last-child,table.t td:last-child{border-radius:0 10px 10px 0}
table.t tbody tr:hover td{background:var(--surface3)}
table.t td.num,table.t th.num{text-align:right}
table.t td b{font-weight:600}
table.t.wrap th{white-space:normal;vertical-align:bottom} table.t.wrap td.lbl{white-space:normal;min-width:110px} table.t.wrap td{vertical-align:top}
table.t tr.tot td{background:var(--surface3);font-weight:600;border-radius:0}
table.rt td{vertical-align:middle}
table.rt td .row{gap:6px}
@media(max-width:899px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border-bottom:1px solid var(--line)!important;padding:10px 4px}
  table.rt tbody tr:hover td{background:transparent}
  table.rt td{border:0!important;border-radius:0!important;padding:2px 0!important;white-space:normal;display:flex;gap:10px;align-items:center;text-align:left!important;min-height:0}
  table.rt td[data-l]:not([data-l=""])::before{content:attr(data-l);color:var(--muted);font-size:13px;min-width:88px;flex:none}
  table.rt td:empty{display:none}
}

/* ===== foundation: messages, stats, tiles ===== */
.msg{border:0;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.msg.fresh{display:block}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.info{background:var(--info-soft);color:var(--info)}
.msg b{color:inherit}
.alert{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;margin:14px 0 0;padding:12px 16px;border:0;border-radius:12px;background:var(--bad-soft);color:var(--ink)}
.alert:first-child{margin-top:0}
.alert p{margin:0;flex:1 1 220px;min-width:0}
.alert>b:first-child,.alert>strong:first-child,.alert p b{color:var(--bad);font-weight:600}
.alert.warn{background:var(--warn-soft)} .alert.warn>b:first-child,.alert.warn>strong:first-child,.alert.warn p b{color:var(--warn)}
.alert.info{background:var(--info-soft)} .alert.info>b:first-child,.alert.info>strong:first-child,.alert.info p b{color:var(--info)}
.stats,.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat,.tile{padding:14px 16px;border:0;border-radius:12px;background:var(--surface2);box-shadow:none;min-width:0}
.stat .n,.tile>b{display:block;font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.stat .l,.tile>span{display:block;font-size:13px;color:var(--muted)}
.tile.bad>b{color:var(--bad)} .tile.warn>b{color:var(--warn)} .tile.ok>b{color:var(--ok)} .tile.info>b{color:var(--info)}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.tile:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
@media (max-width:899px){.stats,.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat,.tile{padding:12px 14px}.stat .n,.tile>b{font-size:22px}}
.writes{background:var(--surface3);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.writes code{font-family:var(--mono)}
.kv,.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;font-size:14px;margin:0}
.kv{gap:4px 12px}
.kv dt,.facts dt{color:var(--muted)} .kv dd,.facts dd{margin:0;min-width:0}
.facts>div{display:contents}   /* factsDL wraps each dt/dd pair in a div; the pairs sit on the dl grid */
@media (max-width:899px){.facts{gap:6px 12px}}
.lead{font-size:18px;font-weight:500;line-height:1.35;margin:0}
.lead.late{color:var(--bad)} .lead.soon{color:var(--warn)}
.code{font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.code span{margin-left:10px;font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0}
@media (max-width:899px){.code{font-size:24px}.code span{font-size:15px}}

/* ===== foundation: queue rows (.qrow), dots, strip, live state (.st) ===== */
.qrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px;border:0;border-radius:12px;background:transparent;color:inherit;font:inherit;text-align:left;text-decoration:none;cursor:pointer;transition:background .2s ease}
.qrow:hover{background:var(--surface2)}
.qrow[aria-current="true"],.qrow[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.qrow .who{flex:1;min-width:0}
.qrow b,.qrow .t{font-weight:600}
.qrow small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.qrow .st,.qrow .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tags{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.qdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--faint)}
.qdot.ok{background:var(--ok)} .qdot.soon{background:var(--warn)} .qdot.late{background:var(--bad)}
.qstrip{display:flex;align-items:stretch;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 10px;margin:0 -2px}
.qstrip>h2,.qstrip>.glab{flex:none;align-self:center;margin:0 2px 0 6px;white-space:nowrap}
.qstrip>h2:first-child,.qstrip>.glab:first-child{margin-left:0}
.qstrip .qrow{flex:none;width:auto;min-width:170px;max-width:240px;scroll-snap-align:start;background:var(--surface);box-shadow:var(--shadow)}
.qstrip .qrow[aria-current="true"]{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.st{font-size:13px;color:var(--muted)}
.st.bad{color:var(--bad);font-weight:500} .st.warn{color:var(--warn);font-weight:500} .st.ok{color:var(--ok);font-weight:500} .st.info{color:var(--info)}

/* ===== foundation: tasks (.task) ===== */
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:13px 0}
.task+.task{border-top:1px solid var(--line)}
.task>.t{font-weight:500;min-width:0}
.task>.d{grid-column:1;font-size:13px;color:var(--muted);min-width:0}
.task>.btn,.task>.tb{grid-column:2;grid-row:1/3;align-self:center;white-space:nowrap}
.task>details,.task>.body{grid-column:1/-1;margin-top:6px;min-width:0}
.task>details>summary{display:inline-flex;align-items:center;gap:6px;min-height:32px;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer;list-style:none}
.task>details>summary::-webkit-details-marker{display:none}
.task>details>summary::before{content:"▸";color:var(--muted)} .task>details[open]>summary::before{content:"▾"}
.task>details>:not(summary){margin-top:8px}
.task.current{margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:12px;background:var(--surface3);border-top-color:transparent}
.task.current+.task{border-top-color:transparent}
.task.current>.t{font-weight:600}
.task.done{display:flex;align-items:center;gap:8px;padding:9px 0}
.task.done>.t{flex:none;max-width:60%;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done>.t::before{content:"✓ ";color:var(--ok)}
.task.done>.d{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done>.btn,.task.done>.tb{margin-left:auto;flex:none}
.task.done>details,.task.done>.body{display:none}
.task.bad>.d{color:var(--bad);font-weight:500} .task.warn>.d{color:var(--warn);font-weight:500} .task.ok>.d{color:var(--ok)} .task.info>.d{color:var(--info)}
@media (max-width:899px){.task{gap:2px 10px;padding:11px 0}.task.current{margin:0 -8px;padding-left:8px;padding-right:8px}}

/* ===== foundation: details folds ===== */
details.sec>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;min-height:36px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted)}
details.sec[open]>summary::before{content:"▾"}
details.fold>summary{list-style:none;cursor:pointer} details.fold>summary::-webkit-details-marker{display:none} details.fold>summary h2{margin-bottom:0;min-height:32px} details.fold[open]>summary h2{margin-bottom:10px}
details.fold>summary h2::after{content:"▸";margin-left:auto;color:var(--muted);font-weight:400} details.fold[open]>summary h2::after{content:"▾"}
.vtl summary{cursor:pointer}

/* ===== foundation: overlays (modal, consent float, toast, busy) ===== */
#modal{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#modal .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:22px 24px;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
#modal .sheet.wide{max-width:980px}
@media(min-width:700px){#modal{align-items:center;padding:16px}#modal .sheet{border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}}
@media(max-width:699px){#modal .sheet{padding:18px 16px}}
.sheet h2{margin:0 0 6px;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
#cfloat{position:fixed;inset:0;z-index:25;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:2vh 2vw}
#cfloat iframe{width:min(920px,100%);height:100%;border:0;border-radius:16px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:520px}
#toast .msg{margin:0;box-shadow:var(--shadow),0 4px 16px rgba(0,0,0,.12);pointer-events:auto;width:100%}
#busy{position:fixed;inset:0;background:var(--wash);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:500}
#busy[hidden]{display:none}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.emailprev{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;color:#222;max-height:55vh;overflow:auto}
iframe.print{width:100%;height:70vh;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.mplist{display:grid;gap:2px;margin:10px 0;max-height:320px;overflow:auto;border:0;border-radius:12px;padding:6px 10px;background:var(--surface3)} .mprow{display:flex;align-items:center;gap:8px;padding:4px 0}

/* ===== foundation: Today pieces the 20 s timer and current pages use ===== */
.floor{margin-top:12px;padding:10px 12px;border:0;border-radius:12px;background:var(--surface3)} .floor>b{font-size:13px;font-weight:500;color:var(--muted)}
.floor .flrow{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 0 2px}
.floor .fl{flex:none;display:grid;gap:2px;text-align:left;min-width:150px;padding:8px 12px;border:0;border-radius:10px;background:var(--surface);cursor:pointer;scroll-snap-align:start;font:inherit;color:inherit} .floor .fl:hover{background:var(--surface2)} .floor .name{font-weight:600}
.floor .fl .bay{font-weight:600;color:var(--info)}
.track{position:relative;height:58px;margin:4px 10px 0}
.track .tbar,.track .tfill{position:absolute;left:0;top:9px;height:6px;border-radius:3px} .track .tbar{right:0;background:var(--surface2)} .track .tfill{background:var(--accent);transition:width 1s linear}
.track .tmark{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--faint);transform:translateX(-50%)}
.track .tmark.done{background:var(--accent);box-shadow:none} .track .tmark.late{background:var(--bad);box-shadow:none} .track .tmark.soon{box-shadow:inset 0 0 0 3px var(--warn)} .track .tmark.due{box-shadow:inset 0 0 0 3px var(--accent)}
.track .tlb{position:absolute;top:25px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap;text-align:center;line-height:1.25}
.track .tlb b{display:block;font-size:14px;font-weight:600;color:var(--ink)} .track .tlb.start{transform:translateX(-10px);text-align:left} .track .tlb.end{transform:translateX(calc(-100% + 10px));text-align:right}
.track .tnow{position:absolute;top:0;width:2px;height:24px;background:var(--ink);transform:translateX(-50%);transition:left 1s linear}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)} .step:first-child{border-top:0}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.step.done .n{background:var(--accent-soft);color:var(--accent)} .step.active .n{background:var(--ink);color:var(--bg)} .step.late .n{background:var(--bad);color:var(--bad-ink)} .step.soon .n{background:var(--warn);color:var(--surface)}
.step .t{font-weight:500;font-size:14px} .step.upcoming .t,.step.up .t{font-weight:400;color:var(--muted)}
.step .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)} .step .m .vv{color:var(--ink);font-weight:500;font-size:13px;padding:0}
.step .w{text-align:right;white-space:nowrap;font-size:13px;color:var(--muted)} .step.late .w{color:var(--bad);font-weight:500} .step.soon .w{color:var(--warn);font-weight:500}
.step .tm{font-weight:600;font-size:14px;color:var(--ink);padding:0}
.vdue{background:none;border:0;padding:0;cursor:pointer;font:inherit} .vdue .chip{box-shadow:inset 0 0 0 1px currentColor}
.vit{display:inline-flex;align-items:center;gap:4px;min-height:32px;border:0;border-radius:8px;padding:2px 9px;background:var(--surface2);color:inherit;font:inherit;font-size:13px;cursor:pointer}
.vit:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.vit.on{background:var(--ok-soft);color:var(--ink)} .vit .muted{font-size:12px}
.vitgrid{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:8px;align-items:center;margin-top:6px}
@media(max-width:520px){.vitgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.vitgrid .vh{grid-column:1/-1;font-weight:600}}

/* ===== foundation: older page pieces (kept, flattened) ===== */
.docrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.docrow .lab{font-weight:600;margin-right:2px}
.doc{display:inline-flex;align-items:center;gap:4px;min-height:28px;border:0;border-radius:8px;padding:2px 9px;background:var(--surface2);font-size:13px;line-height:1.5;color:var(--muted)}
button.doc{cursor:pointer} button.doc:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.doc.split{padding:0;overflow:hidden} .doc.split .tick{border:0;background:transparent;color:inherit;font:inherit;padding:2px 4px 2px 9px;cursor:pointer}
.doc.split a{color:inherit;text-decoration:underline;text-underline-offset:2px;padding:2px 9px 2px 0} .doc.split:hover{background:color-mix(in srgb,var(--surface2),var(--ink) 7%)}
.doc.on{background:var(--ok-soft);color:var(--ok);font-weight:500}

<div id="app"></div>

<script>
'use strict';
/* =====================================================================
   ESK Tracker — Excel add-in task pane
   Reads and writes the Esketamine Master Tracker workbook in place.
   - Finds tables by their headers (not by name or position).
   - Never writes into a formula cell.
   - Re-checks a row before writing; if someone changed it, it stops.
   ===================================================================== */

// ---------- small utils ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const isF = x => typeof x === 'string' && x.startsWith('=');
const blank = v => (v === '' || v === undefined) ? null : v;
const MS = 864e5;
const ymd = (y,m,d) => Math.round(Date.UTC(y, m-1, d) / MS) + 25569;
const todaySerial = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); };
const sDate = s => new Date((s - 25569) * MS);
const dowOf = s => sDate(s).getUTCDay();
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtD(s, mode){ if (s == null) return '—'; const d = sDate(s); const t = `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  return mode === 'dow' ? `${DOW[d.getUTCDay()]} ${t}` : mode === 'full' ? `${t}/${d.getUTCFullYear()}` : t; }
const isoOf = s => s == null ? '' : sDate(s).toISOString().slice(0,10);
function fromIso(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? ymd(+m[1], +m[2], +m[3]) : null; }
function fmtT(m){ if (m == null) return ''; let h = Math.floor(m/60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(mi).padStart(2,'0')} ${ap}`; }
function toSerial(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return (v > 1000 && v < 100000) ? Math.floor(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m){ let y = +m[3]; if (y < 100) y += 2000; return ymd(y, +m[1], +m[2]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return ymd(+m[1], +m[2], +m[3]);
  return null;
}
function toMinutes(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Math.round((v % 1) * 1440) % 1440;
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})\s*([AP]M)?/i); if (!m) return null;
  let h = +m[1]; if (m[3]){ if (/pm/i.test(m[3]) && h < 12) h += 12; if (/am/i.test(m[3]) && h === 12) h = 0; }
  return h*60 + +m[2];
}
const mrnKey = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return String(Math.round(v)); return String(v).trim().replace(/\.0+$/, ''); };
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const yes = v => /^(y|yes|true|x)$/i.test(String(v ?? '').trim());
const cleanScan = s => String(s ?? '').replace(/[\x00-\x1f\x7f]/g, '').trim();
const normScan = s => cleanScan(s).replace(/\s+/g, '').toUpperCase();
function pharmOf(v){ const s = String(v ?? '').toUpperCase(); if (s.includes('BESSE')) return 'BESSE'; if (s.includes('GENOA')) return 'GENOA'; return s.trim() ? 'OTHER' : ''; }
const PH_LABEL = { BESSE:'Besse', GENOA:'Genoa', OTHER:'Other', '':'—' };

// ---------- Sohar benefits: parsing and merging (no Excel calls; tests/benefits.test.js runs this block in Node) ----------
// Input: the "Final tracker file" from the Sohar Eligibility add-in (CSV or xlsx). Output: the Benefits tab, table tblBenefits.
const BEN_SHEET = 'Benefits', BEN_TABLE = 'tblBenefits';
const BEN_COLS = ['MRN', 'Patient Name', 'Per Nbr', 'Sohar Payer', 'Plan', 'Network', 'Coverage Level', 'Coverage Start', 'Coverage End', 'Copay', 'Coinsurance', 'Deductible', 'Deductible Remaining', 'Deductible Status', 'OOP Max', 'OOP Remaining', 'OOP Status', 'Benefit Flag', 'Sohar Status', 'Sohar Date', 'Source', 'Imported'];
const BEN_IN = ['pernbr', 'mrn', 'soharpayer', 'plan', 'network', 'coveragelevel', 'coveragestart', 'coverageend', 'copay', 'coinsurance', 'deductible', 'deductibleremaining', 'deductiblestatus', 'oopmax', 'oopremaining', 'oopstatus', 'benefitflag', 'soharstatus', 'sohardate', 'service', 'source', 'exported'];   // file columns used (names and DOB are not read)
// MRN match key: like mrnKey, then ignoring case, punctuation and leading zeros.
const benKey = v => mrnKey(v).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/^0+(?=.)/, '');
const benElig = s => /\beligible\b/i.test(String(s ?? '')) && !/ineligible|not\s*eligible/i.test(String(s ?? ''));
function parseCSV(text){
  const s = String(text ?? '').replace(/^﻿/, ''), rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ if (c === '"'){ if (s[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && s[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
// Sohar Date as a sortable number (ms); null if it can't be read.
function sohTime(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Math.round((v - 25569) * 864e5);
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AP]M)?)?/i);
  if (m){ let y = +m[3], h = +(m[4] || 0); if (y < 100) y += 2000; if (m[7]){ if (/p/i.test(m[7]) && h < 12) h += 12; if (/a/i.test(m[7]) && h === 12) h = 0; } return Date.UTC(y, +m[1] - 1, +m[2], h, +(m[5] || 0), +(m[6] || 0)); }
  const t = Date.parse(s); return isNaN(t) ? null : t;
}
const sohShort = v => { const s = String(v ?? '').trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${+m[2]}/${+m[3]}`; m = s.match(/^(\d{1,2})\/(\d{1,2})/); return m ? `${+m[1]}/${+m[2]}` : s; };
// Rows of the file (array of arrays) → { rows:[{ mrn, key, t, …BEN_IN }], hasService, exported } or null if it isn't the Sohar file.
function parseBenefits(aoa){
  const hr = (aoa || []).findIndex(r => { const h = (r || []).map(norm); return h.includes('mrn') && (h.includes('deductibleremaining') || h.includes('oopremaining')); });
  if (hr < 0) return null;
  const hn = aoa[hr].map(norm), ix = {}; BEN_IN.forEach(k => { ix[k] = hn.indexOf(k); });
  const rows = [];
  for (const r of aoa.slice(hr + 1)){
    const o = {}; BEN_IN.forEach(k => { o[k] = ix[k] < 0 ? '' : String(r[ix[k]] ?? '').trim(); });
    o.mrn = mrnKey(ix.mrn < 0 ? '' : r[ix.mrn]); o.key = benKey(o.mrn); if (!o.key) continue;
    o.t = sohTime(o.sohardate); rows.push(o);
  }
  return { rows, hasService: ix.service >= 0, exported: (rows.find(o => o.exported) || {}).exported || '' };
}
// Latest row per MRN (by Sohar Date; a tie goes to the later line), matched to Master Patient Tracker patients ([{ mrn, name }]).
function planBenefits(rows, patients){
  const byKey = new Map(); for (const p of patients || []){ const k = benKey(p.mrn); if (k && !byKey.has(k)) byKey.set(k, p); }
  const latest = new Map();
  for (const o of rows){ const was = latest.get(o.key); if (!was || (o.t ?? -Infinity) >= (was.t ?? -Infinity)) latest.set(o.key, o); }
  const matched = [], eskMissing = []; let skipped = 0;
  for (const o of latest.values()){
    const p = byKey.get(o.key);
    if (p) matched.push({ row: o, p });
    else if (/\besk\b/i.test(o.service)) eskMissing.push(o.mrn);
    else skipped++;
  }
  matched.sort((a, b) => String(a.p.name).localeCompare(String(b.p.name)));
  return { matched, eskMissing, skipped, notElig: matched.filter(x => !benElig(x.row.soharstatus)), lines: rows.length, people: latest.size };
}
// One tblBenefits row (all text), in BEN_COLS order.
const benRowOut = (o, p, now) => [o.mrn, String(p.name ?? ''), o.pernbr, o.soharpayer, o.plan, o.network, o.coveragelevel, o.coveragestart, o.coverageend, o.copay, o.coinsurance, o.deductible, o.deductibleremaining, o.deductiblestatus, o.oopmax, o.oopremaining, o.oopstatus, o.benefitflag, o.soharstatus, o.sohardate, o.source, now].map(v => String(v ?? ''));
// Upsert by MRN (column 0): matched rows are replaced in place, new MRNs fill blank rows then go at the end, other rows are kept.
function mergeBenefits(existing, incoming){
  const out = (existing || []).map(r => r.map(v => v == null ? '' : String(v)));
  const at = new Map(); out.forEach((r, i) => { const k = benKey(r[0]); if (k && !at.has(k)) at.set(k, i); });
  const free = out.map((r, i) => r.every(v => v === '') ? i : -1).filter(i => i >= 0);
  let updated = 0, added = 0;
  for (const r of incoming){
    const k = benKey(r[0]);
    if (at.has(k)){ out[at.get(k)] = r.slice(); updated++; continue; }
    const i = free.length ? free.shift() : out.length; out[i] = r.slice(); at.set(k, i); added++;
  }
  return { values: out, updated, added };
}
// Compact summary for a patient's card: "Copay 30 · Coins 20% · Ded left 100 (Approaching) · OOP left 2500 · Sohar 10/15".
function benLine(o){
  const v = k => String(o?.[k] ?? '').trim(), st = k => /^(met|approaching)$/i.test(v(k)) ? ` (${v(k)})` : '', parts = [];
  if (v('copay')) parts.push('Copay ' + v('copay'));
  if (v('coinsurance')) parts.push('Coins ' + v('coinsurance'));
  if (v('deductibleremaining')) parts.push('Ded left ' + v('deductibleremaining') + st('deductiblestatus'));
  if (v('oopremaining')) parts.push('OOP left ' + v('oopremaining') + st('oopstatus'));

// Spravato GS1 code — same layout the Inventory formulas use:
// 01 + GTIN(14) | 21 + serial(12) | 17 + YYMMDD | 10 + lot
function parseScan(raw){
  const s = cleanScan(raw).replace(/\s+/g, '');
  if (!/^01\d{14}21/.test(s) || s.length < 44) return null;
  const mg = s.startsWith('0100350458028034') ? 84 : s.startsWith('0100350458028027') ? 56 : null;
  const serial = s.slice(18, 30);
  const exp = s.slice(30, 32) === '17' ? ymd(2000 + +s.slice(32,34), +s.slice(34,36), +s.slice(36,38)) : null;
  const lot = /\d$/.test(s) ? s.slice(40, 47) : s.slice(40, 48);
  return { s, mg, serial, exp, lot };
}

class Tbl {
  constructor(key, name, sheet, headers, values, formulas){
    this.key = key; this.name = name; this.sheet = sheet;
    this.headers = headers.map(h => String(h ?? '')); this.values = values; this.formulas = formulas;
    this.cols = {}; this.headers.forEach((h,i) => { const n = norm(h); if (n && !(n in this.cols)) this.cols[n] = i; });
    this.formulaCol = this.headers.map((_, c) => { let f = 0, n = 0; for (const r of formulas){ const x = r[c]; if (x !== '' && x != null){ n++; if (isF(x)) f++; } } return n > 0 && f / n >= 0.5; });
  }
  get(r, k){ const c = this.cols[k]; return c == null ? null : blank(this.values[r]?.[c]); }
  isFormula(r, c){ return isF(this.formulas[r]?.[c]); }
  snap(r){ return this.headers.map((_, c) => this.isFormula(r, c) ? null : this.values[r][c]); }
}

function parseBesse(values){

async function capSave(){
  const c = capOf(), cap = { chairs: 0, visitMin: 120, amMin: 240, pmMin: 240, tmpl: {} };
  document.querySelectorAll('[data-cap]').forEach(el => { const v = Number(el.value); cap[el.dataset.cap] = isNaN(v) || v < 0 ? CAP0[el.dataset.cap] : v; });
  const cred = { ...(S.provCred || {}) };
  document.querySelectorAll('tr[data-capr]').forEach(tr => { const n = tr.dataset.n, t = {}; tr.querySelectorAll('[data-tb]').forEach(el => { const v = Math.max(0, Math.round(Number(el.value) || 0)); if (v) t[el.dataset.tb] = v; }); if (Object.keys(t).length) cap.tmpl[n] = t;
    const pc = tr.querySelector('[data-pc]')?.value || ''; if (pc) cred[n.toLowerCase()] = pc; else delete cred[n.toLowerCase()]; });
  for (const [n, t] of Object.entries(c.tmpl)) if (!document.querySelector(`tr[data-capr][data-n="${CSS.escape(n)}"]`)) cap.tmpl[n] = t;   // keep templates for providers not shown
  S.cap = cap; S.provCred = cred; busy('Saving…');
  try { await S.store.setDoc('eskCapacity', cap); await S.store.setDoc('eskProvCred', cred); toast('ok', 'Templates and chairs saved.'); }
  catch (e){ toast('bad', esc(e.message || String(e))); } finally { busy(false); }
  closeModal(); render();
}

// ---------- export for the clinic template optimization tool ----------
// One workbook, tidy tables (one header row, stable column names, ISO dates) and an About sheet with the schema version,
// so the template tool can import it and the same layout works for IV ketamine (Modality column).
const ACCESS_SCHEMA = { name: 'mhs-access-model', version: 1 };
function accessBook(m, withPts){
  const iso = isoOf, F = m.F, cap = m.cap, sts = accStatuses().filter(s => F.st.has(s.k)).map(s => s.l).join(', ');
  const r1 = n => Math.round(n * 100) / 100, wd = b => DN5[+b.split('|')[0]], hp = b => b.split('|')[1];
  const S_ = {};
  S_.About = [['Field', 'Value'], ['Schema', ACCESS_SCHEMA.name], ['Schema version', ACCESS_SCHEMA.version], ['Modality', MODALITY], ['Clinic', CFG.clinic || ''], ['Generated', new Date().toISOString()], ['Source', 'ESK Tracker add-in · Access tab'],
    ['Week runs', 'Sunday to Saturday'], ['First week of forecast', iso(m.W0)], ['Forecast weeks', m.H], ['Booked window (weeks)', F.weeks], ['Statuses included', sts], ['Pharmacy filter', F.ph === 'all' ? 'All' : F.ph],
    ['Chairs', +cap.chairs || 0], ['Visit length (min)', +cap.visitMin], ['AM block (min)', +cap.amMin], ['PM block (min)', +cap.pmMin], ['Template slots per week', m.tmplWk], ['Chair capacity per week', m.chairWk],

function weeksFor(od){ const d = dowOf(od); let add = (1 - d + 7) % 7; if (add === 0) add = 7; const m = od + add; return [[m, m+4], [m+7, m+11]]; }
function besseModel(){
  const w = weeksFor(S.orderDate); const rows = { 56:{ w1:0, w2:0 }, 84:{ w1:0, w2:0 } }; const list = [], review = [];
  for (const a of S.A){
    if (!a.active || a.date < w[0][0] || a.date > w[1][1] || !pendingAppt(a)) continue;
    const wk = a.date <= w[0][1] ? 1 : a.date >= w[1][0] ? 2 : 0; if (!wk) continue;
    const inf = apptInfo(a);
    if (inf.pharm !== 'BESSE'){ if (!inf.pharm) review.push({ a, why:'Not on the patient tracker — pharmacy unknown' }); continue; }
    if (inf.mg !== 56 && inf.mg !== 84){ review.push({ a, why:`Dose ${inf.mg ?? 'unknown'}` }); continue; }
    rows[inf.mg]['w' + wk]++; list.push({ a, wk, mg: inf.mg, verify: inf.mg === 56 && !a.isStart });
  }
  const besseKits = S.K.filter(k => k.pharm === 'BESSE' && k.full);
  for (const mg of [56, 84]){
    const r = rows[mg]; r.oh = besseKits.filter(k => k.recv === mg && !k.expired).length;
    r.expiredFull = besseKits.filter(k => k.recv === mg && k.expired).length;
    r.expSoon = besseKits.filter(k => k.recv === mg && !k.expired && k.expDate != null && k.expDate <= w[1][1]).length;
    const sheetOv = S.besse?.rows?.[mg]?.ov; r.sheetOv = sheetOv; r.ov = S.ov[mg] ?? sheetOv ?? (mg === 56 ? 1 : -2);
    r.order = Math.max(0, r.w1 + r.w2 - r.oh + r.ov);
  }
  return { w, rows, list: list.sort((a, b) => a.a.date - b.a.date || (a.a.time ?? 0) - (b.a.time ?? 0)), review };
}
const PS = ph => ph === 'GENOA' || ph === 'OTHER'; // patient-specific pharmacies
// a visit that still needs meds: not before today, no kit logged as given that day, and today's only until its time has passed
function pendingAppt(a){
  const T = todaySerial(); if (a.date < T) return false;
  if (S.K.some(k => k.mrn === a.mrn && k.administered && k.adminDate === a.date)) return false;
  return a.date > T || a.time == null || a.time >= nowMin();
}
// Order Status (column J of the Master Patient Tracker) for Genoa / other-pharmacy patients: when the open order was placed and which visit it is for;
// blank once everything ordered is received. Besse patients are left alone.
function orderStatusText(mrn, fm){
  const f = fm.filter(x => x.k.mrn === mrn); if (!f.length) return '';
  const x = f[0]; return `${x.k.ordered != null ? `Ordered ${fmtD(x.k.ordered)}` : 'On order'}${x.need != null ? ` for ${fmtD(x.need)} appt` : ''}${f.length > 1 ? ` (+${f.length - 1} more on order)` : ''}`;
}
async function syncOrderStatus(){
  const t = S.tables.patients, c = t?.cols.orderstatus; if (!S.store?.live || S.store.remote || c == null) return;
  const seen = new Set(), ch = [], fm = followModel();
  for (const p of S.P){
    if (!PS(p.pharm) || seen.has(p.mrn)) continue; seen.add(p.mrn);
    if (t.isFormula(p.r, c)) continue;

    if (want !== cur) ch.push([p, want]);

  if (!ch.length) return;
  try { const done = await S.store.updateMany('patients', ch.map(([p, want]) => ({ r: p.r, snap: t.snap(p.r), changes: [[c, want]], p, want }))); done.forEach(x => { t.values[x.p.r][c] = x.want; }); }
  catch (e){ console.error(e); toast('bad', `Order Status wasn’t updated: ${esc(e.message || String(e))}`); }

}
function defaultWindow(){ const T = todaySerial(); const d = dowOf(T); let add = (1 - d + 7) % 7; if (add === 0) add = 7; return { from: T, to: T + add + 4 }; } // today → Friday of next week
function genoaModel(from, to){
  const T = todaySerial(); from = from ?? S.win.from; to = to ?? S.win.to;
  const appts = S.A.filter(a => a.active && a.date >= Math.max(from, T) && a.date <= to && PS(apptInfo(a).pharm) && pendingAppt(a)).sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));
  const onhand = new Map(), open = new Map();
  for (const k of S.K){ if (!k.mrn || k.pharm === 'BESSE') continue;
    if (k.available){ if (!onhand.has(k.mrn)) onhand.set(k.mrn, []); onhand.get(k.mrn).push(k); }
    if (k.openOrder){ if (!open.has(k.mrn)) open.set(k.mrn, []); open.get(k.mrn).push(k); } }
  for (const l of onhand.values()) l.sort(fifo); for (const l of open.values()) l.sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0) || a.r - b.r);
  const rows = appts.map(a => { const inf = apptInfo(a);
    const oh = onhand.get(a.mrn) || []; let i = oh.findIndex(k => !inf.mg || k.recv === inf.mg);
    if (i >= 0 && oh[i].expDate != null && oh[i].expDate < a.date) i = -1; // Genoa kits are good 14 days after receipt
    if (i >= 0){ const k = oh.splice(i, 1)[0]; return { a, inf, cover:'onhand', k }; }
    const op = open.get(a.mrn) || []; if (op.length){ const k = op.shift(); return { a, inf, cover:'ordered', k }; }
    return { a, inf, cover:'need' };
  });
  return { rows, from, to };
}
function followModel(){
  const T = todaySerial(); const out = [];
  const byMrn = new Map();
  for (const k of S.K) if (k.openOrder){
    if (!k.mrn){ const fus = String(k.comments ?? '').split('|').map(x => x.trim()).filter(x => /^F\/U/i.test(x)); const waited = k.ordered != null ? T - k.ordered : null; out.push({ k, next: null, need: null, waited, st: `${PH_LABEL[k.pharm] || ''} stock order`, cls: waited >= 7 ? 'warn' : 'info', fu: fus[fus.length - 1] || '', onhand: S.K.filter(x => x.pharm === k.pharm && x.available && !x.mrn).length, stale: null, stock: true }); continue; }
    if (!byMrn.has(k.mrn)) byMrn.set(k.mrn, []); byMrn.get(k.mrn).push(k); }
  for (const [mrn, orders] of byMrn){
    orders.sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0) || a.r - b.r);
    const appts = S.A.filter(a => a.mrn === mrn && a.active && pendingAppt(a)).sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));
    const onhand = S.K.filter(k => k.mrn === mrn && k.available && k.pharm !== 'BESSE').sort(fifo);
    const oh = onhand.slice(); const uncovered = [];
    for (const a of appts){ const i = oh.findIndex(k => k.expDate == null || k.expDate >= a.date); if (i >= 0) oh.splice(i, 1); else uncovered.push(a); }
    orders.forEach((k, idx) => {
      const next = uncovered[idx] || null; const need = next?.date ?? null; const waited = k.ordered != null ? T - k.ordered : null;
      const recvAfter = k.ordered != null ? S.K.filter(x => x.mrn === mrn && x.isReceived && x.received != null && x.received >= k.ordered && x.pharm !== 'BESSE') : [];
      let st, cls;
      if (need == null){ st = onhand.length ? 'Covered — kit on hand' : 'No upcoming appointment'; cls = onhand.length ? 'ok' : ''; }
      else if (need === T){ st = 'Needed today'; cls = 'bad'; }
      else if (need - T === 1){ st = 'Needed tomorrow'; cls = 'bad'; }
      else if (need - T <= 3){ st = `Needed in ${need - T} days`; cls = 'warn'; }
      else { st = `Needed ${fmtD(need, 'dow')}`; cls = 'info'; }
      const fus = String(k.comments ?? '').split('|').map(x => x.trim()).filter(x => /^F\/U/i.test(x));
      out.push({ k, next, need, waited, st, cls, fu: fus[fus.length - 1] || '', onhand: onhand.length, stale: recvAfter.length ? recvAfter[recvAfter.length - 1] : null });
    });
  }
  return out.sort((a, b) => (a.need ?? 1e9) - (b.need ?? 1e9) || (a.k.ordered ?? 0) - (b.k.ordered ?? 0));
}
function patientMeds(mrn){
  const onhand = S.K.filter(k => k.mrn === mrn && k.available && k.pharm !== 'BESSE').sort(fifo);

async function saveVisit(){

  let miss = [];
  for (let n = 0; n < 3; n++){
    S.visit = visitMerge(S.visit || {}, S._vlogBase, S.store.freshDoc ? await S.store.freshDoc('eskVisit') : null);
    const cut = todaySerial() - 45; for (const k of Object.keys(S.visit)){ const d = Number(k.split('|')[1]); if (d && d < cut) delete S.visit[k]; }
    try { await S.store.setDoc('eskVisit', S.visit); } finally { S._selfWriteAt = Date.now(); }   // the watcher ignores the change events from this write

function visitMissing(mine, base, file){

    if (J(m) === J(base[k])) continue;
    if (Object.keys(m || {}).some(x => J(m[x]) !== J(b[x]) && J(f[x]) !== J(m[x]))) out.push(k); }
  return out;
}
// Someone else may have saved visits since this pane last read them. Visits this pane changed (vs base, the last read) keep
// this pane's version of the fields it changed and take the file's for the rest (the provider's ESK Bays pane and the PCT's pane
// save the same visit); every other visit takes the file's. base follows the file too, so the visit log records only our changes.
function visitMerge(mine, base, fresh){
  if (!fresh || typeof fresh !== 'object') return mine;
  const J = x => JSON.stringify(x ?? null);
  for (const k of new Set([...Object.keys(fresh), ...Object.keys(base), ...Object.keys(mine)])){
    if (J(mine[k]) !== J(base[k])){
      const m = mine[k], b = base[k], f = fresh[k];
      if (!m || !b || !f || typeof f !== 'object' || J(f) === J(b)) continue;
      for (const x of new Set([...Object.keys(f), ...Object.keys(b), ...Object.keys(m)])){
        if (J(m[x]) !== J(b[x])) continue;
        if (f[x] === undefined){ delete m[x]; delete b[x]; } else { m[x] = JSON.parse(JSON.stringify(f[x])); b[x] = JSON.parse(JSON.stringify(f[x])); }
      }
      continue;
    }

  }

}

function rcvLogAdd(x){ (S.rcvLog = S.rcvLog || []).push({ ...x, ph: S.recvPharm }); if (S.rcvLog.length > 60) S.rcvLog.shift(); }
async function recvScan(raw){
  const scan = cleanScan(raw); const p = parseScan(scan); const T = todaySerial();
  if (!p) return setMsg('recvMsg', 'bad', 'That doesn’t read as a Spravato barcode. Scan the 2D code on the kit.');
  if (!p.mg) return setMsg('recvMsg', 'warn', `Serial ${esc(p.serial)} isn’t a known 56 mg or 84 mg Spravato product. Check the kit.`);
  const sn = normScan(p.serial);
  const dup = S.K.find(k => k.serialN === sn) || (S.rcvHold || []).find(h => normScan(h.serial) === sn);
  if (dup) return setMsg('recvMsg', 'bad', `Serial ${esc(p.serial)} was already scanned${dup.r != null ? ` (row ${dup.r + 3}${dup.mrn ? ', ' + esc(nm(dup.mrn)) : ''})` : ''}.`);
  const me = CFG.me; if (!me) { openSettings(); return setMsg('recvMsg', 'warn', 'Add your name in Settings first — it goes in Logging PCT.'); }
  if (S.recvPharm === 'Genoa'){
    const L = recvQueue();
    const fits = k => { const m = lineMg(k); return !m || m === p.mg; };
    const line = L.find(fits);
    if (!line){ (S.rcvHold = S.rcvHold || []).push({ scan, mg: p.mg, serial: p.serial }); S.recvMsg = { kind:'warn', html:`${p.mg} mg · ${esc(p.serial)} isn’t awaiting receipt — set aside below. Keep scanning.` }; render(); return; }
    const skipped = L.indexOf(line) > 0 ? L[0] : null;
    const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; if (!line.pharmRaw) obj.pharmacy = pharmText(line.mrn ? (S.byMrn.get(line.mrn)?.pharm || 'GENOA') : 'GENOA');
    const { out } = changesFor('kits', obj); const who = line.mrn ? nm(line.mrn) : 'Genoa stock';
    if (await write(null, () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out))){
      if (S.rcvFirst === line.id) S.rcvFirst = null;
      const warn = skipped ? `${p.mg} mg — skipped ${skipped.mrn ? nm(skipped.mrn) : 'stock'} (${lineMg(skipped)} mg)` : '';
      rcvLogAdd({ id: 'S:' + sn, who, mg: p.mg, serial: p.serial, warn });
      S.recvMsg = { kind: skipped ? 'warn' : 'ok', html: `Received ${p.mg} mg for <b>${esc(who)}</b>.${skipped ? ` The next line (${esc(skipped.mrn ? nm(skipped.mrn) : 'stock')}) expects ${lineMg(skipped)} mg, so this went to the next ${p.mg} mg line — check the bag.` : ''}` };
      render();
    }
    return;
  }
  const opens = S.K.filter(k => k.openOrder && k.pharm === 'BESSE' && !k.mrn).sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0));
  const line = opens.find(k => num(String(k.comments ?? '').match(/(\d+)\s*mg/i)?.[1]) === p.mg) || opens.find(k => !/\d+\s*mg/i.test(String(k.comments ?? ''))) || null;
  let ok;
  if (line){ const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; const { out } = changesFor('kits', obj); ok = await write(null, () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out)); }
  else { const { out } = changesFor('kits', { loggingpct: me, scanhere: scan, pharmacy: pharmText('BESSE'), datereceived: { date: T } }); ok = await write(null, () => S.store.add('kits', out)); }
  if (ok){ rcvLogAdd({ id: 'S:' + sn, who: 'Besse stock', mg: p.mg, serial: p.serial, warn: line ? '' : 'no open order line' }); S.recvMsg = { kind:'ok', html:`Received Besse ${p.mg} mg · ${esc(p.serial)}${line ? ' (order line filled)' : ' (no open order line — added as new stock)'}.` }; render(); }
}
async function rcvAdd(i){
  const h = (S.rcvHold || [])[i]; if (!h) return; const T = todaySerial();
  const mrn = mrnFromInput($('#hold' + i)?.value); if (!mrn || !S.byMrn.has(mrn)) return setMsg('recvMsg', 'bad', 'Choose the patient from the list first.');
  if (!CFG.me){ openSettings(); return; }
  const { out } = changesFor('kits', { loggingpct: CFG.me, scanhere: h.scan, mrn: mrnVal(mrn), pharmacy: pharmText(S.byMrn.get(mrn)?.pharm || 'GENOA'), datereceived: { date: T }, comments: `${nm(mrn)} | Received without an open order ${fmtD(T)}` });
  if (await write('Adding to inventory…', () => S.store.add('kits', out), `Added for ${nm(mrn)}.`)){ S.rcvHold.splice(i, 1); rcvLogAdd({ id: 'S:' + normScan(h.serial), who: nm(mrn), mg: h.mg, serial: h.serial, warn: 'received without an open order' }); render(); }
}
function mrnFromInput(v){ const m = String(v || '').match(/(\d{3,})\s*$/); if (m) return m[1]; const p = S.P.find(p => p.name.toUpperCase() === String(v || '').trim().toUpperCase()); return p?.mrn || null; }

function needHTML(g){
  const T = todaySerial(); const need = g.rows.filter(r => r.cover === 'need'); const covered = g.rows.filter(r => r.cover !== 'need');
  const sel = need.filter(r => S.genoaSel.has(r.a.key)).length;

function findHistRow(){ // the history's DATE column holds one row per order week: use this date, or the next one within 6 days
  const b = S.besse; if (!b?.hist) return null; const vals = b.vals || []; let best = null;
  for (let r = b.hist.hdr + 1; r < vals.length; r++){ const d = toSerial(vals[r][b.hist.c]); if (d == null) continue; const diff = d - S.orderDate; if (diff >= 0 && diff <= 6 && (best == null || diff < best.diff)) best = { r, d, diff }; }
  return best;
}

function mergeAud(mine, saved){
  if (!saved) return mine; if (!mine || mine.date !== saved.date) return (!mine || saved.date > mine.date) ? JSON.parse(JSON.stringify(saved)) : mine;
  const key = x => `${x.at}|${x.raw}`; const have = new Map(mine.scans.map(x => [key(x), x]));
  for (const x of saved.scans || []){ const m = have.get(key(x)); if (m){ if (x.sheet) m.sheet = true; } else if (!(mine.removed || []).includes(key(x))) mine.scans.push({ ...x }); }
  mine.scans.sort((p, q) => p.at - q.at); mine.a1 = mine.a1 || saved.a1; mine.a2 = mine.a2 || saved.a2; mine.filled = mine.filled || saved.filled; return mine;
}

async function runScanQ(){
  if (S.scanBusy) return;
  while (S.scanQ.length){ const x = S.scanQ.shift(); S.scanBusy = x.k; try { if (x.k === 'recv') await recvScan(x.v); else if (x.k === 'aud') await writeAuditScan(x.sc); } catch (e){ console.error(e); toast('bad', esc(e.message || String(e))); } }
  S.scanBusy = null; if (S._dailyDirty){ S._dailyDirty = false; await reload(true); } render();
}
function auditModel(){
  const A = auditState(); const seen = new Set();
  const rows = A.scans.map((sc, i) => {
    const { p, list } = findByScan(sc.raw); const k = list.find(x => !x.disposed) || list[0] || null; const key = p?.serial || normScan(sc.raw);
    const dup = seen.has(key); seen.add(key); let st, cls;
    if (dup){ st = 'Duplicate scan'; cls = 'warn'; }
    else if (!k){ st = p ? 'Not in inventory' : 'Not a Spravato code'; cls = 'bad'; }
    else if (k.disposed){ st = 'Marked disposed'; cls = 'bad'; }
    else if (k.administered && !k.partialOpen){ st = 'Already administered'; cls = 'bad'; }
    else if (k.expired){ st = 'Expired — dispose'; cls = 'warn'; }
    else if (k.partialOpen){ st = `Partial · ${k.remaining} mg left`; cls = 'warn'; }
    else { st = 'OK'; cls = 'ok'; }
    return { i, sc, p, k, st, cls, dup };
  });
  const scanned = new Set(rows.filter(r => r.k && !r.dup).map(r => r.k.id));
  const expected = S.K.filter(k => k.isReceived && !k.disposed && (!k.administered || k.partialOpen));
  const missing = expected.filter(k => !scanned.has(k.id)).sort((a, b) => (a.pharm || '').localeCompare(b.pharm || '') || fifo(a, b));
  const gk = k => `${PH_LABEL[k.pharm]} ${k.recv ?? '?'} mg`; const groups = {};
  for (const k of expected){ const g = groups[gk(k)] || (groups[gk(k)] = { exp: 0, ok: 0 }); g.exp++; if (scanned.has(k.id)) g.ok++; }
  const flags = rows.filter(r => r.cls !== 'ok').length + missing.length;
  return { A, rows, missing, expected, groups, flags };
}

// Daily audit printout — same layout as the workbook's Daily Count sheet (landscape, one page), detail on page 2.
function auditDoc(){
  const m = auditModel(); const A = m.A; const T = fromIso(A.date) ?? todaySerial();
  const PH = [['BESSE', 'Besse'], ['GENOA', 'Genoa'], ['OTHER', 'Other Specialty']]; const DOSES = [56, 84];
  const valid = m.rows.filter(r => r.k && !r.dup && !r.k.disposed && (!r.k.administered || r.k.partialOpen));
  const onHand = (mg, ph) => valid.filter(r => r.k.recv === mg && (!ph || r.k.pharm === ph)).length;
  const usedK = S.K.filter(k => k.administered && k.adminDate === T);
  const used = (mg, ph) => usedK.filter(k => k.recv === mg && (!ph || k.pharm === ph)).length;
  const dup = mg => m.rows.some(r => r.dup && (r.k?.recv ?? r.p?.mg) === mg) ? 'Yes' : 'No';
  const dispK = S.K.filter(k => k.dispDate === T);
  const appl = k => Math.round((k.mgDisp > 0 ? k.mgDisp : (k.remaining ?? k.recv ?? 0)) / 28); // one nasal device = 28 mg
  const disp = ph => dispK.filter(k => k.pharm === ph).reduce((n, k) => n + appl(k), 0);
  const sum = (f, ph) => DOSES.reduce((n, d) => n + f(d, ph), 0);
  const block = (h2, h3, h4, c2, c3, c4, extra) => `<table class="b"><colgroup><col style="width:18%"><col style="width:25%"><col style="width:33%"><col style="width:24%"></colgroup><tr class="h"><th>Dose</th><th>${h2}</th><th>${h3}</th><th>${h4}</th></tr>
    ${DOSES.map((d, i) => `<tr class="${i % 2 ? 'odd' : 'ev'}"><td>${d}</td><td>${c2(d)}</td><td>${c3(d)}</td><td class="${extra ? 'l' : 'r'}">${c4(d)}</td></tr>`).join('')}
    <tr class="t"><td>Total</td><td>${c2()}</td><td>${c3()}</td><td class="${extra ? 'l' : 'r'}">${extra ? '' : c4()}</td></tr></table>`;
  const tot = f => d => d == null ? sum(f) : f(d);
  const totP = (f, ph) => d => d == null ? sum(f, ph) : f(d, ph);
  const pt = k => k?.mrn ? esc(nm(k.mrn)) + ' · ' + esc(k.mrn) : k ? 'Stock' : '—';
  const dt = (head, rows) => `<table class="d"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Daily Audit ${fmtD(T, 'full')}</title><style>
    @page{size:letter landscape;margin:0.35in 0.3in}
    *{box-sizing:border-box} body{margin:0;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:10pt;color:#000}
    .logo{height:86px;margin:6px 0 18px 46px}
    .frame{border:2px solid #000;padding:0 0 4px}
    .hdr{display:grid;grid-template-columns:205px 1fr 150px 230px;row-gap:1px;padding:6px 8px 14px;font-size:10pt}
    .hdr b{text-align:right;padding-right:10px;white-space:nowrap} .hdr .sg{text-align:right}
    table.b{width:100%;border-collapse:collapse;margin-bottom:14px} table.b th{background:#4472c4;color:#fff;font-weight:700;padding:2px 6px;text-align:center}
    table.b td{text-align:center;padding:1px 6px} table.b tr.ev td{background:#d9e1f2} table.b tr.odd td{background:#fff}
    table.b td.r{text-align:right} table.b td.l{text-align:left} table.b tr.t td{font-weight:700;border-top:1px solid #4472c4;border-bottom:2px solid #4472c4}
    .foot{display:grid;grid-template-columns:43% 1fr;gap:6px;align-items:start}
    .foot table.b{margin:0} .att{font-weight:700;font-size:10pt;line-height:1.45;padding-top:8px}
    .p2{page-break-before:always;break-before:page} .p2 h2{font-size:13pt;margin:0 0 6px} .p2 h3{font-size:11pt;margin:12px 0 4px}
    table.d{width:100%;border-collapse:collapse;font-size:9pt} table.d th,table.d td{border:1px solid #999;padding:2px 5px;text-align:left} table.d th{background:#d9e1f2}
  </style></head><body>
    <img class="logo" src="${LOGO_URI}" alt="Mindful Health Solutions">
    <div class="frame">
      <div class="hdr"><b>Auditor 1 Name (First and Last)</b><span>${esc(A.a1 || '')}</span><b class="sg">Auditor 1 Signature</b><span></span>
        <b>Auditor 2 Name (First and Last)</b><span>${esc(A.a2 || '')}</span><b class="sg">Auditor 2 Signature</b><span></span>
        <b>Date</b><span>${fmtD(T, 'full')}</span><span></span><span></span>
        <b>Location</b><span>${esc(locName())}</span><span></span><span></span></div>
      ${block('Total Medications Used', 'Total Medications on hand', 'Duplicate Scans?', tot(d => used(d)), tot(d => onHand(d)), d => d == null ? '' : dup(d), true)}
      ${block('Besse used', 'Genoa used', 'Other Specialty used', totP(used, 'BESSE'), totP(used, 'GENOA'), totP(used, 'OTHER'))}
      ${block('Besse on hand', 'Genoa on hand', 'Other Specialty on hand', totP(onHand, 'BESSE'), totP(onHand, 'GENOA'), totP(onHand, 'OTHER'))}
      <div class="foot"><table class="b"><tr class="h"><th>Pharmacy/Drug Source</th><th>Applicators Disposed/Returned</th></tr>

// The consent form floats over the page, never in a new window: from the task pane an in-page Office dialog;
// from the full-screen view or demo (one Office dialog at a time) a blurred overlay with the form in a frame.
function openConsentWindow(data){
  const url = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '') + 'consent.html';
  let sent = false; const payload = () => { const s = JSON.stringify({ ev: 'consentData', data }); sent = true; data = null; return s; };
  const viaFrame = () => {
    const ov = document.createElement('div'); ov.id = 'cfloat'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Consent form');
    ov.innerHTML = `<iframe title="Consent form" src="${url}"></iframe>`; document.body.appendChild(ov);
    const fr = ov.querySelector('iframe');
    const done = () => { window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); data = null; };
    const onKey = e => { if (e.key === 'Escape') done(); }; document.addEventListener('keydown', onKey);
    const onMsg = e => { if (e.source !== fr.contentWindow || e.origin !== location.origin) return;
      if (e.data?.ev === 'consentReady' && !sent) fr.contentWindow.postMessage(JSON.parse(payload()), location.origin);
      if (e.data?.ev === 'consentClose') done(); };
    window.addEventListener('message', onMsg);
    ov.addEventListener('click', e => { if (e.target === ov) done(); });
  };
  if (S.mode !== 'pane' || !window.Office?.context?.ui?.displayDialogAsync) return viaFrame();
  Office.context.ui.displayDialogAsync(url, { height: 90, width: 60, displayInIframe: true }, res => {
    if (res.status !== Office.AsyncResultStatus.Succeeded) return viaFrame();   // e.g. the full-screen view is already open
    const dlg = res.value;
    dlg.addEventHandler(Office.EventType.DialogMessageReceived, a => { let m; try { m = JSON.parse(a.message); } catch { return; }
      if (m.ev === 'consentReady' && !sent) dlg.messageChild(payload());
      if (m.ev === 'consentClose') { try { dlg.close(); } catch {} } });
    dlg.addEventHandler(Office.EventType.DialogEventReceived, () => { data = null; });
  });
}
