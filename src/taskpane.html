<body>
<div id="app"></div>
<div id="modal" hidden role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="busy" hidden><div class="spin"></div><span id="busyText">Working…</span></div>
<script>
'use strict';
/* =====================================================================
   ESK Tracker — Excel add-in task pane
   Reads and writes the Esketamine Master Tracker workbook in place.
   - Finds tables by their headers (not by name or position).
   - Never writes into a formula cell.
   - Re-checks a row before writing; if someone changed it, it stops.
   ===================================================================== */

// ---------- small utils ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const isF = x => typeof x === 'string' && x.startsWith('=');
const blank = v => (v === '' || v === undefined) ? null : v;
const MS = 864e5;
const ymd = (y,m,d) => Math.round(Date.UTC(y, m-1, d) / MS) + 25569;
const todaySerial = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); };
const sDate = s => new Date((s - 25569) * MS);
const dowOf = s => sDate(s).getUTCDay();
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtD(s, mode){ if (s == null) return '—'; const d = sDate(s); const t = `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  return mode === 'dow' ? `${DOW[d.getUTCDay()]} ${t}` : mode === 'full' ? `${t}/${d.getUTCFullYear()}` : t; }
const isoOf = s => s == null ? '' : sDate(s).toISOString().slice(0,10);
function fromIso(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? ymd(+m[1], +m[2], +m[3]) : null; }
function fmtT(m){ if (m == null) return ''; let h = Math.floor(m/60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(mi).padStart(2,'0')} ${ap}`; }
function toSerial(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return (v > 1000 && v < 100000) ? Math.floor(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m){ let y = +m[3]; if (y < 100) y += 2000; return ymd(y, +m[1], +m[2]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return ymd(+m[1], +m[2], +m[3]);
  return null;
}
function toMinutes(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Math.round((v % 1) * 1440) % 1440;
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})\s*([AP]M)?/i); if (!m) return null;
  let h = +m[1]; if (m[3]){ if (/pm/i.test(m[3]) && h < 12) h += 12; if (/am/i.test(m[3]) && h === 12) h = 0; }
  return h*60 + +m[2];
}
const mrnKey = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return String(Math.round(v)); return String(v).trim().replace(/\.0+$/, ''); };
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const yes = v => /^(y|yes|true|x)$/i.test(String(v ?? '').trim());
const cleanScan = s => String(s ?? '').replace(/[\x00-\x1f\x7f]/g, '').trim();
const normScan = s => cleanScan(s).replace(/\s+/g, '').toUpperCase();
function pharmOf(v){ const s = String(v ?? '').toUpperCase(); if (s.includes('BESSE')) return 'BESSE'; if (s.includes('GENOA')) return 'GENOA'; return s.trim() ? 'OTHER' : ''; }
const PH_LABEL = { BESSE:'Besse', GENOA:'Genoa', OTHER:'Other', '':'—' };

// Spravato GS1 code — same layout the Inventory formulas use:
// 01 + GTIN(14) | 21 + serial(12) | 17 + YYMMDD | 10 + lot
function parseScan(raw){
  const s = cleanScan(raw).replace(/\s+/g, '');
  if (!/^01\d{14}21/.test(s) || s.length < 44) return null;
  const mg = s.startsWith('0100350458028034') ? 84 : s.startsWith('0100350458028027') ? 56 : null;
  const serial = s.slice(18, 30);
  const exp = s.slice(30, 32) === '17' ? ymd(2000 + +s.slice(32,34), +s.slice(34,36), +s.slice(36,38)) : null;
  const lot = /\d$/.test(s) ? s.slice(40, 47) : s.slice(40, 48);
  return { s, mg, serial, exp, lot };
}

// ---------- settings (this device only; no patient data) ----------
const DEF = { me:'', sup:'', pm:'', clinic:'SRL', email:'eskorders@mymhs.com', schedDays:30, genoaDays:14, theme:'', autoFull:false, genoaEmail:'' };
let CFG = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('eskCfg') || '{}')); } catch { return { ...DEF }; } })();
function saveCfg(){ try { localStorage.setItem('eskCfg', JSON.stringify(CFG)); } catch {} applyTheme(); }
function applyTheme(){ if (CFG.theme) document.documentElement.dataset.theme = CFG.theme; else delete document.documentElement.dataset.theme; }
applyTheme();

// ---------- table model ----------
class Tbl {
  constructor(key, name, sheet, headers, values, formulas){
    this.key = key; this.name = name; this.sheet = sheet;
    this.headers = headers.map(h => String(h ?? '')); this.values = values; this.formulas = formulas;
    this.cols = {}; this.headers.forEach((h,i) => { const n = norm(h); if (n && !(n in this.cols)) this.cols[n] = i; });
    this.formulaCol = this.headers.map((_, c) => { let f = 0, n = 0; for (const r of formulas){ const x = r[c]; if (x !== '' && x != null){ n++; if (isF(x)) f++; } } return n > 0 && f / n >= 0.5; });
  }
  get(r, k){ const c = this.cols[k]; return c == null ? null : blank(this.values[r]?.[c]); }
  isFormula(r, c){ return isF(this.formulas[r]?.[c]); }
  snap(r){ return this.headers.map((_, c) => this.isFormula(r, c) ? null : this.values[r][c]); }
}
const SIG = {
  patients: ['mrn','patientname','status','txfrequency','pharmacy'],
  kits:     ['scanhere','mrn','receivedmg','mgremaining','administeredmg'],
  appts:    ['mrn','patient','date','time','event','status'],
  audit:    ['scanhere','auditor2','date'],
};
const same = (a, b) => String(a ?? '').trim() === String(b ?? '').trim();
const snapMatch = (vals, snap) => snap.every((s, c) => s === null || same(vals[c], s));

function parseRef(values){
  const out = {}; let hr = values.findIndex(r => r.some(v => norm(v) === 'pharmacy') && r.some(v => norm(v) === 'dose'));
  if (hr < 0) return out;
  values[hr].forEach((h, c) => { const k = norm(h); if (!k) return; const list = []; for (let r = hr+1; r < values.length; r++){ const v = values[r][c]; if (v === '' || v == null) continue; list.push(v); } out[k] = list; });
  return out;
}
// Besse Order tab: the summary table (Clinic/Date/Dose/…/To Be Ordered) and the weekly history (DATE | 56 | 84)
function parseBesse(values, formulas){
  const out = { rows:{}, hist:null, vals:values };
  for (let r = 0; r < values.length; r++){
    const row = values[r].map(norm);
    const cOv = row.indexOf('approvedoverage');
    if (cOv >= 0 && out.hdr == null){
      out.hdr = r; const col = k => row.indexOf(k);
      out.c = { clinic:col('clinic'), date:col('date'), dose:col('dose'), oh:col('besseoh'), w1:col('apptsnextweek'), w2:col('appts2weekout'), ov:cOv, order:col('tobeordered') };
      for (let k = r+1; k < Math.min(values.length, r+6); k++){ const d = num(values[k][out.c.dose]); if (d === 56 || d === 84) out.rows[d] = { r:k, ov:num(values[k][cOv]), oh:num(values[k][out.c.oh]) }; }
    }
    for (let c = 0; c < row.length - 2; c++){
      if (row[c] === 'date' && num(values[r][c+1]) === 56 && num(values[r][c+2]) === 84 && !out.hist){ out.hist = { hdr:r, c }; }
    }
  }
  return out;
}
const colLetter = n => { let s = ''; n++; while (n){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; };

// ---------- store: live workbook (Office.js) ----------
function OfficeStore(){
  const names = {}; let besseSheet = null, besseUsedAddr = null;
  async function tableBody(ctx, k){ const t = ctx.workbook.tables.getItem(names[k]); const b = t.getDataBodyRange(); b.load('values,formulas,rowCount'); await ctx.sync(); return { t, b }; }
  async function writeCells(ctx, b, row, changes){
    const cells = [];
    for (const [c, v] of changes){ if (isF(b.formulas[row][c])) throw new Error('Stopped: that column holds a formula in the workbook.'); const cell = b.getCell(row, c); cell.load('numberFormat'); cells.push([cell, v]); }
    await ctx.sync();
    for (const [cell, v] of cells){
      if (v && typeof v === 'object' && 'date' in v){ cell.values = [[v.date]]; if (/general/i.test(String(cell.numberFormat[0][0]))) cell.numberFormat = [['m/d/yyyy']]; }
      else cell.values = [[v]];
    }
    await ctx.sync();
  }
  return {
    live: true,
    async load(){
      return Excel.run(async ctx => {
        const ts = ctx.workbook.tables; ts.load('items/name'); await ctx.sync();
        const hs = ts.items.map(t => { const h = t.getHeaderRowRange(); h.load('values'); const ws = t.worksheet; ws.load('name'); return { t, h, ws }; });
        await ctx.sync();
        const found = {};
        for (const x of hs){ const set = new Set(x.h.values[0].map(norm)); for (const [k, req] of Object.entries(SIG)) if (!found[k] && req.every(q => set.has(q))) found[k] = x; }
        const bodies = {};
        for (const [k, x] of Object.entries(found)){ names[k] = x.t.name; const b = x.t.getDataBodyRange(); b.load('values,formulas'); bodies[k] = { b, x }; }
        const wss = ctx.workbook.worksheets; wss.load('items/name'); await ctx.sync();
        const tables = {};
        for (const [k, { b, x }] of Object.entries(bodies)) tables[k] = new Tbl(k, x.t.name, x.ws.name, x.h.values[0], b.values, b.formulas);
        const refWs = wss.items.find(w => w.name.trim().toUpperCase() === 'REF');
        const bo = wss.items.find(w => /besse/i.test(w.name) && /order/i.test(w.name));
        let rr = null, br = null;
        if (refWs){ rr = refWs.getUsedRange(true); rr.load('values'); }
        if (bo){ br = bo.getRange('A1:Z200'); br.load('values,formulas'); besseSheet = bo.name; }
        await ctx.sync();
        return { tables, ref: rr ? parseRef(rr.values) : {}, besse: br ? parseBesse(br.values, br.formulas) : null, besseSheet };
      });
    },
    async update(k, r, snap, changes){
      return Excel.run(async ctx => {
        const { b } = await tableBody(ctx, k);
        let row = r;
        if (!(row < b.values.length && snapMatch(b.values[row], snap))){
          row = b.values.findIndex(v => snapMatch(v, snap));
          if (row < 0) throw new Error('That row was changed in the workbook by someone else. The panel has refreshed — check it and try again.');
        }
        await writeCells(ctx, b, row, changes);
      });
    },
    async add(k, changes){
      return Excel.run(async ctx => {
        let { t, b } = await tableBody(ctx, k);
        let last = -1;
        b.values.forEach((v, i) => { if (v.some((x, c) => !isF(b.formulas[i][c]) && x !== '' && x != null)) last = i; });
        let row = last + 1;
        if (row >= b.values.length){
          t.rows.add(null); await ctx.sync();
          b = t.getDataBodyRange(); b.load('values,formulas,rowCount'); await ctx.sync();
          row = b.rowCount - 1;
          const prev = b.getRow(row - 1); prev.load('formulasR1C1'); const cur = b.getRow(row); cur.load('formulasR1C1'); await ctx.sync();
          prev.formulasR1C1[0].forEach((f, c) => { const cf = cur.formulasR1C1[0][c]; if ((cf === '' || cf == null) && isF(f)) b.getCell(row, c).formulasR1C1 = [[f]]; });
          await ctx.sync(); b.load('values,formulas'); await ctx.sync();
        }
        await writeCells(ctx, b, row, changes);
      });
    },
    async setCells(sheet, cells){ // cells: [[a1, value, expectFormula=false]]
      return Excel.run(async ctx => {
        const ws = ctx.workbook.worksheets.getItem(sheet);
        const rs = cells.map(([a]) => { const r = ws.getRange(a); r.load('formulas,numberFormat'); return r; });
        await ctx.sync();
        rs.forEach((r, i) => { if (isF(r.formulas[0][0])) throw new Error(`Stopped: ${cells[i][0]} on "${sheet}" holds a formula.`); });
        rs.forEach((r, i) => { const v = cells[i][1]; if (v && typeof v === 'object' && 'date' in v){ r.values = [[v.date]]; if (/general/i.test(String(r.numberFormat[0][0]))) r.numberFormat = [['m/d/yyyy']]; } else r.values = [[v]]; });
        await ctx.sync();
      });
    },
    getDoc(key){ try { return Office.context.document.settings.get(key); } catch { return null; } },
    setDoc(key, val){ return new Promise(res => { try { Office.context.document.settings.set(key, val); Office.context.document.settings.saveAsync(() => res()); } catch { res(); } }); },
    watch(cb){
      Excel.run(async ctx => { for (const k in names){ ctx.workbook.tables.getItem(names[k]).onChanged.add(() => { cb(); return Promise.resolve(); }); } await ctx.sync(); }).catch(() => {});
    },
  };
}

function weeksFor(od){ const d = dowOf(od); let add = (1 - d + 7) % 7; if (add === 0) add = 7; const m = od + add; return [[m, m+4], [m+7, m+11]]; }
function besseModel(){
  const w = weeksFor(S.orderDate); const rows = { 56:{ w1:0, w2:0 }, 84:{ w1:0, w2:0 } }; const list = [], review = [];
  for (const a of S.A){
    if (!a.active || a.date < w[0][0] || a.date > w[1][1]) continue;
    const wk = a.date <= w[0][1] ? 1 : a.date >= w[1][0] ? 2 : 0; if (!wk) continue;
    const inf = apptInfo(a);
    if (inf.pharm !== 'BESSE'){ if (!inf.pharm) review.push({ a, why:'Not on the patient tracker — pharmacy unknown' }); continue; }
    if (inf.mg !== 56 && inf.mg !== 84){ review.push({ a, why:`Dose ${inf.mg ?? 'unknown'}` }); continue; }

const PS = ph => ph === 'GENOA' || ph === 'OTHER'; // patient-specific pharmacies

function genoaModel(from, to){
  const T = todaySerial(); from = from ?? S.win.from; to = to ?? S.win.to;
  const appts = S.A.filter(a => a.active && a.date >= Math.max(from, T) && a.date <= to && PS(apptInfo(a).pharm)).sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));

}
function followModel(){
  const T = todaySerial(); const out = [];
  const byMrn = new Map();
  for (const k of S.K) if (k.openOrder){
    if (!k.mrn){ const fus = String(k.comments ?? '').split('|').map(x => x.trim()).filter(x => /^F\/U/i.test(x)); const waited = k.ordered != null ? T - k.ordered : null; out.push({ k, next: null, need: null, waited, st: `${PH_LABEL[k.pharm] || ''} stock order`, cls: waited >= 7 ? 'warn' : 'info', fu: fus[fus.length - 1] || '', onhand: S.K.filter(x => x.pharm === k.pharm && x.available && !x.mrn).length, stale: null, stock: true }); continue; }
    if (!byMrn.has(k.mrn)) byMrn.set(k.mrn, []); byMrn.get(k.mrn).push(k); }
  for (const [mrn, orders] of byMrn){
    orders.sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0) || a.r - b.r);
    const appts = S.A.filter(a => a.mrn === mrn && a.active && a.date >= T).sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));

      else if (need - T === 1){ st = 'Needed tomorrow'; cls = 'bad'; }

async function rcvLink(){

async function recvScan(raw){
  const scan = cleanScan(raw); const p = parseScan(scan); const T = todaySerial();
  if (!p) return setMsg('recvMsg', 'bad', S.recvPharm === 'Genoa' && rxBase(scan) ? 'That looks like a patient label — scan it in step 1.' : 'That doesn’t read as a Spravato barcode. Scan the 2D code on the kit.');
  if (!p.mg) return setMsg('recvMsg', 'warn', 'Scanned code isn’t a known 56 mg or 84 mg Spravato product. Check the kit.');
  const dup = S.K.find(k => k.serialN === normScan(p.serial));
  if (dup) return setMsg('recvMsg', 'bad', `Serial ${esc(p.serial)} is already in the log (row ${dup.r + 3}${dup.mrn ? ', ' + esc(nm(dup.mrn)) : ''}).`);
  const me = CFG.me; if (!me) { openSettings(); return setMsg('recvMsg', 'warn', 'Add your name in Settings first — it goes in Logging PCT.'); }
  if (S.recvPharm === 'Genoa'){
    const mrn = S.rcv?.mrn; if (!mrn) return setMsg('recvMsg', 'warn', 'Scan the patient’s Genoa label first.');
    const line = S.K.filter(k => k.openOrder && k.mrn === mrn).sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0))[0];
    if (!line){ S.rcv.confirm = { scan, mg: p.mg, serial: p.serial }; S.recvMsg = null; render(); return; }
    const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; if (!line.pharmRaw) obj.pharmacy = pharmText(S.byMrn.get(mrn)?.pharm || 'GENOA');
    const { out } = changesFor('kits', obj);
    if (await write('Receiving…', () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out), `Received for ${nm(mrn)}.`)){ S.lastRecv = 'S:' + normScan(p.serial); S.recvMsg = { kind:'ok', html:`Received ${p.mg} mg for <b>${esc(nm(mrn))}</b> into row ${line.r + 3}. Scan the next patient label.` }; S.rcv = {}; render(); setTimeout(() => $('#scanRx')?.focus(), 30); }
    return;
  }
  const opens = S.K.filter(k => k.openOrder && k.pharm === 'BESSE' && !k.mrn).sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0));
  const line = opens.find(k => num(String(k.comments ?? '').match(/(\d+)\s*mg/i)?.[1]) === p.mg) || opens.find(k => !/\d+\s*mg/i.test(String(k.comments ?? ''))) || null;
  let ok;
  if (line){ const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; const { out } = changesFor('kits', obj); ok = await write('Receiving…', () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out)); }
  else { const { out } = changesFor('kits', { loggingpct: me, scanhere: scan, pharmacy: pharmText('BESSE'), datereceived: { date: T } }); ok = await write('Receiving…', () => S.store.add('kits', out)); }
  if (ok){ S.lastRecv = 'S:' + normScan(p.serial); const L = S.K.find(k => k.id === S.lastRecv); S.recvMsg = { kind:'ok', html:`Received Besse ${p.mg} mg · serial ${esc(p.serial)}${L ? ' into row ' + (L.r + 3) : ''}${line ? ' (order line filled)' : ' (no open order line — added as new stock)'}. Scan the next kit.` }; render(); }
}

function findHistRow(){ // the history's DATE column holds one row per order week: use this date, or the next one within 6 days
  const b = S.besse; if (!b?.hist) return null; const vals = b.vals || []; let best = null;
  for (let r = b.hist.hdr + 1; r < vals.length; r++){ const d = toSerial(vals[r][b.hist.c]); if (d == null) continue; const diff = d - S.orderDate; if (diff >= 0 && diff <= 6 && (best == null || diff < best.diff)) best = { r, d, diff }; }
  return best;
}

function auditState(){ const d = isoOf(todaySerial()); if (!S.aud || S.aud.date !== d) S.aud = { date: d, a1: CFG.me || '', a2: '', scans: [], filled: false }; return S.aud; }
async function saveAudit(){ await S.store.setDoc('eskAudit', S.aud); }
function auditModel(){
  const A = auditState(); const seen = new Set();
  const rows = A.scans.map((sc, i) => {
    const { p, list } = findByScan(sc.raw); const k = list.find(x => !x.disposed) || list[0] || null; const key = p?.serial || normScan(sc.raw);
    const dup = seen.has(key); seen.add(key); let st, cls;
    if (dup){ st = 'Duplicate scan'; cls = 'warn'; }
    else if (!k){ st = p ? 'Not in inventory' : 'Not a Spravato code'; cls = 'bad'; }
    else if (k.disposed){ st = 'Marked disposed'; cls = 'bad'; }
    else if (k.administered && !k.partialOpen){ st = 'Already administered'; cls = 'bad'; }
    else if (k.expired){ st = 'Expired — dispose'; cls = 'warn'; }
    else if (k.partialOpen){ st = `Partial · ${k.remaining} mg left`; cls = 'warn'; }
    else { st = 'OK'; cls = 'ok'; }
    return { i, sc, p, k, st, cls, dup };
  });
  const scanned = new Set(rows.filter(r => r.k && !r.dup).map(r => r.k.id));
  const expected = S.K.filter(k => k.isReceived && !k.disposed && (!k.administered || k.partialOpen));
  const missing = expected.filter(k => !scanned.has(k.id)).sort((a, b) => (a.pharm || '').localeCompare(b.pharm || '') || fifo(a, b));
  const gk = k => `${PH_LABEL[k.pharm]} ${k.recv ?? '?'} mg`; const groups = {};
  for (const k of expected){ const g = groups[gk(k)] || (groups[gk(k)] = { exp: 0, ok: 0 }); g.exp++; if (scanned.has(k.id)) g.ok++; }
  const flags = rows.filter(r => r.cls !== 'ok').length + missing.length;
  return { A, rows, missing, expected, groups, flags };
}

const REFMAP = { pharmacy:'pharmacy', receivedmg:'dose', administeredmg:'dose', protocolmg:'dose', disposalmethod:'disposalmethod', markedfordisposal:'yesno', status:'status', txfrequency:'treatmentfrequency', coverageoptions:'coverageoptions' };
function distinct(tkey, key, max = 40){ const t = S.tables[tkey]; if (!t || t.cols[key] == null) return []; const s = new Map(); for (let r = t.values.length - 1; r >= 0 && s.size < max; r--){ const v = t.values[r][t.cols[key]]; if (v !== '' && v != null && !s.has(String(v))) s.set(String(v), v); } return [...s.values()]; }
const datalist = (id, vals) => `<datalist id="${id}">${[...new Set(vals.map(String))].map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
const isDateHeader = h => /date|expiration|use by|auth exp|auth start|thru|last treatment|next treatment/i.test(h);
function editorHTML(tkey, r){
  const t = S.tables[tkey]; let dl = '';
  const fields = t.headers.map((h, c) => {
    if (!h.trim()) return '';
    const v = t.values[r][c]; const f = t.formulaCol[c] || t.isFormula(r, c); const n = norm(h);
    const shown = typeof v === 'number' && isDateHeader(h) ? fmtD(toSerial(v), 'full') : (v ?? '');
    if (f) return `<div><label class="lbl">${esc(h.trim())}<span class="fx">auto</span></label><input class="fld ro" value="${esc(shown)}" readonly tabindex="-1"></div>`;
    if (isDateHeader(h) && (v === '' || v == null || typeof v === 'number')) return `<div><label class="lbl" for="e${c}">${esc(h.trim())}</label><input id="e${c}" class="fld" type="date" data-ec="${c}" data-kind="date" value="${isoOf(toSerial(v))}"></div>`;
    const opts = [...(S.ref[REFMAP[n]] || []), ...distinct(tkey, n, 25)]; const lid = `dl_${tkey}_${c}`; if (opts.length) dl += datalist(lid, opts);
    const kind = typeof v === 'number' || n === 'mrn' ? 'num' : 'text';
    return `<div><label class="lbl" for="e${c}">${esc(h.trim())}</label><input id="e${c}" class="fld" data-ec="${c}" data-kind="${kind}" ${opts.length ? `list="${lid}"` : ''} value="${esc(v ?? '')}"></div>`;
  }).join('');
  return `<div class="small muted">Fields marked <b>auto</b> are formulas and are never written.</div><div class="form2">${fields}</div>${dl}`;
}
async function saveRow(tkey, r){
  const t = S.tables[tkey]; const out = [];
  document.querySelectorAll('[data-ec]').forEach(el => {
    const c = +el.dataset.ec; const old = t.values[r][c]; let v = el.value;
    if (el.dataset.kind === 'date'){ const s = fromIso(v); const o = toSerial(old); if (s === o) return; out.push([c, s == null ? '' : { date: s }]); return; }
    if (String(old ?? '') === v) return;
    if (el.dataset.kind === 'num' && /^-?\d+(\.\d+)?$/.test(v.trim())) v = Number(v); else if (/^-?\d+(\.\d+)?$/.test(String(v).trim()) && REFMAP[norm(t.headers[c])] === 'dose') v = Number(v);
    out.push([c, v]);
  });
  if (!out.length){ toast('info', 'No changes.'); return; }
  if (await write('Saving…', () => S.store.update(tkey, r, t.snap(r), out), `Saved ${out.length} field${out.length > 1 ? 's' : ''}.`)) closeModal();
}

  if (el.dataset.f){ S[el.dataset.f] = el.value; render(); }
  if (el.dataset.re){ S.re[el.dataset.re] = el.value; S.re.draw(); }
  if (el.id === 'reOk'){ S.re.ok = el.checked; S.re.draw(); }
  if (el.dataset.pick){ const set = { fu: S.fuSel, fu2: S.oFu, pt: S.oPt }[el.dataset.pick]; el.checked ? set.add(el.dataset.id) : set.delete(el.dataset.id); (el.dataset.pick === 'fu' ? S.fuDraw : S.oDraw)(); }
  if (el.dataset.oinc){ S.oInc[el.dataset.oinc] = el.checked; S.oDraw(); }
  if (el.dataset.flag){ S[el.dataset.flag] = el.checked; render(); }
  if (el.dataset.aud){ const A = auditState(); A[el.dataset.aud] = el.value.trim(); saveAudit(); }
  if (el.dataset.win){ const v = fromIso(el.value); if (v != null){ S.win[el.dataset.win] = v; if (S.win.to < S.win.from) S.win.to = S.win.from; render(); } }
  if ('gall' in el.dataset){ genoaModel().rows.filter(r => r.cover === 'need').forEach(r => el.checked ? S.genoaSel.add(r.a.key) : S.genoaSel.delete(r.a.key)); render(); }
  if (el.dataset.gsel){ el.checked ? S.genoaSel.add(el.dataset.gsel) : S.genoaSel.delete(el.dataset.gsel); render(); }
  if (el.dataset.adm){ S.adm[el.dataset.adm] = el.value; renderAdmin(); }
  if (el.dataset.disp){ S.disp[el.dataset.disp] = el.value; renderDispose(); }
});

// ---------- load ----------
async function reload(quiet){
  if (!quiet) busy('Refreshing…');
  try {
    const d = await S.store.load();
    S.tables = d.tables; S.ref = d.ref || {}; S.besse = d.besse; S.besseSheet = d.besseSheet;
    const missing = ['patients','kits','appts'].filter(k => !S.tables[k]);
    if (missing.length){ S.loadErr = `Couldn’t find these tables in the workbook: ${missing.map(k => ({ patients:'Master Patient Tracker', kits:'Inventory', appts:'Appt List (NextGen)' }[k])).join(', ')}. The panel looks for their column headers.`; S.loaded = false; render(); return; }
    derive(); S.pull = S.store.getDoc('eskPull') || S.pull || {}; S.tasks = S.store.getDoc('eskTasks') || S.tasks || {}; { const a = S.store.getDoc('eskAudit'); if (a && (!S.aud || a.scans?.length >= (S.aud.scans?.length || 0))) S.aud = a; } S.loaded = true; S.loadErr = null; S.loadedAt = Date.now(); render();
  } catch (e){ console.error(e); S.loadErr = e.message || String(e); if (!S.loaded) render(); else toast('bad', esc(S.loadErr)); }
  finally { if (!quiet) busy(false); }
}
function setupErrorHTML(){ return `<main><div class="card"><h2>Can’t read the workbook</h2><div class="msg bad">${esc(S.loadErr)}</div><button class="btn primary" data-act="refresh">Try again</button></div></main>`; }
function notInExcelHTML(){
  return `<main style="max-width:640px"><div class="card"><h2><span class="brand"><span class="dot">ESK</span></span> ESK Tracker</h2>
    <p>This page is an Excel add-in. It runs inside the Esketamine Master Tracker workbook in Excel.</p>
    <h3>Install it (once)</h3>
    <ol><li>Click <b>Download manifest</b> below — it’s set up for this web address.</li>
      <li>Open the workbook in Excel on the web → <b>Home → Add-ins → More Add-ins → My Add-ins → Upload My Add-in</b>, and choose the file.</li>
      <li>An <b>ESK Tracker</b> button appears on the Home tab.</li></ol>
    <div class="row"><button class="btn primary" data-act="dlManifest">Download manifest</button><button class="btn" data-act="demo">Try the demo</button></div>
    <div class="small muted" style="margin-top:10px">The add-in keeps patient data in the workbook. This site only serves the app’s code.</div></div></main>`;
}
function downloadManifest(){
  const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, ''); const host = new URL(base).origin;
  const x = MANIFEST.replaceAll('__BASE__', base.replace(/\/$/, '')).replaceAll('__HOST__', host);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([x], { type:'application/xml' })); a.download = 'esk-tracker-manifest.xml'; a.click();
}
const MANIFEST = `__MANIFEST__`;

// ---------- full screen: an Office dialog; the pane stays open and does the Excel work ----------
const CH = 12000;
function sendChunks(fn, obj){ const s = JSON.stringify(obj); const id = Math.random().toString(36).slice(2); const n = Math.max(1, Math.ceil(s.length / CH)); for (let i = 0; i < n; i++) fn(JSON.stringify({ c: id, i, n, d: s.slice(i * CH, (i + 1) * CH) })); }
function makeRx(handler){ const buf = {}; return str => { let m; try { m = JSON.parse(str); } catch { return; } if (!m || !m.c) return; const b = buf[m.c] || (buf[m.c] = []); b[m.i] = m.d; if (b.filter(x => x != null).length === m.n){ delete buf[m.c]; try { handler(JSON.parse(b.join(''))); } catch (e){ console.error(e); } } }; }
function packLoad(d, store){
  const tables = {};
  for (const [k, tb] of Object.entries(d.tables)){
    let last = tb.values.length - 1; while (last >= 0 && !tb.snap(last).some(v => v !== null && v !== '')) last--;
    tables[k] = { name: tb.name, sheet: tb.sheet, headers: tb.headers, values: tb.values.slice(0, last + 1), fm: tb.formulas.slice(0, last + 1).map(r => r.map(x => isF(x) ? '1' : '0').join('')), fcol: tb.formulaCol };
  }
  return { tables, ref: d.ref, besse: d.besse, besseSheet: d.besseSheet, docs: { eskPull: store.getDoc('eskPull'), eskAudit: store.getDoc('eskAudit'), eskTasks: store.getDoc('eskTasks'), 'Office.AutoShowTaskpaneWithDocument': store.getDoc('Office.AutoShowTaskpaneWithDocument') } };
}
function hydrate(d){
  const tables = {};
  for (const [k, x] of Object.entries(d.tables)){ const tb = new Tbl(k, x.name, x.sheet, x.headers, x.values, x.fm.map(s => [...s].map(c => c === '1' ? '=' : ''))); tb.formulaCol = x.fcol; tables[k] = tb; }
  return { tables, ref: d.ref, besse: d.besse, besseSheet: d.besseSheet };
}
function RemoteStore(){
  const pend = new Map(); let docs = {}; let onChanged = null;
  const rx = makeRx(m => { if (m.rid && pend.has(m.rid)){ const p = pend.get(m.rid); pend.delete(m.rid); m.ok ? p.res(m.res) : p.rej(new Error(m.err)); } else if (m.ev === 'changed' && onChanged) onChanged(); });
  Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, a => rx(a.message));
  const up = obj => sendChunks(s => Office.context.ui.messageParent(s), obj);
  const call = (op, args) => new Promise((res, rej) => { const rid = Math.random().toString(36).slice(2); pend.set(rid, { res, rej }); up({ rid, op, args }); setTimeout(() => { if (pend.has(rid)){ pend.delete(rid); rej(new Error('Excel didn’t answer. Keep the ESK Tracker panel open behind this window, then try again.')); } }, 45000); });
  return {
    live: true, remote: true,
    async load(){ const d = await call('load'); docs = d.docs || {}; return hydrate(d); },
    update: (k, r, snap, ch) => call('update', [k, r, snap, ch]),
    add: (k, ch) => call('add', [k, ch]),
    setCells: (sh, cells) => call('setCells', [sh, cells]),
    getDoc: k => docs[k] ?? null,
    async setDoc(k, v){ docs[k] = v; await call('setDoc', [k, v]); },
    watch(cb){ onChanged = cb; },
    close(){ up({ ev: 'close' }); },
  };
}
let DLG = null;
function openFull(){
  if (DLG) return;
  const url = location.href.replace(/[?#].*$/, '') + '?mode=dialog';
  Office.context.ui.displayDialogAsync(url, { height: 96, width: 96, displayInIframe: true }, res => {
    if (res.status !== Office.AsyncResultStatus.Succeeded){ toast('bad', 'Couldn’t open full screen: ' + esc(res.error?.message || '')); return; }
    DLG = res.value; S.full = true; render();
    const reply = obj => { try { sendChunks(s => DLG && DLG.messageChild(s), obj); } catch (e){ console.error(e); } };
    const rx = makeRx(async m => {
      if (m.ev === 'close'){ try { DLG.close(); } catch {} DLG = null; S.full = false; reload(true); return; }
      const { rid, op, args } = m;
      try { if (!['load','update','add','setCells','setDoc'].includes(op)) throw new Error('Unknown request'); let res; if (op === 'load'){ const d = await S.store.load(); res = packLoad(d, S.store); } else res = await S.store[op](...(args || [])); reply({ rid, ok: true, res: res ?? null }); }
      catch (e){ reply({ rid, ok: false, err: e.message || String(e) }); }
    });
    DLG.addEventHandler(Office.EventType.DialogMessageReceived, a => rx(a.message));
    DLG.addEventHandler(Office.EventType.DialogEventReceived, () => { DLG = null; S.full = false; reload(true); });
    S.notifyDialog = () => reply({ ev: 'changed' });
  });
}

(function boot(){
  const demo = /[?&]demo\b/.test(location.search);
  S.mode = /[?&]mode=dialog\b/.test(location.search) ? 'dialog' : demo ? 'demo' : 'pane';
  const start = store => { S.store = store; render(); reload(true).then(() => store.watch?.(() => { clearTimeout(S._w); S._w = setTimeout(() => { if (DLG && S.notifyDialog){ S.notifyDialog(); return; } if ($('#modal').hidden && $('#busy').hidden) reload(true); }, 1500); })); };
  if (S.mode === 'dialog'){ if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; } Office.onReady(() => start(RemoteStore())); return; }
  if (demo){ start(DemoStore()); return; }
  if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; }
  let settled = false;
  Office.onReady(info => { settled = true; if (info.host === Office.HostType.Excel){ try { S.canFull = Office.context.requirements.isSetSupported('DialogApi', '1.2'); } catch { S.canFull = false; } start(OfficeStore()); if (S.canFull && CFG.autoFull) setTimeout(openFull, 600); } else $('#app').innerHTML = notInExcelHTML(); });
  setTimeout(() => { if (!settled) $('#app').innerHTML = notInExcelHTML(); }, 4000);
})();
</script>
