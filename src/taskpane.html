<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESK Tracker</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --bg:#f6f1e7;--surface:#fffdf8;--surface2:#f1eadc;--ink:#2b2622;--muted:#6f665c;--line:#e3d9c6;
  --accent:#b5532f;--accent-ink:#fff;--accent-soft:#f6e3da;
  --ok:#2f7a45;--ok-soft:#e3f1e6;--warn:#9a6a0b;--warn-soft:#fbf0d6;--bad:#b3261e;--bad-soft:#fbe4e1;--info:#2d5f8a;--info-soft:#e2edf6;
  --radius:12px;--shadow:0 1px 2px rgba(60,40,20,.06),0 2px 8px rgba(60,40,20,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1916;--surface:#26221e;--surface2:#2f2a25;--ink:#efe8dc;--muted:#a89f92;--line:#3b352f;
  --accent:#e0805c;--accent-ink:#1c1916;--accent-soft:#3a2a22;
  --ok:#7cc592;--ok-soft:#1f3326;--warn:#e3b75a;--warn-soft:#3a3020;--bad:#f08a80;--bad-soft:#3d2320;--info:#8ab8e0;--info-soft:#1f2c38;
  --shadow:none;}}
:root[data-theme="dark"]{--bg:#1c1916;--surface:#26221e;--surface2:#2f2a25;--ink:#efe8dc;--muted:#a89f92;--line:#3b352f;--accent:#e0805c;--accent-ink:#1c1916;--accent-soft:#3a2a22;--ok:#7cc592;--ok-soft:#1f3326;--warn:#e3b75a;--warn-soft:#3a3020;--bad:#f08a80;--bad-soft:#3d2320;--info:#8ab8e0;--info-soft:#1f2c38;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.brand small{font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;min-height:36px}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{padding:12px;max-width:980px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:38px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
input.fld,select.fld,textarea.fld{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:38px}
input.fld:focus,select.fld:focus,textarea.fld:focus,.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
.scan{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--radius);padding:10px}
.scan input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font-family:ui-monospace,Consolas,monospace;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.item.dim{opacity:.6}
.item.target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .time{font-weight:700;min-width:64px}
.item .name{font-weight:700}
.item .meta{color:var(--muted);font-size:12px}
.item .line{margin-top:6px;font-size:13px}
.item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.msg{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.info{background:var(--info-soft);color:var(--info)}
.msg b{color:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat .n{font-size:22px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{background:var(--surface2);font-size:12px;color:var(--muted)}
table.t td.num,table.t th.num{text-align:right}
table.t tr:last-child td{border-bottom:0}
input.ov{width:100%;max-width:70px;font-size:20px;font-weight:700;text-align:right;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface)}
.big{font-size:20px;font-weight:800;color:var(--accent)}
details.sec>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted)}
details.sec[open]>summary::before{content:"▾"}
.empty{padding:18px;text-align:center;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#modal .sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-size:17px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:420px){.form2{grid-template-columns:1fr}}
.writes{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:10px}
.writes code{font-family:ui-monospace,Consolas,monospace}
.fx{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px}
.ro{background:var(--surface2)!important;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:520px}
#toast .msg{box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:auto;width:100%}
#busy{position:fixed;inset:0;background:rgba(255,253,248,.55);z-index:40;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:600}
#busy[hidden]{display:none}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:6px 12px;text-align:center;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.printonly{display:none}
@media print{
  header.top,nav,.noprint,#toast,#busy,.banner{display:none!important}
  body{background:#fff;color:#000}
  body[data-print] main>*:not(.print-target){display:none!important}
  .card{border:0;box-shadow:none;padding:0}
  .printonly{display:block}
  table.t th,table.t td{border:1px solid #999}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="busy" hidden><div class="spin"></div><span id="busyText">Working…</span></div>
<script>
'use strict';
/* =====================================================================
   ESK Tracker — Excel add-in task pane
   Reads and writes the Esketamine Master Tracker workbook in place.
   - Finds tables by their headers (not by name or position).
   - Never writes into a formula cell.
   - Re-checks a row before writing; if someone changed it, it stops.
   ===================================================================== */

// ---------- small utils ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const isF = x => typeof x === 'string' && x.startsWith('=');
const blank = v => (v === '' || v === undefined) ? null : v;
const MS = 864e5;
const ymd = (y,m,d) => Math.round(Date.UTC(y, m-1, d) / MS) + 25569;
const todaySerial = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); };
const sDate = s => new Date((s - 25569) * MS);
const dowOf = s => sDate(s).getUTCDay();
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtD(s, mode){ if (s == null) return '—'; const d = sDate(s); const t = `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  return mode === 'dow' ? `${DOW[d.getUTCDay()]} ${t}` : mode === 'full' ? `${t}/${d.getUTCFullYear()}` : t; }
const isoOf = s => s == null ? '' : sDate(s).toISOString().slice(0,10);
function fromIso(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? ymd(+m[1], +m[2], +m[3]) : null; }
function fmtT(m){ if (m == null) return ''; let h = Math.floor(m/60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(mi).padStart(2,'0')} ${ap}`; }
function toSerial(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return (v > 1000 && v < 100000) ? Math.floor(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m){ let y = +m[3]; if (y < 100) y += 2000; return ymd(y, +m[1], +m[2]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return ymd(+m[1], +m[2], +m[3]);
  return null;
}
function toMinutes(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Math.round((v % 1) * 1440) % 1440;
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})\s*([AP]M)?/i); if (!m) return null;
  let h = +m[1]; if (m[3]){ if (/pm/i.test(m[3]) && h < 12) h += 12; if (/am/i.test(m[3]) && h === 12) h = 0; }
  return h*60 + +m[2];
}
const mrnKey = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return String(Math.round(v)); return String(v).trim().replace(/\.0+$/, ''); };
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const yes = v => /^(y|yes|true|x)$/i.test(String(v ?? '').trim());
const cleanScan = s => String(s ?? '').replace(/[\x00-\x1f\x7f]/g, '').trim();
const normScan = s => cleanScan(s).replace(/\s+/g, '').toUpperCase();
function pharmOf(v){ const s = String(v ?? '').toUpperCase(); if (s.includes('BESSE')) return 'BESSE'; if (s.includes('GENOA')) return 'GENOA'; return s.trim() ? 'OTHER' : ''; }
const PH_LABEL = { BESSE:'Besse', GENOA:'Genoa', OTHER:'Other', '':'—' };

// Spravato GS1 code — same layout the Inventory formulas use:
// 01 + GTIN(14) | 21 + serial(12) | 17 + YYMMDD | 10 + lot
function parseScan(raw){
  const s = cleanScan(raw).replace(/\s+/g, '');
  if (!/^01\d{14}21/.test(s) || s.length < 44) return null;
  const mg = s.startsWith('0100350458028034') ? 84 : s.startsWith('0100350458028027') ? 56 : null;
  const serial = s.slice(18, 30);
  const exp = s.slice(30, 32) === '17' ? ymd(2000 + +s.slice(32,34), +s.slice(34,36), +s.slice(36,38)) : null;
  const lot = /\d$/.test(s) ? s.slice(40, 47) : s.slice(40, 48);
  return { s, mg, serial, exp, lot };
}

// ---------- settings (this device only; no patient data) ----------
const DEF = { me:'', sup:'', pm:'', clinic:'SRL', email:'eskorders@mymhs.com', schedDays:30, genoaDays:14, theme:'' };
let CFG = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('eskCfg') || '{}')); } catch { return { ...DEF }; } })();
function saveCfg(){ try { localStorage.setItem('eskCfg', JSON.stringify(CFG)); } catch {} applyTheme(); }
function applyTheme(){ if (CFG.theme) document.documentElement.dataset.theme = CFG.theme; else delete document.documentElement.dataset.theme; }
applyTheme();

// ---------- table model ----------
class Tbl {
  constructor(key, name, sheet, headers, values, formulas){
    this.key = key; this.name = name; this.sheet = sheet;
    this.headers = headers.map(h => String(h ?? '')); this.values = values; this.formulas = formulas;
    this.cols = {}; this.headers.forEach((h,i) => { const n = norm(h); if (n && !(n in this.cols)) this.cols[n] = i; });
    this.formulaCol = this.headers.map((_, c) => { let f = 0, n = 0; for (const r of formulas){ const x = r[c]; if (x !== '' && x != null){ n++; if (isF(x)) f++; } } return n > 0 && f / n >= 0.5; });
  }
  get(r, k){ const c = this.cols[k]; return c == null ? null : blank(this.values[r]?.[c]); }
  isFormula(r, c){ return isF(this.formulas[r]?.[c]); }
  snap(r){ return this.headers.map((_, c) => this.isFormula(r, c) ? null : this.values[r][c]); }
}
const SIG = {
  patients: ['mrn','patientname','status','txfrequency','pharmacy'],
  kits:     ['scanhere','mrn','receivedmg','mgremaining','administeredmg'],
  appts:    ['mrn','patient','date','time','event','status'],
};
const same = (a, b) => String(a ?? '').trim() === String(b ?? '').trim();
const snapMatch = (vals, snap) => snap.every((s, c) => s === null || same(vals[c], s));

function parseRef(values){
  const out = {}; let hr = values.findIndex(r => r.some(v => norm(v) === 'pharmacy') && r.some(v => norm(v) === 'dose'));
  if (hr < 0) return out;
  values[hr].forEach((h, c) => { const k = norm(h); if (!k) return; const list = []; for (let r = hr+1; r < values.length; r++){ const v = values[r][c]; if (v === '' || v == null) continue; list.push(v); } out[k] = list; });
  return out;
}
// Besse Order tab: the summary table (Clinic/Date/Dose/…/To Be Ordered) and the weekly history (DATE | 56 | 84)
function parseBesse(values, formulas){
  const out = { rows:{}, hist:null, vals:values };
  for (let r = 0; r < values.length; r++){
    const row = values[r].map(norm);
    const cOv = row.indexOf('approvedoverage');
    if (cOv >= 0 && out.hdr == null){
      out.hdr = r; const col = k => row.indexOf(k);
      out.c = { clinic:col('clinic'), date:col('date'), dose:col('dose'), oh:col('besseoh'), w1:col('apptsnextweek'), w2:col('appts2weekout'), ov:cOv, order:col('tobeordered') };
      for (let k = r+1; k < Math.min(values.length, r+6); k++){ const d = num(values[k][out.c.dose]); if (d === 56 || d === 84) out.rows[d] = { r:k, ov:num(values[k][cOv]), oh:num(values[k][out.c.oh]) }; }
    }
    for (let c = 0; c < row.length - 2; c++){
      if (row[c] === 'date' && num(values[r][c+1]) === 56 && num(values[r][c+2]) === 84 && !out.hist){ out.hist = { hdr:r, c }; }
    }
  }
  return out;
}
const colLetter = n => { let s = ''; n++; while (n){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; };

// ---------- store: live workbook (Office.js) ----------
function OfficeStore(){
  const names = {}; let besseSheet = null, besseUsedAddr = null;
  async function tableBody(ctx, k){ const t = ctx.workbook.tables.getItem(names[k]); const b = t.getDataBodyRange(); b.load('values,formulas,rowCount'); await ctx.sync(); return { t, b }; }
  async function writeCells(ctx, b, row, changes){
    const cells = [];
    for (const [c, v] of changes){ if (isF(b.formulas[row][c])) throw new Error('Stopped: that column holds a formula in the workbook.'); const cell = b.getCell(row, c); cell.load('numberFormat'); cells.push([cell, v]); }
    await ctx.sync();
    for (const [cell, v] of cells){
      if (v && typeof v === 'object' && 'date' in v){ cell.values = [[v.date]]; if (/general/i.test(String(cell.numberFormat[0][0]))) cell.numberFormat = [['m/d/yyyy']]; }
      else cell.values = [[v]];
    }
    await ctx.sync();
  }
  return {
    live: true,
    async load(){
      return Excel.run(async ctx => {
        const ts = ctx.workbook.tables; ts.load('items/name'); await ctx.sync();
        const hs = ts.items.map(t => { const h = t.getHeaderRowRange(); h.load('values'); const ws = t.worksheet; ws.load('name'); return { t, h, ws }; });
        await ctx.sync();
        const found = {};
        for (const x of hs){ const set = new Set(x.h.values[0].map(norm)); for (const [k, req] of Object.entries(SIG)) if (!found[k] && req.every(q => set.has(q))) found[k] = x; }
        const bodies = {};
        for (const [k, x] of Object.entries(found)){ names[k] = x.t.name; const b = x.t.getDataBodyRange(); b.load('values,formulas'); bodies[k] = { b, x }; }
        const wss = ctx.workbook.worksheets; wss.load('items/name'); await ctx.sync();
        const tables = {};
        for (const [k, { b, x }] of Object.entries(bodies)) tables[k] = new Tbl(k, x.t.name, x.ws.name, x.h.values[0], b.values, b.formulas);
        const refWs = wss.items.find(w => w.name.trim().toUpperCase() === 'REF');
        const bo = wss.items.find(w => /besse/i.test(w.name) && /order/i.test(w.name));
        let rr = null, br = null;
        if (refWs){ rr = refWs.getUsedRange(true); rr.load('values'); }
        if (bo){ br = bo.getRange('A1:Z200'); br.load('values,formulas'); besseSheet = bo.name; }
        await ctx.sync();
        return { tables, ref: rr ? parseRef(rr.values) : {}, besse: br ? parseBesse(br.values, br.formulas) : null, besseSheet };
      });
    },
    async update(k, r, snap, changes){
      return Excel.run(async ctx => {
        const { b } = await tableBody(ctx, k);
        let row = r;
        if (!(row < b.values.length && snapMatch(b.values[row], snap))){
          row = b.values.findIndex(v => snapMatch(v, snap));
          if (row < 0) throw new Error('That row was changed in the workbook by someone else. The panel has refreshed — check it and try again.');
        }
        await writeCells(ctx, b, row, changes);
      });
    },
    async add(k, changes){
      return Excel.run(async ctx => {
        let { t, b } = await tableBody(ctx, k);
        let last = -1;
        b.values.forEach((v, i) => { if (v.some((x, c) => !isF(b.formulas[i][c]) && x !== '' && x != null)) last = i; });
        let row = last + 1;
        if (row >= b.values.length){
          t.rows.add(null); await ctx.sync();
          b = t.getDataBodyRange(); b.load('values,formulas,rowCount'); await ctx.sync();
          row = b.rowCount - 1;

  if (k.pharm !== it.inf.pharm && it.inf.pharm) return setMsg('todayMsg', 'bad', `${esc(nm(it.a.mrn))} gets ${PH_LABEL[it.inf.pharm]} medication, but this kit is ${PH_LABEL[k.pharm]}.`);
  const notes = [];
  if (it.inf.mg && k.recv !== it.inf.mg) notes.push(`<b>Dose check:</b> kit is ${k.recv} mg, appointment is ${it.inf.mg} mg.`);
  if (k.pharm === 'BESSE'){ const older = S.K.filter(x => x.pharm === 'BESSE' && x.available && x.recv === k.recv && x.id !== k.id && !Object.values(S.pull[d]).includes(x.id) && fifo(x, k) < 0); if (older.length) notes.push(`An older Besse ${k.recv} mg kit is available (received ${fmtD(older.sort(fifo)[0].received)}).`); }
  S.pull[d][it.a.key] = k.id; S.target = null; savePull();
  setMsg('todayMsg', notes.length ? 'warn' : 'ok', `Pulled serial ${esc(k.serial)} (${k.recv} mg ${PH_LABEL[k.pharm]}) for <b>${esc(nm(it.a.mrn))}</b> at ${fmtT(it.a.time)}.` + (notes.length ? '<br>' + notes.join('<br>') : ''));
}

// ---------- ordering ----------
function weeksFor(od){ const d = dowOf(od); let add = (1 - d + 7) % 7; if (add === 0) add = 7; const m = od + add; return [[m, m+4], [m+7, m+11]]; }
function besseModel(){
  const w = weeksFor(S.orderDate); const rows = { 56:{ w1:0, w2:0 }, 84:{ w1:0, w2:0 } }; const list = [], review = [];
  for (const a of S.A){
    if (!a.active || a.date < w[0][0] || a.date > w[1][1]) continue;
    const wk = a.date <= w[0][1] ? 1 : a.date >= w[1][0] ? 2 : 0; if (!wk) continue;
    const inf = apptInfo(a);
    if (inf.pharm !== 'BESSE'){ if (!inf.pharm) review.push({ a, why:'Not on the patient tracker — pharmacy unknown' }); continue; }
    if (inf.mg !== 56 && inf.mg !== 84){ review.push({ a, why:`Dose ${inf.mg ?? 'unknown'}` }); continue; }
    rows[inf.mg]['w' + wk]++; list.push({ a, wk, mg: inf.mg, verify: inf.mg === 56 && !a.isStart });
  }
  const besseKits = S.K.filter(k => k.pharm === 'BESSE' && k.full);
  for (const mg of [56, 84]){
    const r = rows[mg]; r.oh = besseKits.filter(k => k.recv === mg && !k.expired).length;
    r.expiredFull = besseKits.filter(k => k.recv === mg && k.expired).length;
    r.expSoon = besseKits.filter(k => k.recv === mg && !k.expired && k.expDate != null && k.expDate <= w[1][1]).length;
    const sheetOv = S.besse?.rows?.[mg]?.ov; r.sheetOv = sheetOv; r.ov = S.ov[mg] ?? sheetOv ?? (mg === 56 ? 1 : -2);
    r.order = Math.max(0, r.w1 + r.w2 - r.oh + r.ov);
  }
  return { w, rows, list: list.sort((a, b) => a.a.date - b.a.date || (a.a.time ?? 0) - (b.a.time ?? 0)), review };
}
function genoaModel(){
  const T = todaySerial(), end = T + CFG.genoaDays;
  const appts = S.A.filter(a => a.active && a.date >= T && a.date <= end && apptInfo(a).pharm === 'GENOA').sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));
  const onhand = new Map(), open = new Map();
  for (const k of S.K){ if (!k.mrn) continue;
    if (k.available && k.pharm !== 'BESSE'){ if (!onhand.has(k.mrn)) onhand.set(k.mrn, []); onhand.get(k.mrn).push(k); }
    if (k.openOrder && k.pharm !== 'BESSE'){ if (!open.has(k.mrn)) open.set(k.mrn, []); open.get(k.mrn).push(k); } }
  for (const l of onhand.values()) l.sort(fifo); for (const l of open.values()) l.sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0) || a.r - b.r);
  const rows = appts.map(a => { const inf = apptInfo(a);
    const oh = onhand.get(a.mrn) || []; let i = oh.findIndex(k => !inf.mg || k.recv === inf.mg);
    if (i >= 0 && oh[i].expDate != null && oh[i].expDate < a.date) i = -1; // Genoa kits expire 14 days after receipt
    if (i >= 0){ const k = oh.splice(i, 1)[0]; return { a, inf, cover:'onhand', k }; }
    const op = open.get(a.mrn) || []; if (op.length){ const k = op.shift(); return { a, inf, cover:'ordered', k }; }
    return { a, inf, cover:'need' };
  });
  const expiring = S.K.filter(k => k.pharm === 'GENOA' && k.needsDisposal);
  return { rows, end, expiring };
}

// ---------- write helpers ----------
function changesFor(tkey, obj){
  const t = S.tables[tkey]; const out = [], skipped = [];
  for (const [key, v] of Object.entries(obj)){ const c = t.cols[key]; if (c == null){ skipped.push(key); continue; } if (t.formulaCol[c]){ skipped.push(t.headers[c]); continue; } out.push([c, v]); }
  return { out, skipped };
}
function describe(tkey, out){ const t = S.tables[tkey]; return out.map(([c, v]) => `<div><code>${esc(colLetterFor(tkey, c))}</code> ${esc(t.headers[c].trim())} = <b>${esc(v && typeof v === 'object' ? fmtD(v.date, 'full') : v === '' ? '(clear)' : v)}</b></div>`).join(''); }
const TABLE_OFFSET = { kits: 1, patients: 1, appts: 12 }; // column where each table starts (B, B, M) — display only
const colLetterFor = (k, c) => colLetter((TABLE_OFFSET[k] ?? 0) + c);
const mrnVal = m => /^\d+$/.test(m) ? Number(m) : m;
function pharmText(code){ const want = code === 'BESSE' ? 'Besse' : code === 'GENOA' ? 'Genoa' : code; const refv = (S.ref.pharmacy || []).find(v => pharmOf(v) === code); return refv || want; }
async function write(label, fn, okText){
  busy(label);
  try { await fn(); await reload(true); toast('ok', okText || 'Saved to the workbook.'); return true; }
  catch (e){ console.error(e); try { await reload(true); } catch {} toast('bad', esc(e.message || String(e))); return false; }
  finally { busy(false); }
}

async function recvScan(raw){
  const scan = cleanScan(raw); const p = parseScan(scan); const T = todaySerial();
  if (!p) return setMsg('recvMsg', 'bad', 'That doesn’t read as a Spravato barcode. Scan the 2D code on the kit.');
  if (!p.mg) return setMsg('recvMsg', 'warn', 'Scanned code isn’t a known 56 mg or 84 mg Spravato product. Check the kit.');
  const dup = S.K.find(k => k.serialN === normScan(p.serial));
  if (dup) return setMsg('recvMsg', 'bad', `Serial ${esc(p.serial)} is already in the log (row ${dup.r + 3}${dup.mrn ? ', ' + esc(nm(dup.mrn)) : ''}).`);
  const me = CFG.me; if (!me) { openSettings(); return setMsg('recvMsg', 'warn', 'Add your name in Settings first — it goes in Logging PCT.'); }
  if (S.recvPharm === 'Genoa'){
    const line = S.recvLine ? S.K.find(k => k.id === S.recvLine) : null;
    if (!line) return setMsg('recvMsg', 'warn', 'Pick the patient’s order line below first (or use “Receive for this patient”).');
    const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; if (!line.pharmRaw) obj.pharmacy = pharmText('GENOA');
    const { out } = changesFor('kits', obj);
    const ok = await write('Receiving…', () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out), `Received for ${nm(line.mrn)}.`);
    if (ok){ S.recvLine = null; S.lastRecv = 'S:' + normScan(p.serial); S.recvMsg = { kind:'ok', html:`Received ${p.mg} mg for <b>${esc(nm(line.mrn))}</b> into row ${line.r + 3}.` }; render(); }
    return;
  }
  const line = S.recvLine ? S.K.find(k => k.id === S.recvLine) : S.K.filter(k => k.openOrder && k.pharm === 'BESSE').sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0))[0];
  let ok;
  if (line){ const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; const { out } = changesFor('kits', obj); ok = await write('Receiving…', () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out)); }
  else { const { out } = changesFor('kits', { loggingpct: me, scanhere: scan, pharmacy: pharmText('BESSE'), datereceived: { date: T } }); ok = await write('Receiving…', () => S.store.add('kits', out)); }
  if (ok){ S.recvLine = null; S.lastRecv = 'S:' + normScan(p.serial); const L = S.K.find(k => k.id === S.lastRecv); S.recvMsg = { kind:'ok', html:`Received Besse ${p.mg} mg · serial ${esc(p.serial)}${L ? ' into row ' + (L.r + 3) : ''}. Scan the next kit.` }; render(); }
}
function mrnFromInput(v){ const m = String(v || '').match(/(\d{3,})\s*$/); if (m) return m[1]; const p = S.P.find(p => p.name.toUpperCase() === String(v || '').trim().toUpperCase()); return p?.mrn || null; }
async function recvNew(){
  const mrn = mrnFromInput($('#recvNewPt')?.value); if (!mrn || !S.byMrn.has(mrn)) return setMsg('recvMsg', 'bad', 'Choose a patient from the list.');

async function saveBesse(){
  const b = S.besse; if (!b || b.hdr == null) return toast('bad', 'Couldn’t find the summary table on the Besse Order tab.');
  const m = besseModel(); const c = b.c; const cells = [];
  const A = (r, col) => colLetter(col) + (r + 1);
  if (c.date >= 0 && b.rows[56]) cells.push([A(b.rows[56].r, c.date), { date: S.orderDate }]);
  for (const mg of [56, 84]){ const rr = b.rows[mg]; if (!rr) continue; const r = m.rows[mg];
    if (c.w1 >= 0) cells.push([A(rr.r, c.w1), r.w1]); if (c.w2 >= 0) cells.push([A(rr.r, c.w2), r.w2]); if (c.ov >= 0) cells.push([A(rr.r, c.ov), r.ov]); }
  let histNote = '';
  if (b.hist){
    const hr = findHistRow(); if (hr != null){ cells.push([colLetter(b.hist.c + 1) + (hr.r + 1), m.rows[56].order], [colLetter(b.hist.c + 2) + (hr.r + 1), m.rows[84].order]); histNote = ` and logged ${m.rows[56].order} × 56 / ${m.rows[84].order} × 84 for the week of ${fmtD(hr.d)}`; }
    else histNote = ' (no history row matches this date, so the history wasn’t changed)';
  }
  await write('Saving to Besse Order…', () => S.store.setCells(S.besseSheet, cells), `Saved to Besse Order${histNote}.`);
}
function findHistRow(){ // the history's DATE column holds one row per order week: use this date, or the next one within 6 days
  const b = S.besse; if (!b?.hist) return null; const vals = b.vals || []; let best = null;
  for (let r = b.hist.hdr + 1; r < vals.length; r++){ const d = toSerial(vals[r][b.hist.c]); if (d == null) continue; const diff = d - S.orderDate; if (diff >= 0 && diff <= 6 && (best == null || diff < best.diff)) best = { r, d, diff }; }
  return best;
}

      <div class="acts">${(k.needsDisposal || k.partialOpen) ? `<button class="btn sm" data-act="dispose" data-id="${esc(k.id)}">Dispose…</button>` : ''}<button class="btn sm ghost" data-act="editKit" data-id="${esc(k.id)}">Edit row</button></div></div>`).join('') : '<div class="empty">Nothing here.</div>'}</div></div>`;
}
function invScan(raw){ const { p, list } = findByScan(raw); if (!list.length) return toast(p ? 'warn' : 'bad', p ? `Serial ${esc(p.serial)} isn’t in the log.` : 'Not a Spravato barcode.'); openKit(list[0].id); }
function openKit(id){

function openDispose(id){

function renderDispose(){
  const k = S.K.find(x => x.id === S.disp.id); if (!k) return closeModal(); const T = todaySerial();

async function dispSave(){
  const k = S.K.find(x => x.id === S.disp.id); if (!k) return; const T = todaySerial();

// ---------- generic row editor ----------
const REFMAP = { pharmacy:'pharmacy', receivedmg:'dose', administeredmg:'dose', protocolmg:'dose', disposalmethod:'disposalmethod', markedfordisposal:'yesno', status:'status', txfrequency:'treatmentfrequency', coverageoptions:'coverageoptions' };
function distinct(tkey, key, max = 40){ const t = S.tables[tkey]; if (!t || t.cols[key] == null) return []; const s = new Map(); for (let r = t.values.length - 1; r >= 0 && s.size < max; r--){ const v = t.values[r][t.cols[key]]; if (v !== '' && v != null && !s.has(String(v))) s.set(String(v), v); } return [...s.values()]; }
const datalist = (id, vals) => `<datalist id="${id}">${[...new Set(vals.map(String))].map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
const isDateHeader = h => /date|expiration|use by|auth exp|auth start|thru|last treatment|next treatment/i.test(h);
function editorHTML(tkey, r){
  const t = S.tables[tkey]; let dl = '';
  const fields = t.headers.map((h, c) => {
    if (!h.trim()) return '';
    const v = t.values[r][c]; const f = t.formulaCol[c] || t.isFormula(r, c); const n = norm(h);
    const shown = typeof v === 'number' && isDateHeader(h) ? fmtD(toSerial(v), 'full') : (v ?? '');
    if (f) return `<div><label class="lbl">${esc(h.trim())}<span class="fx">auto</span></label><input class="fld ro" value="${esc(shown)}" readonly tabindex="-1"></div>`;
    if (isDateHeader(h) && (v === '' || v == null || typeof v === 'number')) return `<div><label class="lbl" for="e${c}">${esc(h.trim())}</label><input id="e${c}" class="fld" type="date" data-ec="${c}" data-kind="date" value="${isoOf(toSerial(v))}"></div>`;
    const opts = [...(S.ref[REFMAP[n]] || []), ...distinct(tkey, n, 25)]; const lid = `dl_${tkey}_${c}`; if (opts.length) dl += datalist(lid, opts);
    const kind = typeof v === 'number' || n === 'mrn' ? 'num' : 'text';
    return `<div><label class="lbl" for="e${c}">${esc(h.trim())}</label><input id="e${c}" class="fld" data-ec="${c}" data-kind="${kind}" ${opts.length ? `list="${lid}"` : ''} value="${esc(v ?? '')}"></div>`;
  }).join('');
  return `<div class="small muted">Fields marked <b>auto</b> are formulas and are never written.</div><div class="form2">${fields}</div>${dl}`;
}
async function saveRow(tkey, r){
  const t = S.tables[tkey]; const out = [];
  document.querySelectorAll('[data-ec]').forEach(el => {
    const c = +el.dataset.ec; const old = t.values[r][c]; let v = el.value;
    if (el.dataset.kind === 'date'){ const s = fromIso(v); const o = toSerial(old); if (s === o) return; out.push([c, s == null ? '' : { date: s }]); return; }
    if (String(old ?? '') === v) return;
    if (el.dataset.kind === 'num' && /^-?\d+(\.\d+)?$/.test(v.trim())) v = Number(v); else if (/^-?\d+(\.\d+)?$/.test(String(v).trim()) && REFMAP[norm(t.headers[c])] === 'dose') v = Number(v);
    out.push([c, v]);
  });
  if (!out.length){ toast('info', 'No changes.'); return; }
  if (await write('Saving…', () => S.store.update(tkey, r, t.snap(r), out), `Saved ${out.length} field${out.length > 1 ? 's' : ''}.`)) closeModal();
}

// ---------- modal / toast / busy ----------
function openModal(html){ $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal(){ $('#modal').hidden = true; $('#sheet').innerHTML = ''; S.adm = null; S.disp = null; }
function toast(kind, html){ $('#toast').innerHTML = ''; const el = document.createElement('div'); el.className = 'msg ' + kind; el.innerHTML = html; $('#toast').appendChild(el); setTimeout(() => el.remove(), kind === 'bad' ? 9000 : 2600); }
function busy(t){ $('#busy').hidden = !t; if (t) $('#busyText').textContent = t; }
async function copyText(text, html){
  try { if (html && window.ClipboardItem && navigator.clipboard?.write){ await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type:'text/html' }), 'text/plain': new Blob([text], { type:'text/plain' }) })]); return true; } } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const d = document.createElement('div'); d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-9999px;top:0'; d.innerHTML = html || esc(text).replace(/\n/g, '<br>'); document.body.appendChild(d);
  const rg = document.createRange(); rg.selectNodeContents(d); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); let ok = false; try { ok = document.execCommand('copy'); } catch {} sel.removeAllRanges(); d.remove(); return ok;
}

// ---------- events ----------
const ACT = {
  view: el => { S.view = el.dataset.v; render(); },
  refresh: () => reload(),
  settings: openSettings,
  close: closeModal,
  day: el => { const d = +el.dataset.d; S.day = d === 0 ? todaySerial() : S.day + d; S.todayMsg = null; S.target = null; render(); },
  target: el => { S.target = S.target === el.dataset.k ? null : el.dataset.k; S.todayMsg = null; render(); setTimeout(() => $('#scanToday')?.focus(), 20); },
  untarget: () => { S.target = null; render(); },
  unpull: el => { const d = isoOf(S.day); if (S.pull[d]) delete S.pull[d][el.dataset.k]; savePull(); S.todayMsg = { kind:'info', html:'Pull undone.' }; render(); },
  admin: el => openAdmin(el.dataset.k),
  admKit: el => { S.adm.kitId = el.dataset.id; renderAdmin(); },
  admSave: adminSave,
  patient: el => openPatient(el.dataset.m),
  copyPull: async () => {
    const items = todayModel(S.day).filter(i => i.pulledKit || i.adminKit);
    const H = ['Time', 'Patient', 'MRN', 'mg', 'Pharmacy', 'Serial', 'Lot', 'Use by', 'Status'];
    const R = items.map(i => { const k = i.adminKit || i.pulledKit; return [fmtT(i.a.time), nm(i.a.mrn), i.a.mrn, k.recv, PH_LABEL[k.pharm], k.serial, k.lot, fmtD(k.expDate, 'full'), i.adminKit ? 'Administered' : 'Pulled']; });
    const ok = await copyText([H, ...R].map(r => r.join('\t')).join('\n'), `<table border="1">${[H, ...R].map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`);
    toast(ok ? 'ok' : 'bad', ok ? 'Copied.' : 'Couldn’t copy — use Print instead.');
  },
  print: el => { const t = el.dataset.t; document.querySelectorAll('.print-target').forEach(x => x.classList.toggle('print-target', x.id === t)); document.body.dataset.print = t; setTimeout(() => { window.print(); delete document.body.dataset.print; }, 30); },
  recvPh: el => { S.recvPharm = el.dataset.p; S.recvLine = null; S.recvMsg = null; render(); },
  recvPick: el => { S.recvLine = S.recvLine === el.dataset.id ? null : el.dataset.id; S.recvMsg = null; render(); setTimeout(() => $('#scanRecv')?.focus(), 20); },
  recvNew,
  orderTab: el => { S.orderTab = el.dataset.p; render(); },
  copyBesse: async () => { const { html, text } = besseTableText(); const ok = await copyText(text, html); toast(ok ? 'ok' : 'bad', ok ? 'Table copied — paste it into the email.' : 'Couldn’t copy.'); },
  emailBesse: async () => {
    const { html, text } = besseTableText(); await copyText(text, html);
    const subj = `Besse Order — ${CFG.clinic} — ${fmtD(S.orderDate, 'full')}`;
    const a = document.createElement('a'); a.href = `mailto:${encodeURIComponent(CFG.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent('Hello,\n\nPlease see this week’s Besse order below.\n\n' + text + '\n\nThank you,\n' + (CFG.me || ''))}`; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    toast('info', 'Email opened. The formatted table is also on your clipboard — paste it over the plain one if you prefer.');
  },
  saveBesse,
  gselAll: () => { genoaModel().rows.filter(r => r.cover === 'need').forEach(r => S.genoaSel.add(r.a.key)); render(); },
  genoaOrder,
  patAll: el => { S.patAll = el.dataset.v === 'true'; render(); },
  invF: el => { S.invFilter = el.dataset.v; render(); },
  editKit: el => openKit(el.dataset.id),
  dispose: el => openDispose(el.dataset.id),
  dispSave,
  saveRow: el => saveRow(el.dataset.t, +el.dataset.r),
  cfgSave: async () => {
    document.querySelectorAll('[data-cfg]').forEach(el => { const k = el.dataset.cfg; CFG[k] = el.type === 'number' ? Math.max(1, +el.value || DEF[k]) : el.value.trim(); });
    saveCfg(); const auto = $('#sAuto'); if (auto && S.store?.live) await S.store.setDoc('Office.AutoShowTaskpaneWithDocument', auto.checked);
    closeModal(); render();
  },
  demo: () => { location.search = '?demo=1'; },
  dlManifest: () => downloadManifest(),
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'button') return;
  const f = ACT[el.dataset.act]; if (f){ e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden){ closeModal(); return; }
  const el = e.target; if (e.key !== 'Enter' || !el.dataset?.scan) return;
  e.preventDefault(); const v = el.value; el.value = ''; if (!cleanScan(v)) return;
  const k = el.dataset.scan;
  if (k === 'today') todayScan(v);
  else if (k === 'recv') recvScan(v);
  else if (k === 'inv') invScan(v);
  else if (k === 'admin'){ const { p, list } = findByScan(v); if (!list.length){ S.adm.msg = { kind:'bad', html: p ? `Serial ${esc(p.serial)} isn’t in the log.` : 'Not a Spravato barcode.' }; } else { S.adm.kitId = (list.find(x => !x.administered) || list[0]).id; S.adm.msg = null; } renderAdmin(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input){ S[el.dataset.input] = el.value; clearTimeout(S._t); S._t = setTimeout(render, 180); }
  if (el.dataset.adm){ S.adm[el.dataset.adm] = el.value; clearTimeout(S._a); S._a = setTimeout(() => { const id = el.id, pos = el.selectionStart; renderAdmin(); const n = document.getElementById(id); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }, 300); }
  if (el.dataset.disp){ S.disp[el.dataset.disp] = el.value; clearTimeout(S._d); S._d = setTimeout(() => { const id = el.id, pos = el.selectionStart; renderDispose(); const n = document.getElementById(id); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }, 300); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'orderDate'){ const s = fromIso(el.value); if (s != null){ S.orderDate = s; render(); } }
  if (el.dataset.ov){ const v = Number(el.value); if (!isNaN(v)){ S.ov[el.dataset.ov] = v; render(); } }
  if (el.dataset.gsel){ el.checked ? S.genoaSel.add(el.dataset.gsel) : S.genoaSel.delete(el.dataset.gsel); render(); }
  if (el.dataset.adm){ S.adm[el.dataset.adm] = el.value; renderAdmin(); }
  if (el.dataset.disp){ S.disp[el.dataset.disp] = el.value; renderDispose(); }
});

// ---------- load ----------
async function reload(quiet){
  if (!quiet) busy('Refreshing…');
  try {
    const d = await S.store.load();
    S.tables = d.tables; S.ref = d.ref || {}; S.besse = d.besse; S.besseSheet = d.besseSheet;
    const missing = Object.keys(SIG).filter(k => !S.tables[k]);
    if (missing.length){ S.loadErr = `Couldn’t find these tables in the workbook: ${missing.map(k => ({ patients:'Master Patient Tracker', kits:'Inventory', appts:'Appt List (NextGen)' }[k])).join(', ')}. The panel looks for their column headers.`; S.loaded = false; render(); return; }
    derive(); S.pull = S.store.getDoc('eskPull') || S.pull || {}; S.loaded = true; S.loadErr = null; S.loadedAt = Date.now(); render();
  } catch (e){ console.error(e); S.loadErr = e.message || String(e); if (!S.loaded) render(); else toast('bad', esc(S.loadErr)); }
  finally { if (!quiet) busy(false); }
}
function setupErrorHTML(){ return `<main><div class="card"><h2>Can’t read the workbook</h2><div class="msg bad">${esc(S.loadErr)}</div><button class="btn primary" data-act="refresh">Try again</button></div></main>`; }
function notInExcelHTML(){
  return `<main style="max-width:640px"><div class="card"><h2><span class="brand"><span class="dot">ESK</span></span> ESK Tracker</h2>
    <p>This page is an Excel add-in. It runs inside the Esketamine Master Tracker workbook in Excel.</p>
    <h3>Install it (once)</h3>
    <ol><li>Click <b>Download manifest</b> below — it’s set up for this web address.</li>
      <li>Open the workbook in Excel on the web → <b>Home → Add-ins → More Add-ins → My Add-ins → Upload My Add-in</b>, and choose the file.</li>
      <li>An <b>ESK Tracker</b> button appears on the Home tab.</li></ol>
    <div class="row"><button class="btn primary" data-act="dlManifest">Download manifest</button><button class="btn" data-act="demo">Try the demo</button></div>
    <div class="small muted" style="margin-top:10px">The add-in keeps patient data in the workbook. This site only serves the app’s code.</div></div></main>`;
}
function downloadManifest(){
  const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, ''); const host = new URL(base).origin;
  const x = MANIFEST.replaceAll('__BASE__', base.replace(/\/$/, '')).replaceAll('__HOST__', host);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([x], { type:'application/xml' })); a.download = 'esk-tracker-manifest.xml'; a.click();
}
const MANIFEST = `__MANIFEST__`;

(function boot(){
  const demo = /[?&]demo\b/.test(location.search);
  const start = store => { S.store = store; render(); reload(true).then(() => store.watch?.(() => { clearTimeout(S._w); S._w = setTimeout(() => { if ($('#modal').hidden && $('#busy').hidden) reload(true); }, 1500); })); };
  if (demo){ start(DemoStore()); return; }
  if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; }
  let settled = false;
  Office.onReady(info => { settled = true; if (info.host === Office.HostType.Excel) start(OfficeStore()); else $('#app').innerHTML = notInExcelHTML(); });
  setTimeout(() => { if (!settled) $('#app').innerHTML = notInExcelHTML(); }, 4000);
})();
</script>
