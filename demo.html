<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESK Tracker</title>
<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1916;--surface:#26221e;--surface2:#2f2a25;--ink:#efe8dc;--muted:#a89f92;--line:#3b352f;
  --accent:#e0805c;--accent-ink:#1c1916;--accent-soft:#3a2a22;
  --ok:#7cc592;--ok-soft:#1f3326;--warn:#e3b75a;--warn-soft:#3a3020;--bad:#f08a80;--bad-soft:#3d2320;--info:#8ab8e0;--info-soft:#1f2c38;
  --shadow:none;}}
:root[data-theme="dark"]{--bg:#1c1916;--surface:#26221e;--surface2:#2f2a25;--ink:#efe8dc;--muted:#a89f92;--line:#3b352f;--accent:#e0805c;--accent-ink:#1c1916;--accent-soft:#3a2a22;--ok:#7cc592;--ok-soft:#1f3326;--warn:#e3b75a;--warn-soft:#3a3020;--bad:#f08a80;--bad-soft:#3d2320;--info:#8ab8e0;--info-soft:#1f2c38;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.brand small{font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;min-height:36px}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{padding:12px;max-width:1500px;margin:0 auto}
.cols{display:block}
@media(min-width:1000px){.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}.cols.swap{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}.cols>div>.card:first-child{margin-top:0}}
.item{border-left-width:4px}
.item.st-done{border-left-color:var(--ok)} .item.st-pulled{border-left-color:var(--info)} .item.st-todo{border-left-color:var(--warn)} .item.st-bad{border-left-color:var(--bad)} .item.st-off{border-left-color:var(--line)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
nav.tabs button[aria-current="page"] .badge{background:var(--accent-ink);color:var(--accent)}
.next{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:10px 12px;font-weight:600}
.next .n{font-size:18px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dayhead b{font-size:14px} .dayhead span{color:var(--muted);font-size:12px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 2px;font-size:13px}
.linkbtn:hover{text-decoration:underline}
#modal .sheet.wide{max-width:980px}
table.rt td{vertical-align:middle}
table.rt td .row{gap:6px}
@media(max-width:640px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border-bottom:1px solid var(--line);padding:8px 10px}
  table.rt td{border:0!important;padding:1px 0;white-space:normal;display:flex;gap:10px;align-items:center;text-align:left!important;min-height:0}
  table.rt td[data-l]:not([data-l=""])::before{content:attr(data-l);color:var(--muted);font-size:12px;min-width:84px}
  table.rt td:empty{display:none}
  table.rt tr{border-bottom:1px solid var(--line)!important}
}
.safe{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:6px;border:1.5px solid}
.safe.besse{color:#8a3a17;background:#f7e4d9;border-color:#d9a58a} .safe.genoa{color:#0d5d57;background:#dcf1ee;border-color:#8cc9c1} .safe.other{color:#5b4a8a;background:#ebe6f7;border-color:#b7aadb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .safe.besse{color:#f3b597;background:#3a2419;border-color:#7a4a33}:root:not([data-theme="light"]) .safe.genoa{color:#8fdad0;background:#16302d;border-color:#2f6c65}}
:root[data-theme="dark"] .safe.besse{color:#f3b597;background:#3a2419;border-color:#7a4a33} :root[data-theme="dark"] .safe.genoa{color:#8fdad0;background:#16302d;border-color:#2f6c65}
.warnText{color:var(--warn);font-weight:600} .badText{color:var(--bad);font-weight:600}
.item.appt2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 14px}
.appt2 .al,.appt2 .ar{display:flex;flex-direction:column;gap:6px;min-width:0}
.appt2 .ar{align-items:flex-end;text-align:right}
.appt2 .r1,.appt2 .r2,.appt2 .r3,.appt2 .r4{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appt2 .ar .r1,.appt2 .ar .r2,.appt2 .ar .r3,.appt2 .ar .r4{justify-content:flex-end}
.appt2 .al .r1 .btn{margin-left:4px}
.appt2 .time{font-weight:800;font-size:15px} .appt2 .name{font-weight:800;font-size:15px}
.appt2 .sn{font-size:13px;font-weight:700;letter-spacing:.3px}
.appt2 .notebox{border:1px solid var(--line);border-radius:10px;padding:5px 7px;background:var(--bg);align-self:flex-start;max-width:100%}
.pill.start{background:#ece4fb;color:#5b3aa8;border-color:transparent}
:root[data-theme="dark"] .pill.start{background:#2f2645;color:#c7b3f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.start{background:#2f2645;color:#c7b3f5}}
.appt2 .ar .r4{margin-top:auto}
.appt2 .docrow{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.docrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
:root{--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926}
.vleg{display:flex;gap:14px;margin-bottom:8px;color:var(--muted)} .vleg .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.s1,.vbar.s1{background:var(--s1)} .sw.s2,.vbar.s2{background:var(--s2)}
.vbars{display:grid;gap:12px} .vrow2{display:grid;gap:2px} .vlab{font-size:13px}
.vtrack{display:flex;align-items:center;gap:6px;height:12px} .vbar{height:10px;border-radius:0 4px 4px 0;min-width:2px}
.vval{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums} .vgap{font-size:11.5px}
.vrow2:hover .vlab b{text-decoration:underline}
.appt2 .vrow{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.floor{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--info-soft)}
.floor .fl{display:inline-flex;gap:6px;align-items:center} .floor .name{font-weight:800}
.cocols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:6px}
@media (max-width:760px){.cocols{grid-template-columns:1fr}}
.coform .q{font-weight:700;font-size:13px;margin-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px} .opt{display:inline-flex;gap:6px;align-items:flex-start;font-size:13px;cursor:pointer}
.coout{position:sticky;top:0;align-self:start}
.ngbox{border:1px solid var(--line);border-left:5px solid var(--info);border-radius:10px;padding:10px 12px;background:var(--info-soft)}
.docrow .lab{font-weight:700;margin-right:2px}
.doc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);font-size:12px;line-height:1.5;color:var(--muted)}
button.doc{cursor:pointer} button.doc:hover{border-color:var(--accent)}
.doc.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.okText{color:var(--ok)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent} .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.flag{display:inline-flex;align-items:center;gap:2px;border-radius:8px;padding:2px 4px 2px 8px;font-weight:700;font-size:12px}
.flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.bad{background:var(--bad-soft);color:var(--bad)}
.x{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px;border-radius:6px;opacity:.7} .x:hover{opacity:1;background:rgba(0,0,0,.08)}
.note{display:inline-flex;align-items:center;gap:6px;background:var(--info-soft);color:var(--ink);border-radius:8px;padding:3px 4px 3px 9px;font-size:12.5px}
.note .nby{color:var(--muted);font-size:11px}
.addnote{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer} .addnote:hover{border-color:var(--accent);color:var(--accent)}
.noteIn{max-width:320px;min-height:32px;padding:5px 9px}
@media(max-width:520px){.item.appt2{grid-template-columns:1fr}.appt2 .ar{align-items:flex-start;text-align:left}.appt2 .ar .r1,.appt2 .ar .r2,.appt2 .ar .r3,.appt2 .ar .r4{justify-content:flex-start}}
.apptcount{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}
.item.appt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:stretch}
.item.appt .ar{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px}
.item.appt .ar .acts{margin-top:auto;padding-top:6px;justify-content:flex-end}
.item.appt .sn{font-size:13px;font-weight:600;margin-top:4px;letter-spacing:.3px}
.item.appt .meta{color:var(--muted);font-size:12.5px}
@media(max-width:520px){.item.appt{grid-template-columns:1fr}.item.appt .ar{align-items:flex-start;text-align:left}.item.appt .ar .acts{justify-content:flex-start}}
.bignum{font-size:34px;font-weight:800;line-height:1} .midnum{font-size:22px;font-weight:700;line-height:1}
.item.st-onhand{border-left-color:var(--line)} .item.st-check{border-left-color:var(--warn)}
.osec{border-left:5px solid;border-radius:10px;padding:8px 12px;margin-top:8px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
.subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.subnav button[aria-pressed="true"] .badge{background:var(--accent-ink);color:var(--accent)}
.badge.neutral{background:var(--muted)}
.dayblock{background:var(--surface2);border-radius:14px;padding:10px 12px;margin:10px 0}
.dayblock.today{background:var(--accent-soft)} .dayblock.due{background:var(--bad-soft)}
.dayblock .bh{display:flex;align-items:baseline;gap:8px;cursor:default;list-style:none}
details.dayblock>summary.bh{cursor:pointer} details.dayblock>summary::-webkit-details-marker{display:none}
details.dayblock>summary.bh::after{content:"▸";margin-left:auto;color:var(--muted)} details.dayblock[open]>summary.bh::after{content:"▾"}
.dayblock .bh span{color:var(--muted);font-size:12px}
.srow{background:var(--surface);border-radius:10px;padding:8px 10px;margin-top:8px}
.srow .name{font-weight:700} .srow .meta{color:var(--muted);font-size:12px;margin-left:6px} .srow .line{margin-top:4px}
.todaypill{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-weight:800;letter-spacing:.5px}
.asec{border-radius:12px;padding:10px 12px;margin-top:10px}
.asec.red{background:var(--bad-soft)} .asec.blue{background:var(--info-soft)} .asec.amber{background:var(--warn-soft)} .asec.gray{background:var(--surface2)}
.asec h3{margin:0 0 6px;color:inherit;text-transform:none;letter-spacing:0;font-size:14px}
.asec .srow{margin-top:6px}
.emailprev{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;color:#222;max-height:55vh;overflow:auto}
iframe.print{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:38px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
input.fld,select.fld,textarea.fld{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:38px}

label.lbl{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
.scan{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--radius);padding:10px}
.scan input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font-family:ui-monospace,Consolas,monospace;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.item.dim{opacity:.6}

.item .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

.item .name{font-weight:700}
.item .meta{color:var(--muted);font-size:12px}
.item .line{margin-top:6px;font-size:13px}
.item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}

.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.info{background:var(--info-soft);color:var(--info)}
.msg b{color:inherit}

<body>
<div id="app"></div>
<div id="modal" hidden role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="busy" hidden><div class="spin"></div><span id="busyText">Working…</span></div>
<script>
'use strict';
/* =====================================================================
   ESK Tracker — Excel add-in task pane
   Reads and writes the Esketamine Master Tracker workbook in place.
   - Finds tables by their headers (not by name or position).
   - Never writes into a formula cell.
   - Re-checks a row before writing; if someone changed it, it stops.
   ===================================================================== */

// ---------- small utils ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const isF = x => typeof x === 'string' && x.startsWith('=');
const blank = v => (v === '' || v === undefined) ? null : v;
const MS = 864e5;
const ymd = (y,m,d) => Math.round(Date.UTC(y, m-1, d) / MS) + 25569;
const todaySerial = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); };
const sDate = s => new Date((s - 25569) * MS);
const dowOf = s => sDate(s).getUTCDay();
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtD(s, mode){ if (s == null) return '—'; const d = sDate(s); const t = `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  return mode === 'dow' ? `${DOW[d.getUTCDay()]} ${t}` : mode === 'full' ? `${t}/${d.getUTCFullYear()}` : t; }
const isoOf = s => s == null ? '' : sDate(s).toISOString().slice(0,10);
function fromIso(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? ymd(+m[1], +m[2], +m[3]) : null; }
function fmtT(m){ if (m == null) return ''; let h = Math.floor(m/60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(mi).padStart(2,'0')} ${ap}`; }
function toSerial(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return (v > 1000 && v < 100000) ? Math.floor(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m){ let y = +m[3]; if (y < 100) y += 2000; return ymd(y, +m[1], +m[2]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return ymd(+m[1], +m[2], +m[3]);
  return null;
}
function toMinutes(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Math.round((v % 1) * 1440) % 1440;
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})\s*([AP]M)?/i); if (!m) return null;
  let h = +m[1]; if (m[3]){ if (/pm/i.test(m[3]) && h < 12) h += 12; if (/am/i.test(m[3]) && h === 12) h = 0; }
  return h*60 + +m[2];
}
const mrnKey = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return String(Math.round(v)); return String(v).trim().replace(/\.0+$/, ''); };
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const yes = v => /^(y|yes|true|x)$/i.test(String(v ?? '').trim());
const cleanScan = s => String(s ?? '').replace(/[\x00-\x1f\x7f]/g, '').trim();
const normScan = s => cleanScan(s).replace(/\s+/g, '').toUpperCase();
function pharmOf(v){ const s = String(v ?? '').toUpperCase(); if (s.includes('BESSE')) return 'BESSE'; if (s.includes('GENOA')) return 'GENOA'; return s.trim() ? 'OTHER' : ''; }
const PH_LABEL = { BESSE:'Besse', GENOA:'Genoa', OTHER:'Other', '':'—' };

// Spravato GS1 code — same layout the Inventory formulas use:
// 01 + GTIN(14) | 21 + serial(12) | 17 + YYMMDD | 10 + lot
function parseScan(raw){
  const s = cleanScan(raw).replace(/\s+/g, '');
  if (!/^01\d{14}21/.test(s) || s.length < 44) return null;
  const mg = s.startsWith('0100350458028034') ? 84 : s.startsWith('0100350458028027') ? 56 : null;
  const serial = s.slice(18, 30);
  const exp = s.slice(30, 32) === '17' ? ymd(2000 + +s.slice(32,34), +s.slice(34,36), +s.slice(36,38)) : null;
  const lot = /\d$/.test(s) ? s.slice(40, 47) : s.slice(40, 48);
  return { s, mg, serial, exp, lot };
}

// ---------- settings (this device only; no patient data) ----------
const DEF = { me:'', sup:'', pm:'', clinic:'SRL', email:'eskorders@mymhs.com', schedDays:30, genoaDays:14, theme:'', autoFull:false, genoaEmail:'', cc:'', sig:'', vitalsMin:40, disAfter:60 };
let CFG = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('eskCfg') || '{}')); } catch { return { ...DEF }; } })();
function saveCfg(){ try { localStorage.setItem('eskCfg', JSON.stringify(CFG)); } catch {} applyTheme(); }
function applyTheme(){ if (CFG.theme) document.documentElement.dataset.theme = CFG.theme; else delete document.documentElement.dataset.theme; }
applyTheme();

// ---------- table model ----------
class Tbl {
  constructor(key, name, sheet, headers, values, formulas){
    this.key = key; this.name = name; this.sheet = sheet;
    this.headers = headers.map(h => String(h ?? '')); this.values = values; this.formulas = formulas;
    this.cols = {}; this.headers.forEach((h,i) => { const n = norm(h); if (n && !(n in this.cols)) this.cols[n] = i; });
    this.formulaCol = this.headers.map((_, c) => { let f = 0, n = 0; for (const r of formulas){ const x = r[c]; if (x !== '' && x != null){ n++; if (isF(x)) f++; } } return n > 0 && f / n >= 0.5; });
  }
  get(r, k){ const c = this.cols[k]; return c == null ? null : blank(this.values[r]?.[c]); }
  isFormula(r, c){ return isF(this.formulas[r]?.[c]); }
  snap(r){ return this.headers.map((_, c) => this.isFormula(r, c) ? null : this.values[r][c]); }
}
const SIG = {
  patients: ['mrn','patientname','status','txfrequency','pharmacy'],
  kits:     ['scanhere','mrn','receivedmg','mgremaining','administeredmg'],
  appts:    ['mrn','patient','date','time','event','status'],
  audit:    ['scanhere','auditor2','date'],
  daily:    ['auditornamefirstandlast','scanhere','duplicateentry'],
};
const same = (a, b) => String(a ?? '').trim() === String(b ?? '').trim();
const snapMatch = (vals, snap) => snap.every((s, c) => s === null || same(vals[c], s));

function parseRef(values){
  const out = {}; let hr = values.findIndex(r => r.some(v => norm(v) === 'pharmacy') && r.some(v => norm(v) === 'dose'));
  if (hr < 0) return out;
  values[hr].forEach((h, c) => { const k = norm(h); if (!k) return; const list = []; for (let r = hr+1; r < values.length; r++){ const v = values[r][c]; if (v === '' || v == null) continue; list.push(v); } out[k] = list; });
  return out;
}
// Besse Order tab: the summary table (Clinic/Date/Dose/…/To Be Ordered) and the weekly history (DATE | 56 | 84)
function parseBesse(values, formulas){
  const out = { rows:{}, hist:null, vals:values };
  for (let r = 0; r < values.length; r++){
    const row = values[r].map(norm);
    const cOv = row.indexOf('approvedoverage');
    if (cOv >= 0 && out.hdr == null){
      out.hdr = r; const col = k => row.indexOf(k);
      out.c = { clinic:col('clinic'), date:col('date'), dose:col('dose'), oh:col('besseoh'), w1:col('apptsnextweek'), w2:col('appts2weekout'), ov:cOv, order:col('tobeordered') };
      for (let k = r+1; k < Math.min(values.length, r+6); k++){ const d = num(values[k][out.c.dose]); if (d === 56 || d === 84) out.rows[d] = { r:k, ov:num(values[k][cOv]), oh:num(values[k][out.c.oh]) }; }
    }
    for (let c = 0; c < row.length - 2; c++){
      if (row[c] === 'date' && num(values[r][c+1]) === 56 && num(values[r][c+2]) === 84 && !out.hist){ out.hist = { hdr:r, c }; }
    }
  }
  return out;
}
const colLetter = n => { let s = ''; n++; while (n){ const m = (n-1) % 26; s = String.fromCharCode(65+m) + s; n = Math.floor((n-1)/26); } return s; };

// ---------- store: live workbook (Office.js) ----------
function OfficeStore(){
  const names = {}; let besseSheet = null;
  const CH = 250; // rows per request — Excel on the web rejects very large single reads ("An internal error has occurred")
  const hasManual = (v, f) => v.some((x, c) => !isF(f[c]) && x !== '' && x != null);
  async function retry(fn){
    let err;
    for (let i = 0; i < 3; i++){ try { return await fn(); } catch (e){ err = e; if (e && e.code === 'InvalidArgument') break; await new Promise(r => setTimeout(r, 700 * (i + 1))); } }
    throw err;
  }
  // Read a table body in chunks; stops after 2 chunks with no hand-entered data (the prefilled blank rows at the bottom).
  async function readBody(ctx, t, opts = {}){
    const b = t.getDataBodyRange(); b.load('rowCount,columnCount'); await ctx.sync();
    const n = b.rowCount, cols = b.columnCount, values = [], formulas = [];
    let empty = 0;
    for (let s = 0; s < n; s += CH){
      const cnt = Math.min(CH, n - s);
      const r = b.getCell(s, 0).getResizedRange(cnt - 1, cols - 1); r.load('values,formulas'); await ctx.sync();
      let any = false;
      for (let i = 0; i < cnt; i++){ values.push(r.values[i]); formulas.push(r.formulas[i]); if (hasManual(r.values[i], r.formulas[i])) any = true; }
      if (opts.full) continue;
      empty = any ? 0 : empty + 1;
      if (empty >= 2) break;
    }
    return { b, values, formulas, rowCount:n, cols };
  }
  function rowRange(b, row, cols){ return b.getCell(row, 0).getResizedRange(0, cols - 1); }
  async function writeCells(ctx, b, row, fRow, changes){
    const cells = [];
    for (const [c, v] of changes){ if (isF(fRow[c])) throw new Error('Stopped: that column holds a formula in the workbook.'); const cell = b.getCell(row, c); cell.load('numberFormat'); cells.push([cell, v]); }
    await ctx.sync();
    for (const [cell, v] of cells){
      if (v && typeof v === 'object' && 'date' in v){ cell.values = [[v.date]]; if (/general/i.test(String(cell.numberFormat[0][0]))) cell.numberFormat = [['m/d/yyyy']]; }
      else cell.values = [[v]];
    }
    await ctx.sync();
  }
  return {
    live: true,
    async load(){
      return retry(() => Excel.run(async ctx => {
        const ts = ctx.workbook.tables; ts.load('items/name'); await ctx.sync();
        const hs = ts.items.map(t => { const h = t.getHeaderRowRange(); h.load('values'); const ws = t.worksheet; ws.load('name'); return { t, h, ws }; });
        await ctx.sync();
        const found = {};
        for (const x of hs){ const set = new Set(x.h.values[0].map(norm)); for (const [k, req] of Object.entries(SIG)) if (!found[k] && req.every(q => set.has(q))) found[k] = x; }
        const tables = {};
        for (const [k, x] of Object.entries(found)){
          names[k] = x.t.name;
          const d = await readBody(ctx, x.t);
          tables[k] = new Tbl(k, x.t.name, x.ws.name, x.h.values[0], d.values, d.formulas);
        }
        let dailyHdr = null;
        if (found.daily){ const hr = found.daily.ws.getRange('B2:C5'); hr.load('values,formulas'); await ctx.sync(); dailyHdr = { sheet: found.daily.ws.name, values: hr.values, formulas: hr.formulas }; }
        const wss = ctx.workbook.worksheets; wss.load('items/name'); await ctx.sync();
        const refWs = wss.items.find(w => w.name.trim().toUpperCase() === 'REF');
        const bo = wss.items.find(w => /besse/i.test(w.name) && /order/i.test(w.name));
        let rr = null, br = null;
        if (refWs){ rr = refWs.getUsedRange(true); rr.load('values'); }
        if (bo){ br = bo.getRange('A1:Z200'); br.load('values,formulas'); besseSheet = bo.name; }
        await ctx.sync();
        return { tables, ref: rr ? parseRef(rr.values) : {}, besse: br ? parseBesse(br.values, br.formulas) : null, besseSheet, dailyHdr };
      }));
    },
    async update(k, r, snap, changes){
      return Excel.run(async ctx => {
        const t = ctx.workbook.tables.getItem(names[k]);
        const b = t.getDataBodyRange(); b.load('rowCount,columnCount'); await ctx.sync();
        let row = -1, fRow = null;
        if (r < b.rowCount){ const rg = rowRange(b, r, b.columnCount); rg.load('values,formulas'); await ctx.sync(); if (snapMatch(rg.values[0], snap)){ row = r; fRow = rg.formulas[0]; } }
        if (row < 0){
          const d = await readBody(ctx, t, { full:true });
          row = d.values.findIndex(v => snapMatch(v, snap));
          if (row < 0) throw new Error('That row was changed in the workbook by someone else. The panel has refreshed — check it and try again.');
          fRow = d.formulas[row];
        }
        await writeCells(ctx, b, row, fRow, changes);
      });
    },
    async add(k, changes){
      return Excel.run(async ctx => {
        const t = ctx.workbook.tables.getItem(names[k]);
        let d = await readBody(ctx, t, { full:true });
        let last = -1;
        d.values.forEach((v, i) => { if (hasManual(v, d.formulas[i])) last = i; });
        let row = last + 1, b = d.b, fRow;
        if (row >= d.rowCount){
          t.rows.add(null); await ctx.sync();
          b = t.getDataBodyRange(); b.load('rowCount,columnCount'); await ctx.sync();
          row = b.rowCount - 1;
          const prev = rowRange(b, row - 1, b.columnCount); prev.load('formulasR1C1'); const cur = rowRange(b, row, b.columnCount); cur.load('formulasR1C1'); await ctx.sync();
          prev.formulasR1C1[0].forEach((f, c) => { const cf = cur.formulasR1C1[0][c]; if ((cf === '' || cf == null) && isF(f)) b.getCell(row, c).formulasR1C1 = [[f]]; });
          await ctx.sync();
          const nr = rowRange(b, row, b.columnCount); nr.load('formulas'); await ctx.sync(); fRow = nr.formulas[0];
        } else fRow = d.formulas[row];
        await writeCells(ctx, b, row, fRow, changes);
      });
    },
    // Clear hand-entered cells: cells = [[row, col, expectedValue]]. Stops if any cell changed or holds a formula.
    async clearCells(k, cells){
      return Excel.run(async ctx => {
        const b = ctx.workbook.tables.getItem(names[k]).getDataBodyRange();
        const rs = cells.map(([r, c]) => { const x = b.getCell(r, c); x.load('values,formulas'); return x; });
        await ctx.sync();
        rs.forEach((x, i) => { if (isF(x.formulas[0][0])) throw new Error('Stopped: that column holds a formula in the workbook.'); if (!same(x.values[0][0], cells[i][2])) throw new Error('The Daily Count tab changed since it was loaded. Refresh and try again.'); });
        rs.forEach(x => { x.values = [['']]; }); await ctx.sync();
      });
    },
    async setCells(sheet, cells){ // cells: [[a1, value, expectFormula=false]]
      return Excel.run(async ctx => {
        const ws = ctx.workbook.worksheets.getItem(sheet);
        const rs = cells.map(([a]) => { const r = ws.getRange(a); r.load('formulas,numberFormat'); return r; });
        await ctx.sync();
        rs.forEach((r, i) => { if (isF(r.formulas[0][0])) throw new Error(`Stopped: ${cells[i][0]} on "${sheet}" holds a formula.`); });
        rs.forEach((r, i) => { const v = cells[i][1]; if (v && typeof v === 'object' && 'date' in v){ r.values = [[v.date]]; if (/general/i.test(String(r.numberFormat[0][0]))) r.numberFormat = [['m/d/yyyy']]; } else r.values = [[v]]; });
        await ctx.sync();
      });
    },
    getDoc(key){ try { return Office.context.document.settings.get(key); } catch { return null; } },
    setDoc(key, val){ return new Promise(res => { try { Office.context.document.settings.set(key, val); Office.context.document.settings.saveAsync(() => res()); } catch { res(); } }); },
    watch(cb){
      Excel.run(async ctx => { for (const k in names){ ctx.workbook.tables.getItem(names[k]).onChanged.add(() => { cb(); return Promise.resolve(); }); } await ctx.sync(); }).catch(() => {});
    },
  };
}

// ---------- store: demo (fake data, same behavior as the workbook formulas) ----------
function DemoStore(){
  const T = todaySerial();
  const INV_H = ['Logging PCT','Scan Here','MRN','Pharmacy','Date Ordered','Date Received ','Expiration Date','Use By Date','Received (mg)','Serial Number','Lot Number','Administered (mg)','Date Administered','DOW','Partial?','Treating Technician','Supervising Physician ','Comments','Expired?','Marked for Disposal?','Date of Disposal','Disposal Method','mg Disposed','mg Remaining','Disposing PCT','Practice Manager'];
  const PT_H = ['MRN','Patient Name','Status','Rendering Provider','Auth Exp.','Tx Frequency','Tx Start Date','Protocol Exp Date','Order Status','# Doses On Hand','# Partial On Hand','Pharmacy ','Protocol mg','Last Treatment','Next Treatment','Scheduled Thru','Auth Start','Authorized Txs','Coverage Options','Insurance','PA Number','Last MADRS','Last WHO5','Scheduling Preferences ','Notes:','PCN Notes'];
  const AP_H = ['MRN','Patient','Date','Time','Event','Dose','Status','Lookup Key'];
  const INV_F = new Set([6,7,8,9,10,13,14,18,23]); const PT_F = new Set([9,10,13,14,15]); const AP_F = new Set([1,5,7]);
  const pts = [
    [900101,'ALDBEN','Active','BESSE',84,'1x per week',6,'Mon mornings'],[900102,'BROCAM','Active','GENOA',84,'1x per week',3,''],
    [900103,'CARDEL','Active','BESSE',84,'1x per 2 weeks',1,''],[900104,'DUNEMI','Pending Start','BESSE',56,'2x per week',0,'Tue/Thu'],
    [900105,'EVAFRA','Active','GENOA',84,'1x per 4 weeks',2,''],[900106,'FOXGIN','Active','BESSE',84,'1x per week',5,''],
    [900107,'GRAHAL','Active','GENOA',84,'1x per week',6,'Fri only'],[900108,'HOLIVY','Paused','BESSE',84,'1x per week',0,''],
    [900109,'IRWJAN','Active','BESSE',84,'1x per week',2,''],[900110,'JONKAI','Active','GENOA',84,'1x per 2 weeks',2,''],
    [900111,'KIMLEO','Discontinued','BESSE',84,'1x per week',0,''],[900112,'LOPMIA','Active','BESSE',84,'1x per week',0,''],
    [900113,'MOONED','Active','GENOA',56,'2x per week',3,''],
  ];
  const step = f => f.includes('2x') ? 3.5 : f.includes('2 weeks') ? 14 : f.includes('4 weeks') ? 28 : 7;
  const appts = []; const times = [9*60, 9*60+30, 10*60, 10*60+30, 13*60, 13*60+30, 14*60, 15*60];
  // find this week's Monday so demo "today" always has appointments on weekdays
  const base = dowOf(T) === 0 ? T+1 : dowOf(T) === 6 ? T+2 : T;
  pts.forEach((p, i) => {
    const [mrn, , st, , mg, freq, weeksAhead] = p;
    if (st === 'Discontinued') { appts.push([mrn, base-30, times[i%8], 'Esketamine Follow Up', 'Kept']); return; }
    const s = step(freq);
    for (let k = -3; k <= 12; k++){
      let d = Math.round(base + k*s); if (dowOf(d) === 0) d += 1; if (dowOf(d) === 6) d += 2;
      if (d < base - 21) continue;
      const isStart = st === 'Pending Start' && d >= base;
      if (d >= base && (d - base) > weeksAhead * 7) break;
      if (st === 'Paused' && d >= base) break;
      appts.push([mrn, d, times[(i + k + 8) % 8], isStart ? 'Esketamine Tx Start' : 'Esketamine Follow Up', d < base ? (k === -2 && i === 4 ? 'No Show' : 'Kept') : 'Expected']);
    }
  });
  const apVals = appts.sort((a,b) => a[1]-b[1] || a[2]-b[2]).map(([mrn,d,t,ev,st]) => {
    const p = pts.find(x => x[0] === mrn); const dose = /Start/.test(ev) ? 56 : p[4];
    return [mrn, p[1], d, t/1440, ev, dose, st, `${d}|${fmtT(t)}|${mrn}`];
  });
  // inventory
  let sn = 100000000000; const code = (mg, ser, exp) => { const d = sDate(exp); const yy = String(d.getUTCFullYear()).slice(2), mm = String(d.getUTCMonth()+1).padStart(2,'0'), dd = String(d.getUTCDate()).padStart(2,'0'); return `01${mg===84?'00350458028034':'00350458028027'}21${ser}17${yy}${mm}${dd}10AB12345`; };
  const inv = [];
  const addKit = o => { const r = Array(26).fill(''); r[0] = o.pct||'Taylor R.'; if (o.scan !== false){ r[1] = code(o.mg, String(++sn), o.exp); } r[2] = o.mrn ?? ''; r[3] = o.ph; r[4] = o.ordered ?? ''; r[5] = o.rec ?? ''; if (o.admin){ r[11] = o.admin; r[12] = o.adminDate; r[15] = 'Taylor R.'; r[16] = 'Dr. Aujla'; } r[17] = o.cmt ?? ''; if (o.disp){ r[19]='Yes'; r[20]=o.disp; r[21]='Blue Bin'; r[22]=o.mg; r[11]='Marked For Disposal'; r[24]='Taylor R.'; r[25]='Jordan P.'; } inv.push(r); };
  for (let i = 0; i < 20; i++) addKit({ mg:84, ph:'Besse', rec:T-40+i, exp:T+200, admin:84, adminDate:T-30+i, mrn:900101 });
  for (let i = 0; i < 13; i++) addKit({ mg:84, ph:'Besse', rec:T-20+i, exp:T+120+i });
  addKit({ mg:84, ph:'Besse', rec:T-90, exp:T-3 }); // expired, unused
  addKit({ mg:56, ph:'Besse', rec:T-10, exp:T+150 });
  addKit({ mg:84, ph:'Genoa', mrn:900102, rec:T-4, exp:T+300, cmt:'BROCAM' });
  addKit({ mg:84, ph:'Genoa', mrn:900107, rec:T-6, exp:T+300, cmt:'GRAHAL' });

// Upcoming Besse visits that no labeled kit covers — every one in the next 7 days, then each patient's next one within 14 —
// matched to unlabeled stock oldest-received first (never one that expires before the visit).
const ASSIGN_DAYS = 14;
function assignModel(){
  const T = todaySerial(), end = T + ASSIGN_DAYS;
  const appts = S.A.filter(a => { if (!a.active || a.date < T || a.date > end) return false; const inf = apptInfo(a); return inf.pharm === 'BESSE' && inf.mg && !S.K.some(k => k.mrn === a.mrn && k.administered && k.adminDate === a.date); })
    .sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));
  const labeled = new Map();
  for (const k of S.K) if (besseOwner(k) && k.available){ const key = k.mrn + '|' + k.recv; labeled.set(key, (labeled.get(key) || 0) + 1); }
  const pool = S.K.filter(k => k.pharm === 'BESSE' && !k.mrn && k.available).sort(fifo);
  const rows = [];
  for (const a of appts){
    const mg = apptInfo(a).mg; const key = a.mrn + '|' + mg;
    if ((labeled.get(key) || 0) > 0){ labeled.set(key, labeled.get(key) - 1); continue; }
    if (a.date > T + 7 && rows.some(r => r.mrn === a.mrn)) continue; // past the first week, only each patient's next uncovered visit
    const i = pool.findIndex(k => k.recv === mg && (k.expDate == null || k.expDate >= a.date));
    rows.push({ a, mrn: a.mrn, mg, kit: i >= 0 ? pool.splice(i, 1)[0] : null });
  }
  return rows;
}

// ---------- ordering ----------
function weeksFor(od){ const d = dowOf(od); let add = (1 - d + 7) % 7; if (add === 0) add = 7; const m = od + add; return [[m, m+4], [m+7, m+11]]; }
function besseModel(){
  const w = weeksFor(S.orderDate); const rows = { 56:{ w1:0, w2:0 }, 84:{ w1:0, w2:0 } }; const list = [], review = [];
  for (const a of S.A){
    if (!a.active || a.date < w[0][0] || a.date > w[1][1]) continue;
    const wk = a.date <= w[0][1] ? 1 : a.date >= w[1][0] ? 2 : 0; if (!wk) continue;
    const inf = apptInfo(a);
    if (inf.pharm !== 'BESSE'){ if (!inf.pharm) review.push({ a, why:'Not on the patient tracker — pharmacy unknown' }); continue; }
    if (inf.mg !== 56 && inf.mg !== 84){ review.push({ a, why:`Dose ${inf.mg ?? 'unknown'}` }); continue; }
    rows[inf.mg]['w' + wk]++; list.push({ a, wk, mg: inf.mg, verify: inf.mg === 56 && !a.isStart });
  }
  const besseKits = S.K.filter(k => k.pharm === 'BESSE' && k.full);
  for (const mg of [56, 84]){
    const r = rows[mg]; r.oh = besseKits.filter(k => k.recv === mg && !k.expired).length;
    r.expiredFull = besseKits.filter(k => k.recv === mg && k.expired).length;
    r.expSoon = besseKits.filter(k => k.recv === mg && !k.expired && k.expDate != null && k.expDate <= w[1][1]).length;
    const sheetOv = S.besse?.rows?.[mg]?.ov; r.sheetOv = sheetOv; r.ov = S.ov[mg] ?? sheetOv ?? (mg === 56 ? 1 : -2);
    r.order = Math.max(0, r.w1 + r.w2 - r.oh + r.ov);
  }
  return { w, rows, list: list.sort((a, b) => a.a.date - b.a.date || (a.a.time ?? 0) - (b.a.time ?? 0)), review };
}
const PS = ph => ph === 'GENOA' || ph === 'OTHER'; // patient-specific pharmacies
function defaultWindow(){ const T = todaySerial(); const d = dowOf(T); let add = (1 - d + 7) % 7; if (add === 0) add = 7; return { from: T, to: T + add + 4 }; } // today → Friday of next week
function genoaModel(from, to){
  const T = todaySerial(); from = from ?? S.win.from; to = to ?? S.win.to;
  const appts = S.A.filter(a => a.active && a.date >= Math.max(from, T) && a.date <= to && PS(apptInfo(a).pharm)).sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));
  const onhand = new Map(), open = new Map();
  for (const k of S.K){ if (!k.mrn || k.pharm === 'BESSE') continue;
    if (k.available){ if (!onhand.has(k.mrn)) onhand.set(k.mrn, []); onhand.get(k.mrn).push(k); }
    if (k.openOrder){ if (!open.has(k.mrn)) open.set(k.mrn, []); open.get(k.mrn).push(k); } }

function followModel(){
  const T = todaySerial(); const out = [];
  const byMrn = new Map();
  for (const k of S.K) if (k.openOrder){
    if (!k.mrn){ const fus = String(k.comments ?? '').split('|').map(x => x.trim()).filter(x => /^F\/U/i.test(x)); const waited = k.ordered != null ? T - k.ordered : null; out.push({ k, next: null, need: null, waited, st: `${PH_LABEL[k.pharm] || ''} stock order`, cls: waited >= 7 ? 'warn' : 'info', fu: fus[fus.length - 1] || '', onhand: S.K.filter(x => x.pharm === k.pharm && x.available && !x.mrn).length, stale: null, stock: true }); continue; }
    if (!byMrn.has(k.mrn)) byMrn.set(k.mrn, []); byMrn.get(k.mrn).push(k); }
  for (const [mrn, orders] of byMrn){
    orders.sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0) || a.r - b.r);
    const appts = S.A.filter(a => a.mrn === mrn && a.active && a.date >= T).sort((a, b) => a.date - b.date || (a.time ?? 0) - (b.time ?? 0));
    const onhand = S.K.filter(k => k.mrn === mrn && k.available && k.pharm !== 'BESSE').sort(fifo);
    const oh = onhand.slice(); const uncovered = [];
    for (const a of appts){ const i = oh.findIndex(k => k.expDate == null || k.expDate >= a.date); if (i >= 0) oh.splice(i, 1); else uncovered.push(a); }
    orders.forEach((k, idx) => {
      const next = uncovered[idx] || null; const need = next?.date ?? null; const waited = k.ordered != null ? T - k.ordered : null;
      const recvAfter = k.ordered != null ? S.K.filter(x => x.mrn === mrn && x.isReceived && x.received != null && x.received >= k.ordered && x.pharm !== 'BESSE') : [];
      let st, cls;
      if (need == null){ st = onhand.length ? 'Covered — kit on hand' : 'No upcoming appointment'; cls = onhand.length ? 'ok' : ''; }
      else if (need === T){ st = 'Needed today'; cls = 'bad'; }
      else if (need - T === 1){ st = 'Needed tomorrow'; cls = 'bad'; }
      else if (need - T <= 3){ st = `Needed in ${need - T} days`; cls = 'warn'; }
      else { st = `Needed ${fmtD(need, 'dow')}`; cls = 'info'; }
      const fus = String(k.comments ?? '').split('|').map(x => x.trim()).filter(x => /^F\/U/i.test(x));
      out.push({ k, next, need, waited, st, cls, fu: fus[fus.length - 1] || '', onhand: onhand.length, stale: recvAfter.length ? recvAfter[recvAfter.length - 1] : null });
    });
  }
  return out.sort((a, b) => (a.need ?? 1e9) - (b.need ?? 1e9) || (a.k.ordered ?? 0) - (b.k.ordered ?? 0));
}

// Genoa: no patient label step (the R number changes every fill). Scan kits in the order shown under

const lineMg = k => num(String(k.comments ?? '').match(/(\d+)\s*mg/i)?.[1]) || (k.mrn ? S.byMrn.get(k.mrn)?.mg : null) || null;
function recvQueue(){
  const genoa = S.recvPharm === 'Genoa';
  const L = S.K.filter(k => k.openOrder && (genoa ? k.pharm !== 'BESSE' : k.pharm === 'BESSE')).sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0) || a.r - b.r);
  const i = S.rcvFirst ? L.findIndex(k => k.id === S.rcvFirst) : -1;
  return i > 0 ? [L[i], ...L.slice(0, i), ...L.slice(i + 1)] : L;
}

      ${genoa ? (up ? `<span>Next up: <b>${esc(up.mrn ? nm(up.mrn) : 'Genoa stock')}</b>${lineMg(up) ? ` · ${lineMg(up)} mg` : ''}</span>` : '<span class="muted">Nothing awaiting receipt — any scan is set aside for you to assign a patient.</span>')
        : '<span class="muted">Each scan fills the oldest open Besse order line for that dose, or starts a new Inventory line. New kits are unlabeled stock until assigned.</span>'}</div>

    ${log.length ? `<div class="tw" style="margin-top:10px"><table class="t rt"><thead><tr><th>Received this session · check against the box</th><th>Dose</th><th>Serial</th><th>Lot</th><th>Use by</th><th>Row</th></tr></thead><tbody>${log.slice().reverse().map(x => { const k = S.K.find(y => y.id === x.id); return `<tr${x.warn ? ' style="background:var(--warnbg,#fff6e0)"' : ''}><td data-l="Patient"><b>${esc(x.who)}</b>${x.warn ? ` <span class="chip warn">${esc(x.warn)}</span>` : ''}</td><td data-l="Dose">${x.mg} mg</td><td data-l="Serial" class="mono">${esc(x.serial)}</td><td data-l="Lot" class="mono">${esc(k?.lot ?? '')}</td><td data-l="Use by">${k ? fmtD(k.useBy ?? k.expDate) : ''}</td><td data-l="Row">${k ? k.r + 3 : ''}</td></tr>`; }).join('')}</tbody></table></div>` : ''}
    ${datalist('dlPts', S.P.filter(p => p.pharm !== 'BESSE').map(p => `${p.name} · ${p.mrn}`))}
  </div>

function rcvLogAdd(x){ (S.rcvLog = S.rcvLog || []).push({ ...x, ph: S.recvPharm }); if (S.rcvLog.length > 60) S.rcvLog.shift(); }
async function recvScan(raw){
  const scan = cleanScan(raw); const p = parseScan(scan); const T = todaySerial();
  if (!p) return setMsg('recvMsg', 'bad', 'That doesn’t read as a Spravato barcode. Scan the 2D code on the kit.');
  if (!p.mg) return setMsg('recvMsg', 'warn', `Serial ${esc(p.serial)} isn’t a known 56 mg or 84 mg Spravato product. Check the kit.`);
  const sn = normScan(p.serial);
  const dup = S.K.find(k => k.serialN === sn) || (S.rcvHold || []).find(h => normScan(h.serial) === sn);
  if (dup) return setMsg('recvMsg', 'bad', `Serial ${esc(p.serial)} was already scanned${dup.r != null ? ` (row ${dup.r + 3}${dup.mrn ? ', ' + esc(nm(dup.mrn)) : ''})` : ''}.`);
  const me = CFG.me; if (!me) { openSettings(); return setMsg('recvMsg', 'warn', 'Add your name in Settings first — it goes in Logging PCT.'); }
  if (S.recvPharm === 'Genoa'){
    const L = recvQueue();
    const fits = k => { const m = lineMg(k); return !m || m === p.mg; };
    const line = L.find(fits);
    if (!line){ (S.rcvHold = S.rcvHold || []).push({ scan, mg: p.mg, serial: p.serial }); S.recvMsg = { kind:'warn', html:`${p.mg} mg · ${esc(p.serial)} isn’t awaiting receipt — set aside below. Keep scanning.` }; render(); return; }
    const skipped = L.indexOf(line) > 0 ? L[0] : null;
    const obj = { scanhere: scan, datereceived: { date: T } }; if (!line.pct) obj.loggingpct = me; if (!line.pharmRaw) obj.pharmacy = pharmText(line.mrn ? (S.byMrn.get(line.mrn)?.pharm || 'GENOA') : 'GENOA');
    const { out } = changesFor('kits', obj); const who = line.mrn ? nm(line.mrn) : 'Genoa stock';
    if (await write(null, () => S.store.update('kits', line.r, S.tables.kits.snap(line.r), out))){
      if (S.rcvFirst === line.id) S.rcvFirst = null;
      const warn = skipped ? `${p.mg} mg — skipped ${skipped.mrn ? nm(skipped.mrn) : 'stock'} (${lineMg(skipped)} mg)` : '';
      rcvLogAdd({ id: 'S:' + sn, who, mg: p.mg, serial: p.serial, warn });
      S.recvMsg = { kind: skipped ? 'warn' : 'ok', html: `Received ${p.mg} mg for <b>${esc(who)}</b>.${skipped ? ` The next line (${esc(skipped.mrn ? nm(skipped.mrn) : 'stock')}) expects ${lineMg(skipped)} mg, so this went to the next ${p.mg} mg line — check the bag.` : ''}` };
      render();
    }
    return;
  }
  const opens = S.K.filter(k => k.openOrder && k.pharm === 'BESSE' && !k.mrn).sort((a, b) => (a.ordered ?? 0) - (b.ordered ?? 0));

async function saveBesse(){
  const b = S.besse; const m = besseModel(); const cells = []; let histNote = '';
  if (b && b.hdr != null){
    const c = b.c; const A = (r, col) => colLetter(col) + (r + 1);
    if (c.date >= 0 && b.rows[56]) cells.push([A(b.rows[56].r, c.date), { date: S.orderDate }]);
    for (const mg of [56, 84]){ const rr = b.rows[mg]; if (!rr) continue; const r = m.rows[mg];
      if (c.w1 >= 0) cells.push([A(rr.r, c.w1), r.w1]); if (c.w2 >= 0) cells.push([A(rr.r, c.w2), r.w2]); if (c.ov >= 0) cells.push([A(rr.r, c.ov), r.ov]); }
    if (b.hist){ const hr = findHistRow(); if (hr != null){ cells.push([colLetter(b.hist.c + 1) + (hr.r + 1), m.rows[56].order], [colLetter(b.hist.c + 2) + (hr.r + 1), m.rows[84].order]); histNote = `, logged ${m.rows[56].order} × 56 / ${m.rows[84].order} × 84 for the week of ${fmtD(hr.d)}`; } }
  }
  const lines = [];
  if (S.logLines !== false) for (const mg of [56, 84]) for (let n = 0; n < m.rows[mg].order; n++) lines.push(changesFor('kits', { loggingpct: CFG.me, pharmacy: pharmText('BESSE'), dateordered: { date: S.orderDate }, comments: `Besse ${mg} mg order` }).out);
  if (lines.length && !CFG.me) return openSettings();
  if (!cells.length && !lines.length) return toast('info', 'Nothing to record.');
  await write('Recording order…', async () => { if (cells.length) await S.store.setCells(S.besseSheet, cells); for (const l of lines) await S.store.add('kits', l); },
    `Order recorded${cells.length ? ' on the Besse Order tab' : ''}${histNote}${lines.length ? `; ${lines.length} kit${lines.length > 1 ? 's' : ''} now in transit` : ''}.`);
}

function findHistRow(){ // the history's DATE column holds one row per order week: use this date, or the next one within 6 days
  const b = S.besse; if (!b?.hist) return null; const vals = b.vals || []; let best = null;
  for (let r = b.hist.hdr + 1; r < vals.length; r++){ const d = toSerial(vals[r][b.hist.c]); if (d == null) continue; const diff = d - S.orderDate; if (diff >= 0 && diff <= 6 && (best == null || diff < best.diff)) best = { r, d, diff }; }
  return best;
}

function auditState(){ const d = isoOf(todaySerial()); if (!S.aud || S.aud.date !== d) S.aud = { date: d, a1: CFG.me || '', a2: '', scans: [], filled: false }; return S.aud; }
// Keep this session's audit as the source of truth; pull in scans another computer added for the same day.
function mergeAud(mine, saved){
  if (!saved) return mine; if (!mine || mine.date !== saved.date) return (!mine || saved.date > mine.date) ? JSON.parse(JSON.stringify(saved)) : mine;
  const key = x => `${x.at}|${x.raw}`; const have = new Map(mine.scans.map(x => [key(x), x]));
  for (const x of saved.scans || []){ const m = have.get(key(x)); if (m){ if (x.sheet) m.sheet = true; } else if (!(mine.removed || []).includes(key(x))) mine.scans.push({ ...x }); }
  mine.scans.sort((p, q) => p.at - q.at); mine.a1 = mine.a1 || saved.a1; mine.a2 = mine.a2 || saved.a2; mine.filled = mine.filled || saved.filled; return mine;
}

// Receiving scans wait their turn here so the scanner never has to pause for the workbook.
async function runScanQ(){
  if (S.scanBusy) return;
  while (S.scanQ.length){ const x = S.scanQ.shift(); S.scanBusy = x.k; try { if (x.k === 'recv') await recvScan(x.v); else if (x.k === 'aud') await writeAuditScan(x.sc); } catch (e){ console.error(e); toast('bad', esc(e.message || String(e))); } }
  S.scanBusy = null; if (S._dailyDirty){ S._dailyDirty = false; await reload(true); } render();
}
function auditModel(){
  const A = auditState(); const seen = new Set();
  const rows = A.scans.map((sc, i) => {
    const { p, list } = findByScan(sc.raw); const k = list.find(x => !x.disposed) || list[0] || null; const key = p?.serial || normScan(sc.raw);
    const dup = seen.has(key); seen.add(key); let st, cls;
    if (dup){ st = 'Duplicate scan'; cls = 'warn'; }
    else if (!k){ st = p ? 'Not in inventory' : 'Not a Spravato code'; cls = 'bad'; }
    else if (k.disposed){ st = 'Marked disposed'; cls = 'bad'; }
    else if (k.administered && !k.partialOpen){ st = 'Already administered'; cls = 'bad'; }
    else if (k.expired){ st = 'Expired — dispose'; cls = 'warn'; }
    else if (k.partialOpen){ st = `Partial · ${k.remaining} mg left`; cls = 'warn'; }
    else { st = 'OK'; cls = 'ok'; }
    return { i, sc, p, k, st, cls, dup };
  });
  const scanned = new Set(rows.filter(r => r.k && !r.dup).map(r => r.k.id));
  const expected = S.K.filter(k => k.isReceived && !k.disposed && (!k.administered || k.partialOpen));
  const missing = expected.filter(k => !scanned.has(k.id)).sort((a, b) => (a.pharm || '').localeCompare(b.pharm || '') || fifo(a, b));
  const gk = k => `${PH_LABEL[k.pharm]} ${k.recv ?? '?'} mg`; const groups = {};
  for (const k of expected){ const g = groups[gk(k)] || (groups[gk(k)] = { exp: 0, ok: 0 }); g.exp++; if (scanned.has(k.id)) g.ok++; }
  const flags = rows.filter(r => r.cls !== 'ok').length + missing.length;
  return { A, rows, missing, expected, groups, flags };
}

// Daily audit printout — same layout as the workbook's Daily Count sheet (landscape, one page), detail on page 2.
function auditDoc(){
  const m = auditModel(); const A = m.A; const T = fromIso(A.date) ?? todaySerial();
  const PH = [['BESSE', 'Besse'], ['GENOA', 'Genoa'], ['OTHER', 'Other Specialty']]; const DOSES = [56, 84];
  const valid = m.rows.filter(r => r.k && !r.dup && !r.k.disposed && (!r.k.administered || r.k.partialOpen));
  const onHand = (mg, ph) => valid.filter(r => r.k.recv === mg && (!ph || r.k.pharm === ph)).length;
  const usedK = S.K.filter(k => k.administered && k.adminDate === T);
  const used = (mg, ph) => usedK.filter(k => k.recv === mg && (!ph || k.pharm === ph)).length;
  const dup = mg => m.rows.some(r => r.dup && (r.k?.recv ?? r.p?.mg) === mg) ? 'Yes' : 'No';
  const dispK = S.K.filter(k => k.dispDate === T);
  const appl = k => Math.round((k.mgDisp > 0 ? k.mgDisp : (k.remaining ?? k.recv ?? 0)) / 28); // one nasal device = 28 mg
  const disp = ph => dispK.filter(k => k.pharm === ph).reduce((n, k) => n + appl(k), 0);
  const sum = (f, ph) => DOSES.reduce((n, d) => n + f(d, ph), 0);
  const block = (h2, h3, h4, c2, c3, c4, extra) => `<table class="b"><colgroup><col style="width:18%"><col style="width:25%"><col style="width:33%"><col style="width:24%"></colgroup><tr class="h"><th>Dose</th><th>${h2}</th><th>${h3}</th><th>${h4}</th></tr>
    ${DOSES.map((d, i) => `<tr class="${i % 2 ? 'odd' : 'ev'}"><td>${d}</td><td>${c2(d)}</td><td>${c3(d)}</td><td class="${extra ? 'l' : 'r'}">${c4(d)}</td></tr>`).join('')}
    <tr class="t"><td>Total</td><td>${c2()}</td><td>${c3()}</td><td class="${extra ? 'l' : 'r'}">${extra ? '' : c4()}</td></tr></table>`;
  const tot = f => d => d == null ? sum(f) : f(d);
  const totP = (f, ph) => d => d == null ? sum(f, ph) : f(d, ph);
  const pt = k => k?.mrn ? esc(nm(k.mrn)) + ' · ' + esc(k.mrn) : k ? 'Stock' : '—';
  const dt = (head, rows) => `<table class="d"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Daily Audit ${fmtD(T, 'full')}</title><style>
    @page{size:letter landscape;margin:0.35in 0.3in}
    *{box-sizing:border-box} body{margin:0;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:10pt;color:#000}
    .logo{height:86px;margin:6px 0 18px 46px}
    .frame{border:2px solid #000;padding:0 0 4px}
    .hdr{display:grid;grid-template-columns:205px 1fr 150px 230px;row-gap:1px;padding:6px 8px 14px;font-size:10pt}
    .hdr b{text-align:right;padding-right:10px;white-space:nowrap} .hdr .sg{text-align:right}
    table.b{width:100%;border-collapse:collapse;margin-bottom:14px} table.b th{background:#4472c4;color:#fff;font-weight:700;padding:2px 6px;text-align:center}
    table.b td{text-align:center;padding:1px 6px} table.b tr.ev td{background:#d9e1f2} table.b tr.odd td{background:#fff}
    table.b td.r{text-align:right} table.b td.l{text-align:left} table.b tr.t td{font-weight:700;border-top:1px solid #4472c4;border-bottom:2px solid #4472c4}
    .foot{display:grid;grid-template-columns:43% 1fr;gap:6px;align-items:start}
    .foot table.b{margin:0} .att{font-weight:700;font-size:10pt;line-height:1.45;padding-top:8px}
    .p2{page-break-before:always;break-before:page} .p2 h2{font-size:13pt;margin:0 0 6px} .p2 h3{font-size:11pt;margin:12px 0 4px}
    table.d{width:100%;border-collapse:collapse;font-size:9pt} table.d th,table.d td{border:1px solid #999;padding:2px 5px;text-align:left} table.d th{background:#d9e1f2}
  </style></head><body>
    <img class="logo" src="${LOGO_URI}" alt="Mindful Health Solutions">
    <div class="frame">
      <div class="hdr"><b>Auditor 1 Name (First and Last)</b><span>${esc(A.a1 || '')}</span><b class="sg">Auditor 1 Signature</b><span></span>
        <b>Auditor 2 Name (First and Last)</b><span>${esc(A.a2 || '')}</span><b class="sg">Auditor 2 Signature</b><span></span>
        <b>Date</b><span>${fmtD(T, 'full')}</span><span></span><span></span>
        <b>Location</b><span>${esc(locName())}</span><span></span><span></span></div>
      ${block('Total Medications Used', 'Total Medications on hand', 'Duplicate Scans?', tot(d => used(d)), tot(d => onHand(d)), d => d == null ? '' : dup(d), true)}
      ${block('Besse used', 'Genoa used', 'Other Specialty used', totP(used, 'BESSE'), totP(used, 'GENOA'), totP(used, 'OTHER'))}
      ${block('Besse on hand', 'Genoa on hand', 'Other Specialty on hand', totP(onHand, 'BESSE'), totP(onHand, 'GENOA'), totP(onHand, 'OTHER'))}
      <div class="foot"><table class="b"><tr class="h"><th>Pharmacy/Drug Source</th><th>Applicators Disposed/Returned</th></tr>

// ---------- Daily Count tab (Table35 + header cells C2:C5) ----------
// Each audit scan is written to the next row of the Daily Count scan table (Auditor Name + Scan Here; the rest are formulas).
// Header: C2 Auditor 1, C3 Auditor 2, C4 Date, C5 Location — written only where the label in column B matches and the cell isn't a formula.
const DH_KEYS = [['a1', /auditor\s*1/i], ['a2', /auditor\s*2/i], ['date', /^\s*date\s*$/i], ['loc', /location/i]];
function dailyRows(){ const t = S.tables.daily; if (!t) return []; const c = t.cols.scanhere; const out = []; t.values.forEach((v, r) => { const sc = String(v[c] ?? '').trim(); if (sc && !t.isFormula(r, c)) out.push({ r, scan: sc, name: String(v[t.cols.auditornamefirstandlast] ?? '').trim() }); }); return out; }
function dailyHeaderCells(){
  const h = S.dailyHdr; if (!h) return []; const A = auditState(); const T = todaySerial();
  const want = { a1: A.a1 || '', a2: A.a2 || '', date: { date: T }, loc: locName() }; const out = [];
  DH_KEYS.forEach(([k, re], i) => { const lab = String(h.values?.[i]?.[0] ?? ''); const f = h.formulas?.[i]?.[1]; if (!re.test(lab) || isF(f)) return;
    const cur = h.values[i][1]; const v = want[k]; const same2 = typeof v === 'object' ? toSerial(cur) === v.date : String(cur ?? '').trim() === String(v).trim(); if (!same2) out.push([`C${i + 2}`, v]); });
  return out;
}
async function writeDailyHeader(){ const cells = dailyHeaderCells(); if (!cells.length || !S.dailyHdr) return; try { await S.store.setCells(S.dailyHdr.sheet, cells); cells.forEach(([a, v]) => { const i = +a.slice(1) - 2; S.dailyHdr.values[i][1] = typeof v === 'object' ? v.date : v; }); } catch (e){ toast('bad', esc(e.message || String(e))); } }
// Before the first write of a new day: if the scan table still holds an earlier count, ask before clearing it.
function ensureDailyDay(){
  const today = isoOf(todaySerial()); if (!S.tables.daily || S.dailyDay === today) return Promise.resolve(true);
  const old = dailyRows();
  const begin = async clear => { if (clear && old.length){ await S.store.clearCells('daily', old.flatMap(x => [[x.r, S.tables.daily.cols.scanhere, x.scan], ...(x.name ? [[x.r, S.tables.daily.cols.auditornamefirstandlast, x.name]] : [])])); } S.dailyDay = today; await S.store.setDoc('eskDailyDay', today); if (clear && old.length) await reload(true); await writeDailyHeader(); return true; };
  if (!old.length) return begin(false);
  const at = S.tables.audit; let onSN = 0;
  if (at){ const keys = new Set(); at.values.forEach((_, r) => { const sc = at.get(r, 'scanhere'); if (sc) keys.add(normScan(parseScan(cleanScan(sc))?.serial || sc)); }); onSN = old.filter(x => keys.has(normScan(parseScan(cleanScan(x.scan))?.serial || x.scan))).length; }
  const hd = S.dailyHdr ? toSerial(S.dailyHdr.values?.[2]?.[1]) : null;
  return new Promise(res => {
    S.dayRes = res;
    openModal(`<h2>Start today’s Daily Count?</h2>
      <div>The Daily Count tab still has <b>${old.length}</b> scan${old.length === 1 ? '' : 's'} from an earlier count${hd ? ` (dated ${fmtD(hd, 'full')})` : ''}.</div>
      ${at ? (onSN === old.length ? `<div class="msg ok" style="margin-top:8px">All of them are already on the SN Audit tab.</div>` : `<div class="msg warn" style="margin-top:8px"><b>${old.length - onSN} of them aren’t on the SN Audit tab yet.</b> Fill them there first if they still need to be recorded.</div>`) : ''}
      <div class="small muted" style="margin-top:8px">Clearing empties only the Auditor Name and Scan Here cells; the formula columns are left alone.</div>
      <div class="row" style="margin-top:12px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-act="dayCancel">Not now</button><button class="btn" data-act="dayKeep">Keep them, add today’s below</button><button class="btn primary" data-act="dayClear">Clear and start today</button></div>`);
  });
}
async function dayChoice(kind){
  const res = S.dayRes; S.dayRes = null; closeModal(); if (!res) return;
  if (kind === 'cancel'){ res(false); toast('warn', 'Scans are kept in the add-in only. Use “Send to Daily Count” when ready.'); render(); return; }
  try { busy('Updating the Daily Count tab…'); const today = isoOf(todaySerial()); const old = dailyRows();

    return `<div><label class="lbl" for="e${c}">${esc(h.trim())}</label><input id="e${c}" class="fld" data-ec="${c}" data-kind="${kind}" ${opts.length ? `list="${lid}"` : ''} value="${esc(v ?? '')}"></div>`;
  }).join('');
  return `<div class="small muted">Fields marked <b>auto</b> are formulas and are never written.</div><div class="form2">${fields}</div>${dl}`;
}
async function saveRow(tkey, r){
  const t = S.tables[tkey]; const out = [];
  document.querySelectorAll('[data-ec]').forEach(el => {
    const c = +el.dataset.ec; const old = t.values[r][c]; let v = el.value;
    if (el.dataset.kind === 'date'){ const s = fromIso(v); const o = toSerial(old); if (s === o) return; out.push([c, s == null ? '' : { date: s }]); return; }
    if (String(old ?? '') === v) return;
    if (el.dataset.kind === 'num' && /^-?\d+(\.\d+)?$/.test(v.trim())) v = Number(v); else if (/^-?\d+(\.\d+)?$/.test(String(v).trim()) && REFMAP[norm(t.headers[c])] === 'dose') v = Number(v);
    out.push([c, v]);
  });
  if (!out.length){ toast('info', 'No changes.'); return; }
  if (await write('Saving…', () => S.store.update(tkey, r, t.snap(r), out), `Saved ${out.length} field${out.length > 1 ? 's' : ''}.`)) closeModal();
}

async function copyText(text, html){
  try { if (html && window.ClipboardItem && navigator.clipboard?.write){ await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type:'text/html' }), 'text/plain': new Blob([text], { type:'text/plain' }) })]); return true; } } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const d = document.createElement('div'); d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-9999px;top:0'; d.innerHTML = html || esc(text).replace(/\n/g, '<br>'); document.body.appendChild(d);
  const rg = document.createRange(); rg.selectNodeContents(d); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); let ok = false; try { ok = document.execCommand('copy'); } catch {} sel.removeAllRanges(); d.remove(); return ok;
}

document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'button') return;
  const f = ACT[el.dataset.act]; if (f){ e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.target.dataset?.note != null){ if (e.key === 'Escape'){ S.noteFor = null; render(); return; } if (e.key === 'Enter'){ e.preventDefault(); const t = e.target.value.trim(); const m = e.target.dataset.note; S.noteFor = null; if (t){ S.notes = S.notes || {}; (S.notes[m] = S.notes[m] || []).push({ t, by: CFG.me || '', at: isoOf(todaySerial()) }); saveNotes(); } render(); return; } }
  // A scanner types like a keyboard. If focus wandered off (a click on a button), send the keystrokes to the page's scan box.
  if (!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') && $('#modal').hidden && !e.ctrlKey && !e.metaKey && !e.altKey){
    const el = document.querySelector('[data-scan]:not([disabled])');
    if (el && (e.key === '/' || (e.key.length === 1 && ['recv','audit'].includes(el.dataset.scan)))){ el.focus(); if (e.key === '/'){ e.preventDefault(); } return; }
  }
  if (e.key === 'Escape' && !$('#modal').hidden){ closeModal(); return; }
  const el = e.target; if (e.key !== 'Enter' || !el.dataset?.scan) return;
  e.preventDefault(); const v = el.value; el.value = ''; if (!cleanScan(v)) return;
  const k = el.dataset.scan;
  if (k === 'today') todayScan(v);
  else if (k === 'recv'){ S.scanQ.push({ k, v }); runScanQ(); render(); }

// ---------- timers: refresh countdowns every 20 s; toast once when something comes due ----------
setInterval(() => {
  const now = nowMin();
  document.querySelectorAll('[data-due]').forEach(el => { if (el.dataset.today !== '1') return; const at = +el.dataset.due; const due = { what: el.dataset.what, at, kind: el.dataset.kind }; el.textContent = dueText(due, true); el.className = 'chip ' + dueCls(due, true); });

  for (const [key, v] of Object.entries(S.visit)){ if (Number(key.split('|')[1]) !== T) continue; for (const d of visitMarks(v)){ if (d.at > now || now - d.at > GRACE) continue; const id = key + d.kind; if (S._dueSeen.has(id)) continue; S._dueSeen.add(id); const a = S.A.find(x => x.key === key); toast('warn', `<b>${esc(d.what)} due</b> — ${esc(a ? nm(a.mrn) : 'patient')}${v.bay ? ' · Bay ' + esc(v.bay) : ''}`); } }
}, 20000);

// ---------- load ----------
let _loading = null, _again = false;
async function reload(quiet){
  if (_loading){ _again = true; return _loading; } // one read at a time; changes during a read queue one more
  _loading = reload1(quiet);
  try { await _loading; } finally { _loading = null; if (_again){ _again = false; setTimeout(() => reload(true), 400); } }
}
async function reload1(quiet){
  if (!quiet) busy('Refreshing…');
  try {
    const d = await S.store.load();
    S.tables = d.tables; S.ref = d.ref || {}; S.besse = d.besse; S.besseSheet = d.besseSheet; S.dailyHdr = d.dailyHdr || null;
    const missing = ['patients','kits','appts'].filter(k => !S.tables[k]);
    if (missing.length){ S.loadErr = `Couldn’t find these tables in the workbook: ${missing.map(k => ({ patients:'Master Patient Tracker', kits:'Inventory', appts:'Appt List (NextGen)' }[k])).join(', ')}. The panel looks for their column headers.`; S.loaded = false; render(); return; }
    derive(); S.pull = S.store.getDoc('eskPull') || S.pull || {}; S.tasks = S.store.getDoc('eskTasks') || S.tasks || {}; S.notes = S.store.getDoc('eskNotes') || S.notes || {}; S.docs = S.store.getDoc('eskDocs') || S.docs || {}; S.visit = S.store.getDoc('eskVisit') || S.visit || {}; S.shared = S.store.getDoc('eskShared') || S.shared || {}; S.dailyDay = S.store.getDoc('eskDailyDay') || S.dailyDay || null; { const a = S.store.getDoc('eskAudit'); S.aud = mergeAud(S.aud, a); } S.loaded = true; S.loadErr = null; S.loadedAt = Date.now(); render();
  } catch (e){ console.error(e); const dbg = e && e.debugInfo ? [e.code, e.debugInfo.errorLocation, e.debugInfo.statement].filter(Boolean).join(' · ') : (e && e.code) || ''; S.loadErr = (e.message || String(e)) + (dbg ? ` (${dbg})` : ''); if (!S.loaded) render(); else toast('bad', esc(S.loadErr)); }
  finally { if (!quiet) busy(false); }
}

// ---------- full screen: an Office dialog; the pane stays open and does the Excel work ----------
const CH = 12000;
function sendChunks(fn, obj){ const s = JSON.stringify(obj); const id = Math.random().toString(36).slice(2); const n = Math.max(1, Math.ceil(s.length / CH)); for (let i = 0; i < n; i++) fn(JSON.stringify({ c: id, i, n, d: s.slice(i * CH, (i + 1) * CH) })); }
function makeRx(handler){ const buf = {}; return str => { let m; try { m = JSON.parse(str); } catch { return; } if (!m || !m.c) return; const b = buf[m.c] || (buf[m.c] = []); b[m.i] = m.d; if (b.filter(x => x != null).length === m.n){ delete buf[m.c]; try { handler(JSON.parse(b.join(''))); } catch (e){ console.error(e); } } }; }
function packLoad(d, store){
  const tables = {};
  for (const [k, tb] of Object.entries(d.tables)){
    let last = tb.values.length - 1; while (last >= 0 && !tb.snap(last).some(v => v !== null && v !== '')) last--;
    tables[k] = { name: tb.name, sheet: tb.sheet, headers: tb.headers, values: tb.values.slice(0, last + 1), fm: tb.formulas.slice(0, last + 1).map(r => r.map(x => isF(x) ? '1' : '0').join('')), fcol: tb.formulaCol };
  }
  return { tables, ref: d.ref, besse: d.besse, besseSheet: d.besseSheet, dailyHdr: d.dailyHdr || null, docs: { eskPull: store.getDoc('eskPull'), eskAudit: store.getDoc('eskAudit'), eskTasks: store.getDoc('eskTasks'), eskNotes: store.getDoc('eskNotes'), eskDocs: store.getDoc('eskDocs'), eskVisit: store.getDoc('eskVisit'), eskShared: store.getDoc('eskShared'), eskDailyDay: store.getDoc('eskDailyDay'), 'Office.AutoShowTaskpaneWithDocument': store.getDoc('Office.AutoShowTaskpaneWithDocument') } };
}
function hydrate(d){
  const tables = {};
  for (const [k, x] of Object.entries(d.tables)){ const tb = new Tbl(k, x.name, x.sheet, x.headers, x.values, x.fm.map(s => [...s].map(c => c === '1' ? '=' : ''))); tb.formulaCol = x.fcol; tables[k] = tb; }
  return { tables, ref: d.ref, besse: d.besse, besseSheet: d.besseSheet, dailyHdr: d.dailyHdr || null };
}
function RemoteStore(){
  const pend = new Map(); let docs = {}; let onChanged = null;
  const rx = makeRx(m => { if (m.rid && pend.has(m.rid)){ const p = pend.get(m.rid); pend.delete(m.rid); m.ok ? p.res(m.res) : p.rej(new Error(m.err)); } else if (m.ev === 'changed' && onChanged) onChanged(); });
  Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, a => rx(a.message));
  const up = obj => sendChunks(s => Office.context.ui.messageParent(s), obj);
  const call = (op, args) => new Promise((res, rej) => { const rid = Math.random().toString(36).slice(2); pend.set(rid, { res, rej }); up({ rid, op, args }); setTimeout(() => { if (pend.has(rid)){ pend.delete(rid); rej(new Error('Excel didn’t answer. Keep the ESK Tracker panel open behind this window, then try again.')); } }, 45000); });
  return {
    live: true, remote: true,
    async load(){ const d = await call('load'); docs = d.docs || {}; return hydrate(d); },
    update: (k, r, snap, ch) => call('update', [k, r, snap, ch]),
    add: (k, ch) => call('add', [k, ch]),
    setCells: (sh, cells) => call('setCells', [sh, cells]),
    clearCells: (k, cells) => call('clearCells', [k, cells]),
    getDoc: k => docs[k] ?? null,
    async setDoc(k, v){ docs[k] = v; await call('setDoc', [k, v]); },
    watch(cb){ onChanged = cb; },
    close(){ up({ ev: 'close' }); },
  };
}
let DLG = null;
function openFull(){
  if (DLG) return;
  const url = location.href.replace(/[?#].*$/, '') + '?mode=dialog';
  Office.context.ui.displayDialogAsync(url, { height: 96, width: 96, displayInIframe: true }, res => {
    if (res.status !== Office.AsyncResultStatus.Succeeded){ toast('bad', 'Couldn’t open full screen: ' + esc(res.error?.message || '')); return; }
    DLG = res.value; S.full = true; render();
    const reply = obj => { try { sendChunks(s => DLG && DLG.messageChild(s), obj); } catch (e){ console.error(e); } };
    const rx = makeRx(async m => {
      if (m.ev === 'close'){ try { DLG.close(); } catch {} DLG = null; S.full = false; reload(true); return; }
      const { rid, op, args } = m;
      try { if (!['load','update','add','setCells','setDoc','clearCells'].includes(op)) throw new Error('Unknown request'); let res; if (op === 'load'){ const d = await S.store.load(); res = packLoad(d, S.store); } else res = await S.store[op](...(args || [])); reply({ rid, ok: true, res: res ?? null }); }
      catch (e){ reply({ rid, ok: false, err: e.message || String(e) }); }
    });
    DLG.addEventHandler(Office.EventType.DialogMessageReceived, a => rx(a.message));
    DLG.addEventHandler(Office.EventType.DialogEventReceived, () => { DLG = null; S.full = false; reload(true); });
    S.notifyDialog = () => reply({ ev: 'changed' });
  });
}

(function boot(){
  const demo = true;
  S.mode = /[?&]mode=dialog\b/.test(location.search) ? 'dialog' : demo ? 'demo' : 'pane';
  const start = store => { S.store = store; render(); reload(true).then(() => store.watch?.(() => { clearTimeout(S._w); S._w = setTimeout(() => { if (DLG && S.notifyDialog){ S.notifyDialog(); return; } if ($('#modal').hidden && $('#busy').hidden) reload(true); }, 1500); })); };
  if (S.mode === 'dialog'){ if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; } Office.onReady(() => start(RemoteStore())); return; }
  if (demo){ start(DemoStore()); return; }
  if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; }
  let settled = false;
  Office.onReady(info => { settled = true; if (info.host === Office.HostType.Excel){ try { S.canFull = Office.context.requirements.isSetSupported('DialogApi', '1.2'); } catch { S.canFull = false; } start(OfficeStore()); if (S.canFull && CFG.autoFull) setTimeout(openFull, 600); } else $('#app').innerHTML = notInExcelHTML(); });
  setTimeout(() => { if (!settled) $('#app').innerHTML = notInExcelHTML(); }, 4000);
})();
