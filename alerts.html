<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESK Alerts</title>
<link rel="icon" href="assets/icon-32.png">
<style>
:root{--ink:#16201b;--muted:#5b6660;--line:#d9ded9;--bg:#f6f5f1;--surface:#fff;--ok:#1d6b46;--ok-soft:#e3f1e9;--warn:#8a5a00;--warn-soft:#fbf0d9;--bad:#a3302a;--bad-soft:#f8e3e1;--accent:#b5532f}
@media (prefers-color-scheme:dark){:root{--ink:#e9ece9;--muted:#a3aca6;--line:#38413c;--bg:#151a17;--surface:#1d231f;--ok:#7fd1a5;--ok-soft:#1f3529;--warn:#f0c46a;--warn-soft:#3a2f17;--bad:#f19a92;--bad-soft:#3d2120}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:460px;margin:0 auto;padding:18px}
h1{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h1 img{width:22px;height:22px}
.st{padding:10px 12px;border-radius:10px;margin:0 0 12px;font-weight:600}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0}
h2{font-size:14px;margin:18px 0 6px;color:var(--muted);font-weight:600}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
li time{color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1><img src="assets/icon-32.png" alt="">ESK Alerts</h1>
  <p id="st" class="st warn" role="status">Connecting to the ESK Tracker…</p>
  <p id="perm" class="hint"></p>
  <div class="row"><button id="on" class="primary">Turn on pop-ups and sound</button><button id="test">Test</button></div>
  <p class="hint">Keep this window open while you work. Minimizing it is fine. Pop-ups show the bay and time, never the patient.</p>
  <h2>Today</h2>
  <ol id="log" aria-live="polite"></ol>
</main>
<script>
// Opened by the ESK Tracker panel (window.open). Browsers won't let the panel, a frame inside Excel, ask for pop-up permission;
// this window is a normal page on the same site, so it can. The panel posts { esk:'alert' | 'hb' } here; this window says
// hello to it every 10 s so a reloaded panel finds the window again. Messages from any other site are ignored.
const ORIGIN = location.origin, STALE = 150000;   // background windows can throttle timers to once a minute
let lastHb = 0, ctx = null, enabled = false;   // browsers need one click in this window before it can play sound
const $ = id => document.getElementById(id);
const perm = () => 'Notification' in window ? Notification.permission : 'unsupported';
function hello(){ try { if (window.opener && !window.opener.closed) window.opener.postMessage({ esk: 'alerts-hello' }, ORIGIN); } catch {} }
function status(){
  const live = Date.now() - lastHb < STALE, st = $('st');
  if (!window.opener || window.opener.closed){ st.className = 'st bad'; st.textContent = 'Not connected. In the ESK Tracker panel, click “Alerts window” to reconnect.'; }
  else if (!live){ st.className = 'st warn'; st.textContent = 'Waiting for the ESK Tracker panel… Keep the workbook open.'; }
  else if (!enabled){ st.className = 'st warn'; st.textContent = 'Connected. Click “Turn on pop-ups and sound” once.'; }
  else { st.className = 'st ok'; st.textContent = 'Connected. Watching for vitals.'; }
  $('perm').textContent = { granted: 'Pop-ups: allowed.', denied: 'Pop-ups are blocked for this site. Click the lock icon by the address, set Notifications to Allow, then reload this window. The sound still plays.', unsupported: 'This browser can’t show pop-ups. The sound still plays.' }[perm()] || 'Pop-ups: not set up yet.';
  $('on').hidden = enabled;
}
function chime(){
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880;
    g.gain.setValueAtTime(.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .4); o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .4); } catch {}
}
function sound(m){ if (m.sound === 'none') return; if (!m.snd) return chime(); const a = new Audio(m.snd); a.play().catch(chime); }
function log(text){
  const li = document.createElement('li'), t = document.createElement('time'), d = new Date();
  t.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); li.append(t, text); $('log').prepend(li);
  while ($('log').children.length > 40) $('log').lastChild.remove();
}
function fire(m){
  const title = String(m.title || 'ESK Tracker').slice(0, 120), body = String(m.body || '').slice(0, 120);
  sound(m); log(title + (body ? ' · ' + body : ''));
  if (perm() === 'granted') try { const n = new Notification(title, { body, tag: String(m.tag || ''), icon: 'assets/icon-80.png', requireInteraction: !!m.sticky }); n.onclick = () => { window.focus(); n.close(); }; } catch {}
  if (document.hidden){ const t0 = document.title; let i = 0; const f = setInterval(() => { document.title = i++ % 2 ? t0 : '● ' + title; if (!document.hidden || i > 20){ clearInterval(f); document.title = t0; } }, 1000); }
}
addEventListener('message', e => {
  if (e.origin !== ORIGIN || !e.data || typeof e.data !== 'object') return;
  if (e.data.esk === 'hb'){ lastHb = Date.now(); status(); }
  else if (e.data.esk === 'alert'){ lastHb = Date.now(); fire(e.data); status(); }
});
$('on').onclick = async () => {
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); } catch {}   // this click unlocks sound
  if (perm() === 'default') try { await Notification.requestPermission(); } catch {}
  enabled = true; status();
};
$('test').onclick = () => { $('on').onclick(); fire({ title: 'Final vitals due · test', body: 'Bay 1', tag: 'esk-test' }); };
document.addEventListener('click', () => { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {} });
hello(); setInterval(() => { hello(); status(); }, 10000); status();
</script>
</body>
</html>
